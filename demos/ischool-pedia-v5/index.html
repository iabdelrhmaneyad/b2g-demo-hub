<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>iSchool Pedia — Prototype V5</title>
<link rel="icon" type="image/png" href="../../assets/img/iSchool Logo-colors.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Baloo+Bhaijaan+2:wght@500;600;700&display=swap" rel="stylesheet">
<style>
#proto-bar{position:sticky;top:0;z-index:1000;display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding:8px 16px;background:#032F82;color:#fff;font-family:'Somar Rounded','IBM Plex Sans Arabic',sans-serif;font-size:14px}
#proto-bar b{font-family:'Somar Rounded','Baloo Bhaijaan 2',sans-serif;font-size:15px}
#proto-bar .tag{background:#FFD700;color:#14213D;border-radius:999px;padding:2px 10px;font-size:12px;font-weight:700}
#proto-bar select{font-family:inherit;font-size:14px;padding:6px 10px;border-radius:8px;border:0;min-height:36px;max-width:100%}
#proto-bar button{font-family:inherit;font-size:14px;padding:6px 12px;min-height:36px;border-radius:8px;border:1px solid rgba(255,255,255,.3);background:transparent;color:#fff;cursor:pointer}
#proto-bar button:hover{background:rgba(255,255,255,.1)}
#proto-bar .sp{flex:1}
#proto-bar .count{color:#B1D1E6}
html[dir=ltr] #screen > div{flex-direction:row!important}
@media (min-width:888px){#screen .nv{top:52px!important;max-height:calc(100vh - 52px)!important}}
#proto-bar .lang{background:#FFD700;color:#14213D;border-color:#FFD700;font-weight:700}
#proto-bar .lang:hover{background:#FFE14D}
</style>
<style id="screen-css"></style>
<style>#screen.pd-still main>*,#screen.pd-still .pd-page>*,#screen.pd-still .steps>li,#screen.pd-still .fc>*,#screen.pd-still .fc>svg path,#screen .pd-seen{animation:none!important}</style>
</head>
<body>
<div id="proto-bar" role="navigation" aria-label="شاشات النموذج">
<b style="display:flex;align-items:center;gap:6px;">iSchool Pedia <span class="tag" style="background:#FFD700;color:#14213D;">V5 Prototype</span></b>
<a href="../../index.html" id="ischool-pedia-hub-link" style="color:#FFD700; text-decoration:none; font-weight:700; font-size:13px; display:inline-flex; align-items:center; gap:6px; margin-inline-start:12px; background:rgba(255,255,255,0.12); padding:4px 12px; border-radius:8px;" title="العودة إلى البوابة الرئيسية">← العودة إلى B2G Demo Hub</a>
<span class="sp"></span>
<button type="button" id="proto-lang" class="lang"></button>
<label for="proto-pick" class="count" id="proto-lbl"></label>
<select id="proto-pick"></select>
<button type="button" id="proto-prev"></button>
<button type="button" id="proto-next"></button>
<span class="count" id="proto-pos"></span>
</div>
<div id="screen"></div>
<script type="text/x-tpl" id="tpl-Dashboard">

<div dir="rtl" class="pd-app">
<div class="pd-side">
<dc-import name="AppNav" active="dashboard" role="{{role}}" org="{{org}}" on-role="{{setRole}}" on-org="{{setOrg}}" hint-size="260px,1100px"></dc-import>
</div>
<main class="pd-main" id="main">
<div class="pd-page">

<section class="hero" aria-labelledby="h-hi">
<span class="ring" aria-hidden="true"></span><span class="ball" aria-hidden="true"></span>
<div style="position: relative; flex: 1 1 320px; min-width: 0; display: flex; flex-direction: column; gap: 8px; padding-inline-end: 140px">
<span class="chip chip-dark" style="align-self: flex-start">الخميس 15 أكتوبر 2026 · {{orgName}}</span>
<h1 id="h-hi" class="pd-h1" style="color: #fff; font-size: 30px">صباح الخير يا {{who}}</h1>
<p style="margin: 0; font-size: 14.5px; font-weight: 600; color: #fff">{{roleLine}}</p>
<div style="display: flex; flex-wrap: wrap; gap: 8px; margin-top: 6px">
<a href="Guide.dc.html" class="btn btn-accent">افتح الدليل</a>
<a href="LiveUpdates.dc.html" class="btn btn-dark" style="border-color: rgba(255,255,255,0.4)">التحديثات المباشرة</a>
</div>
</div>
</section>

<div style="position: relative">
<form role="search" class="gsearch" onSubmit="{{submitQ}}">
<svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#043FAD" stroke-width="2.2" stroke-linecap="round" style="flex: none"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg>
<label for="gq" class="pd-sr">بحث شامل</label>
<input id="gq" type="search" value="{{q}}" onInput="{{onQ}}" autocomplete="off" placeholder="ابحث في الدليل والمشكلات والتحديثات والسجل — مثال: المحتوى، الغياب، المشروع">
<template data-sc="if" value="{{hasQ}}" hint-placeholder-val="{{ false }}"><button type="button" class="btn btn-ghost btn-sm" onClick="{{clearQ}}">مسح</button></template>
</form>
<template data-sc="if" value="{{hasQ}}" hint-placeholder-val="{{ false }}">
<div class="card pd-in" style="margin-top: 8px; overflow: hidden; box-shadow: var(--pd-shadow-lg)" aria-live="polite">
<div style="display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding: 12px 20px; border-bottom: 1px solid var(--pd-line-2)">
<span style="font-size: 13px; color: var(--pd-muted); flex: 1">{{resultCount}} نتيجة لـ «{{q}}»</span>
<template data-sc="for" list="{{kinds}}" as="k" hint-placeholder-count="3"><span class="chip {{k.cls}}">{{k.label}} · {{k.n}}</span></template>
</div>
<div class="pd-list">
<template data-sc="for" list="{{results}}" as="r" hint-placeholder-count="4">
<a href="{{r.href}}" class="pd-row" onClick="{{r.go}}">
<span class="chip {{r.cls}}" style="min-width: 56px; justify-content: center">{{r.kind}}</span>
<span style="display: flex; flex-direction: column; gap: 2px; flex: 1; min-width: 0"><span style="font-weight: 600">{{r.title}}</span><span style="font-size: 13px; color: var(--pd-muted)">{{r.meta}}</span></span>
</a>
</template>
</div>
<template data-sc="if" value="{{noResults}}" hint-placeholder-val="{{ false }}">
<div class="empty"><span class="e-ic" aria-hidden="true">?</span><span class="e-t">لا توجد نتائج</span><span>جرّب كلمة أخرى، أو تصفّح مواضيع الدليل.</span><a href="Guide.dc.html" class="btn btn-primary btn-sm">افتح الدليل</a></div>
</template>
</div>
</template>
</div>

<section aria-labelledby="h-att" style="display: flex; flex-direction: column; gap: 10px">
<h2 id="h-att" class="pd-h2">يحتاج انتباهك</h2>
<div class="pd-grid" style="--min: 240px; gap: 10px">
<template data-sc="for" list="{{attention}}" as="t" hint-placeholder-count="3">
<a href="{{t.href}}" class="att lift" onClick="{{t.go}}" style="border-color: {{t.line}}">
<span class="ic" style="background: {{t.bg}}; color: {{t.fg}}">{{t.n}}</span>
<span style="display: flex; flex-direction: column; min-width: 0"><b style="font-size: 14.5px">{{t.title}}</b><span style="font-size: 12.5px; color: var(--pd-muted)">{{t.sub}}</span></span>
</a>
</template>
</div>
</section>

<div class="pd-grid" style="--min: 170px; gap: 12px">
<template data-sc="for" list="{{kpis}}" as="k" hint-placeholder-count="4">
<a href="{{k.href}}" class="card kpi" style="border-color: {{k.line}}"><span class="k-l" style="color: {{k.lc}}">{{k.label}}</span><span class="k-v" style="color: {{k.vc}}">{{k.v}}</span><span class="k-s">{{k.sub}}</span></a>
</template>
</div>

<div class="pd-split">
<section class="card pd-body" style="gap: 0; overflow: hidden" aria-labelledby="h-iss">
<div class="pd-sec-h"><h2 id="h-iss" class="pd-h2">مشكلات معروفة الآن</h2><a href="Issues.dc.html" style="font-size: 14px; font-weight: 600">كل المشكلات ←</a></div>
<div class="pd-list">
<template data-sc="for" list="{{issues}}" as="i" hint-placeholder-count="4">
<a href="Issues.dc.html" class="pd-row">
<span class="chip {{i.cls}}"><span class="dot"></span>{{i.status}}</span>
<span style="display: flex; flex-direction: column; gap: 2px; flex: 1; min-width: 0"><span style="font-weight: 600">{{i.title}}</span><span style="font-size: 13px; color: var(--pd-muted)">{{i.meta}}</span></span>
</a>
</template>
</div>
<template data-sc="if" value="{{noIssues}}" hint-placeholder-val="{{ false }}"><div class="empty"><span class="e-ic" aria-hidden="true">✓</span><span class="e-t">لا توجد مشكلات نشطة لهذه المؤسسة</span></div></template>
</section>

<section class="card pd-aside" style="overflow: hidden" aria-labelledby="h-act">
<div class="pd-sec-h"><h2 id="h-act" class="pd-h2">آخر ما أُرسل للطلاب</h2><a href="Activities.dc.html" style="font-size: 14px; font-weight: 600">السجل ←</a></div>
<div class="pd-list">
<template data-sc="for" list="{{acts}}" as="a" hint-placeholder-count="4">
<a href="Activities.dc.html" class="pd-row">
<span class="chip {{a.cls}}" style="min-width: 48px; justify-content: center">{{a.type}}</span>
<span style="display: flex; flex-direction: column; gap: 2px; flex: 1; min-width: 0"><span style="font-weight: 600; font-size: 14px">{{a.desc}}</span><span style="font-size: 13px; color: var(--pd-muted)">{{a.meta}}</span></span>
</a>
</template>
</div>
<template data-sc="if" value="{{noActs}}" hint-placeholder-val="{{ false }}"><div class="empty"><span class="e-t">لا مراسلات لهذه المؤسسة بعد</span></div></template>
</section>
</div>

<section class="card" style="overflow: hidden" aria-labelledby="h-top">
<div class="pd-sec-h"><h2 id="h-top" class="pd-h2">أكثر ما يسأل عنه الطلاب</h2><span style="font-size: 13px; color: var(--pd-muted)">تذاكر سبتمبر · افتح الموضوع مباشرة</span></div>
<div class="pd-list">
<template data-sc="for" list="{{top}}" as="t" hint-placeholder-count="5">
<a href="Guide.dc.html" class="pd-row" onClick="{{t.go}}" style="align-items: center">
<span style="flex: 1 1 200px; min-width: 0; display: flex; flex-direction: column; gap: 6px"><span style="font-weight: 600">{{t.title}}</span><span class="bar" aria-hidden="true"><span style="width: {{t.pct}}%"></span></span></span>
<span style="font-size: 13px; color: var(--pd-muted); white-space: nowrap">{{t.n}} تذكرة</span>
</a>
</template>
</div>
</section>

<nav aria-label="انتقال سريع للأقسام" style="display: flex; flex-wrap: wrap; gap: 8px">
<template data-sc="for" list="{{quick}}" as="s" hint-placeholder-count="5"><a href="{{s.href}}" class="qlink lift"><span class="n">{{s.n}}</span>{{s.label}}</a></template>
</nav>

</div>
</main>
</div>
</script>
<script type="text/x-css" id="css-Dashboard">
/* == PD DS START == iSchool Pedia design system v1 — single source: scratchpad/ds/design_system.css (injected by apply_ds.py) */
:root{--pd-sky:#05ACFF;--pd-sun:#FFBB1C;--pd-rust:#C76316;--pd-ice:#B1D1E6;--pd-blue:#056FEC;--pd-blue-d:#043FAD;--pd-blue-dd:#032F82;--pd-yellow:#FFD700;--pd-orange:#FF7F1C;--pd-ink:#14213D;--pd-ink-2:#273248;--pd-ink-3:#3B465C;--pd-muted:#5A6478;--pd-canvas:#ECF8FF;--pd-surface:#FFFFFF;--pd-sunk:#F5FAFE;--pd-line:#CAE2F0;--pd-line-2:#E6F0F9;--pd-line-3:#C9DCEE;--pd-tint:#ECF8FF;--pd-ok:#0F6B3A;--pd-ok-bg:#E9F7EF;--pd-ok-line:#9CCFB2;--pd-warn:#7A5200;--pd-warn-bg:#FFF7D1;--pd-warn-line:#FFE16B;--pd-bad:#A14A06;--pd-bad-bg:#FFEEDF;--pd-bad-line:#FFC9A0;--pd-info:#03679A;--pd-info-bg:#E1F5FF;--pd-r-sm:10px;--pd-r:14px;--pd-r-lg:22px;--pd-shadow:0 1px 2px rgba(4,63,173,.05),0 1px 1px rgba(20,33,61,.03);--pd-shadow-lg:0 12px 32px -16px rgba(4,63,173,.35);--pd-head:'Somar Rounded','Baloo Bhaijaan 2',sans-serif;--pd-body:'Somar Rounded','IBM Plex Sans Arabic',sans-serif}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--pd-canvas)}
.pd-main a{text-decoration:none}.pd-main a:not([class]){color:var(--pd-blue-d);text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:3px;text-decoration-color:rgba(4,63,173,.35)}.pd-main a:not([class]):hover{color:var(--pd-blue-dd);text-decoration-color:currentColor}
.pd-main a.pd-row,.pd-main a.card,.pd-main a.kpi,.pd-main a.att,.pd-main a.qlink{color:var(--pd-ink)}
.pd-main a.btn:hover,.pd-main a.card:hover,.pd-main a.pd-row:hover,.pd-main a.chip:hover,.pd-main a.kpi:hover{text-decoration:none}
:focus-visible{outline:3px solid var(--pd-blue);outline-offset:2px}
.pd-sr{position:absolute!important;width:1px!important;height:1px!important;overflow:hidden!important;clip:rect(0 0 0 0)!important;white-space:nowrap!important}
/* shell */
.pd-app{font-family:var(--pd-body);color:var(--pd-ink);background:var(--pd-canvas);min-height:100vh;display:flex;flex-wrap:wrap;flex-direction:row-reverse}
.pd-side{flex:1 1 248px;background:var(--pd-blue-d)}
.pd-main{flex:999 1 640px;min-width:0;box-sizing:border-box;padding:24px 28px 72px}
.pd-page{max-width:1240px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
.pd-head{display:flex;flex-wrap:wrap;align-items:flex-end;gap:12px 16px}
.pd-head-t{flex:1 1 320px;min-width:0;display:flex;flex-direction:column;gap:4px}
.pd-crumbs{display:flex;flex-wrap:wrap;align-items:center;gap:6px;font-size:13px;color:var(--pd-muted);margin:0;padding:0;list-style:none}
.pd-crumbs a{color:var(--pd-muted)}.pd-crumbs a:hover{color:var(--pd-blue-d)}
.pd-crumbs li+li::before{content:"‹";margin-inline-end:6px;color:var(--pd-line-3)}
.pd-h1{margin:0;font-family:var(--pd-head);font-size:28px;line-height:1.3;font-weight:700;color:var(--pd-ink)}
.pd-lead{margin:0;font-size:14.5px;line-height:1.7;color:var(--pd-muted);max-width:72ch}
.pd-actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.pd-h2{margin:0;font-family:var(--pd-head);font-size:18px;line-height:1.4;font-weight:700}
.pd-h3{margin:0;font-size:15px;font-weight:700}
.pd-eyebrow{font-size:12px;font-weight:700;letter-spacing:.3px;color:var(--pd-muted)}
.pd-muted{color:var(--pd-muted)}
/* surfaces */
.card{background:var(--pd-surface);border:1px solid var(--pd-line);border-radius:var(--pd-r-lg);box-shadow:var(--pd-shadow)}
.pd-pad{padding:18px 20px}
.pd-sec-h{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;padding:16px 20px;border-bottom:1px solid var(--pd-line-2)}
.pd-sec-h .pd-h2{flex:1;min-width:0}
.pd-grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(min(100%,var(--min,260px)),1fr))}
.pd-split{display:flex;flex-wrap:wrap;gap:20px;align-items:flex-start}
.pd-split>.pd-aside{flex:1 1 340px;min-width:0}
.pd-split>.pd-body{flex:999 1 560px;min-width:0;display:flex;flex-direction:column;gap:16px}
@media (min-width:1100px){.pd-sticky{position:sticky;top:16px}}
/* buttons */
.btn{font-family:inherit;font-size:14px;font-weight:600;line-height:1.2;padding:10px 18px;min-height:44px;box-sizing:border-box;border-radius:999px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--pd-line-3);background:var(--pd-surface);color:var(--pd-ink-2);text-decoration:none;white-space:nowrap}
.btn:hover{border-color:var(--pd-blue);color:var(--pd-blue-d);text-decoration:none}
.btn-primary{background:var(--pd-blue);border-color:var(--pd-blue);color:#fff}.btn-primary:hover{background:var(--pd-blue-d);border-color:var(--pd-blue-d);color:#fff}
.btn-dark{background:var(--pd-blue-d);border-color:var(--pd-blue-d);color:#fff}.btn-dark:hover{background:var(--pd-blue-dd);border-color:var(--pd-blue-dd);color:#fff}
.btn-accent{background:var(--pd-yellow);border-color:var(--pd-yellow);color:var(--pd-ink)}.btn-accent:hover{background:#FFE14D;border-color:#FFE14D;color:var(--pd-ink)}
.btn-ok{background:var(--pd-ok);border-color:var(--pd-ok);color:#fff}.btn-ok:hover{filter:brightness(1.08);color:#fff}
.btn-ghost{background:transparent;border-color:transparent;color:var(--pd-blue-d)}.btn-ghost:hover{background:var(--pd-tint);border-color:transparent}
.btn-danger{color:var(--pd-bad)}.btn-danger:hover{border-color:var(--pd-bad);color:var(--pd-bad);background:var(--pd-bad-bg)}
.btn-sm{min-height:36px;padding:6px 14px;font-size:13px}
.btn-block{width:100%}
.btn:disabled,.btn[aria-disabled=true]{opacity:.45;cursor:not-allowed;filter:none}
.btn.is-done{background:var(--pd-ok);border-color:var(--pd-ok);color:#fff}
/* chips & badges */
.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:600;line-height:1.6;white-space:nowrap;background:var(--pd-line-2);color:var(--pd-ink-3)}
.chip-brand{background:var(--pd-tint);color:var(--pd-blue-d)}.chip-ok{background:var(--pd-ok-bg);color:var(--pd-ok)}.chip-warn{background:var(--pd-warn-bg);color:var(--pd-warn)}.chip-bad{background:var(--pd-bad-bg);color:var(--pd-bad)}.chip-info{background:var(--pd-info-bg);color:var(--pd-info)}.chip-dark{background:var(--pd-blue-d);color:#fff}.chip-accent{background:var(--pd-yellow);color:var(--pd-ink)}
.dot{width:8px;height:8px;border-radius:50%;flex:none;display:inline-block;background:currentColor}
/* segmented filters / tabs */
.seg{display:inline-flex;flex-wrap:wrap;gap:4px;padding:4px;border-radius:999px;background:var(--pd-surface);border:1px solid var(--pd-line)}
.seg>button,.seg>a{font-family:inherit;font-size:13.5px;font-weight:600;min-height:36px;padding:0 14px;border-radius:999px;border:0;background:transparent;color:var(--pd-ink-3);cursor:pointer;display:inline-flex;align-items:center;gap:6px;text-decoration:none}
.seg>button:hover{background:var(--pd-tint);color:var(--pd-blue-d)}
.seg>[aria-pressed=true],.seg>[aria-selected=true],.seg>[aria-current=page]{background:var(--pd-blue-d);color:#fff}
.seg .n{font-size:11px;font-weight:700;padding:0 7px;border-radius:999px;background:rgba(20,33,61,.08);line-height:18px}
.seg>[aria-pressed=true] .n,.seg>[aria-selected=true] .n{background:#fff;color:var(--pd-blue-d)}
/* toolbar */
.pd-toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.pd-search{position:relative;flex:1 1 260px;min-width:0}
.pd-search>svg{position:absolute;inset-inline-start:14px;top:50%;transform:translateY(-50%);color:var(--pd-muted);pointer-events:none}
.pd-search>.inp{padding-inline-start:40px;border-radius:999px}
/* forms */
.inp{width:100%;box-sizing:border-box;font-family:inherit;font-size:14.5px;line-height:1.6;padding:9px 14px;border:1px solid var(--pd-line-3);border-radius:12px;background:var(--pd-surface);color:var(--pd-ink);min-height:44px;transition:border-color .15s,box-shadow .15s}
.inp:hover{border-color:#9DBCDB}.inp:focus{border-color:var(--pd-blue);box-shadow:0 0 0 3px rgba(5,111,236,.15);outline:none}
.inp[aria-invalid=true]{border-color:var(--pd-bad);box-shadow:0 0 0 3px rgba(161,74,6,.12)}
textarea.inp{resize:vertical}
.lbl{display:block;font-size:13px;font-weight:600;color:var(--pd-ink-3);margin-bottom:6px}
.lbl .req{color:var(--pd-bad)}
.hint{font-size:12.5px;color:var(--pd-muted);margin-top:4px}
.err{font-size:13px;color:var(--pd-bad);font-weight:600}
.pd-form{display:flex;flex-direction:column;gap:14px}
.pd-form-row{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr))}
.pd-form-actions{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding-top:4px}
/* notes / banners */
.note{display:flex;gap:10px;align-items:flex-start;padding:12px 16px;border-radius:var(--pd-r);font-size:14px;line-height:1.7;border:1px solid var(--pd-line);background:var(--pd-sunk);color:var(--pd-ink-2)}
.note-info{background:var(--pd-tint);border-color:#B1D1E6;color:var(--pd-blue-d)}.note-warn{background:var(--pd-warn-bg);border-color:var(--pd-warn-line);color:#5C3D00}.note-ok{background:var(--pd-ok-bg);border-color:var(--pd-ok-line);color:var(--pd-ok)}.note-bad{background:var(--pd-bad-bg);border-color:var(--pd-bad-line);color:var(--pd-bad)}
/* kpi */
.kpi{display:flex;flex-direction:column;gap:2px;padding:16px 18px;text-align:start;font-family:inherit;color:inherit;text-decoration:none}
.kpi .k-l{font-size:13px;color:var(--pd-muted)}.kpi .k-v{font-family:var(--pd-head);font-size:30px;font-weight:700;line-height:1.2}.kpi .k-s{font-size:12.5px;color:var(--pd-muted)}
a.kpi:hover,button.kpi:hover{text-decoration:none}

<script type="text/x-tpl" id="tpl-LiveUpdates">

<div dir="rtl" class="pd-app">

/* shell */
.pd-app{font-family:var(--pd-body);color:var(--pd-ink);background:var(--pd-canvas);min-height:100vh;display:flex;flex-wrap:wrap;flex-direction:row-reverse}
.pd-side{flex:1 1 248px;background:var(--pd-blue-d)}
.pd-main{flex:999 1 640px;min-width:0;box-sizing:border-box;padding:24px 28px 72px}
.pd-page{max-width:1240px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
.pd-head{display:flex;flex-wrap:wrap;align-items:flex-end;gap:12px 16px}
.pd-head-t{flex:1 1 320px;min-width:0;display:flex;flex-direction:column;gap:4px}
.pd-crumbs{display:flex;flex-wrap:wrap;align-items:center;gap:6px;font-size:13px;color:var(--pd-muted);margin:0;padding:0;list-style:none}
.pd-crumbs a{color:var(--pd-muted)}.pd-crumbs a:hover{color:var(--pd-blue-d)}
.pd-crumbs li+li::before{content:"‹";margin-inline-end:6px;color:var(--pd-line-3)}
.pd-h1{margin:0;font-family:var(--pd-head);font-size:28px;line-height:1.3;font-weight:700;color:var(--pd-ink)}
.pd-lead{margin:0;font-size:14.5px;line-height:1.7;color:var(--pd-muted);max-width:72ch}
.pd-actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.pd-h2{margin:0;font-family:var(--pd-head);font-size:18px;line-height:1.4;font-weight:700}
.pd-h3{margin:0;font-size:15px;font-weight:700}
.pd-eyebrow{font-size:12px;font-weight:700;letter-spacing:.3px;color:var(--pd-muted)}
.pd-muted{color:var(--pd-muted)}
/* surfaces */
.card{background:var(--pd-surface);border:1px solid var(--pd-line);border-radius:var(--pd-r-lg);box-shadow:var(--pd-shadow)}
.pd-pad{padding:18px 20px}
.pd-sec-h{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;padding:16px 20px;border-bottom:1px solid var(--pd-line-2)}
.pd-sec-h .pd-h2{flex:1;min-width:0}
.pd-grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(min(100%,var(--min,260px)),1fr))}
.pd-split{display:flex;flex-wrap:wrap;gap:20px;align-items:flex-start}
.pd-split>.pd-aside{flex:1 1 340px;min-width:0}
.pd-split>.pd-body{flex:999 1 560px;min-width:0;display:flex;flex-direction:column;gap:16px}
@media (min-width:1100px){.pd-sticky{position:sticky;top:16px}}
/* buttons */
.btn{font-family:inherit;font-size:14px;font-weight:600;line-height:1.2;padding:10px 18px;min-height:44px;box-sizing:border-box;border-radius:999px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--pd-line-3);background:var(--pd-surface);color:var(--pd-ink-2);text-decoration:none;white-space:nowrap}
.btn:hover{border-color:var(--pd-blue);color:var(--pd-blue-d);text-decoration:none}
.btn-primary{background:var(--pd-blue);border-color:var(--pd-blue);color:#fff}.btn-primary:hover{background:var(--pd-blue-d);border-color:var(--pd-blue-d);color:#fff}
.btn-dark{background:var(--pd-blue-d);border-color:var(--pd-blue-d);color:#fff}.btn-dark:hover{background:var(--pd-blue-dd);border-color:var(--pd-blue-dd);color:#fff}
.btn-accent{background:var(--pd-yellow);border-color:var(--pd-yellow);color:var(--pd-ink)}.btn-accent:hover{background:#FFE14D;border-color:#FFE14D;color:var(--pd-ink)}
.btn-ok{background:var(--pd-ok);border-color:var(--pd-ok);color:#fff}.btn-ok:hover{filter:brightness(1.08);color:#fff}
.btn-ghost{background:transparent;border-color:transparent;color:var(--pd-blue-d)}.btn-ghost:hover{background:var(--pd-tint);border-color:transparent}
.btn-danger{color:var(--pd-bad)}.btn-danger:hover{border-color:var(--pd-bad);color:var(--pd-bad);background:var(--pd-bad-bg)}
.btn-sm{min-height:36px;padding:6px 14px;font-size:13px}
.btn-block{width:100%}
.btn:disabled,.btn[aria-disabled=true]{opacity:.45;cursor:not-allowed;filter:none}
.btn.is-done{background:var(--pd-ok);border-color:var(--pd-ok);color:#fff}
/* chips & badges */
.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:600;line-height:1.6;white-space:nowrap;background:var(--pd-line-2);color:var(--pd-ink-3)}
.chip-brand{background:var(--pd-tint);color:var(--pd-blue-d)}.chip-ok{background:var(--pd-ok-bg);color:var(--pd-ok)}.chip-warn{background:var(--pd-warn-bg);color:var(--pd-warn)}.chip-bad{background:var(--pd-bad-bg);color:var(--pd-bad)}.chip-info{background:var(--pd-info-bg);color:var(--pd-info)}.chip-dark{background:var(--pd-blue-d);color:#fff}.chip-accent{background:var(--pd-yellow);color:var(--pd-ink)}
.dot{width:8px;height:8px;border-radius:50%;flex:none;display:inline-block;background:currentColor}
/* segmented filters / tabs */
.seg{display:inline-flex;flex-wrap:wrap;gap:4px;padding:4px;border-radius:999px;background:var(--pd-surface);border:1px solid var(--pd-line)}
.seg>button,.seg>a{font-family:inherit;font-size:13.5px;font-weight:600;min-height:36px;padding:0 14px;border-radius:999px;border:0;background:transparent;color:var(--pd-ink-3);cursor:pointer;display:inline-flex;align-items:center;gap:6px;text-decoration:none}
.seg>button:hover{background:var(--pd-tint);color:var(--pd-blue-d)}
.seg>[aria-pressed=true],.seg>[aria-selected=true],.seg>[aria-current=page]{background:var(--pd-blue-d);color:#fff}
.seg .n{font-size:11px;font-weight:700;padding:0 7px;border-radius:999px;background:rgba(20,33,61,.08);line-height:18px}
.seg>[aria-pressed=true] .n,.seg>[aria-selected=true] .n{background:#fff;color:var(--pd-blue-d)}
/* toolbar */
.pd-toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.pd-search{position:relative;flex:1 1 260px;min-width:0}
.pd-search>svg{position:absolute;inset-inline-start:14px;top:50%;transform:translateY(-50%);color:var(--pd-muted);pointer-events:none}
.pd-search>.inp{padding-inline-start:40px;border-radius:999px}
/* forms */
.inp{width:100%;box-sizing:border-box;font-family:inherit;font-size:14.5px;line-height:1.6;padding:9px 14px;border:1px solid var(--pd-line-3);border-radius:12px;background:var(--pd-surface);color:var(--pd-ink);min-height:44px;transition:border-color .15s,box-shadow .15s}
.inp:hover{border-color:#9DBCDB}.inp:focus{border-color:var(--pd-blue);box-shadow:0 0 0 3px rgba(5,111,236,.15);outline:none}
.inp[aria-invalid=true]{border-color:var(--pd-bad);box-shadow:0 0 0 3px rgba(161,74,6,.12)}
textarea.inp{resize:vertical}
.lbl{display:block;font-size:13px;font-weight:600;color:var(--pd-ink-3);margin-bottom:6px}
.lbl .req{color:var(--pd-bad)}
.hint{font-size:12.5px;color:var(--pd-muted);margin-top:4px}
.err{font-size:13px;color:var(--pd-bad);font-weight:600}
.pd-form{display:flex;flex-direction:column;gap:14px}
.pd-form-row{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr))}
.pd-form-actions{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding-top:4px}
/* notes / banners */
.note{display:flex;gap:10px;align-items:flex-start;padding:12px 16px;border-radius:var(--pd-r);font-size:14px;line-height:1.7;border:1px solid var(--pd-line);background:var(--pd-sunk);color:var(--pd-ink-2)}
.note-info{background:var(--pd-tint);border-color:#B1D1E6;color:var(--pd-blue-d)}.note-warn{background:var(--pd-warn-bg);border-color:var(--pd-warn-line);color:#5C3D00}.note-ok{background:var(--pd-ok-bg);border-color:var(--pd-ok-line);color:var(--pd-ok)}.note-bad{background:var(--pd-bad-bg);border-color:var(--pd-bad-line);color:var(--pd-bad)}
/* kpi */
.kpi{display:flex;flex-direction:column;gap:2px;padding:16px 18px;text-align:start;font-family:inherit;color:inherit;text-decoration:none}
.kpi .k-l{font-size:13px;color:var(--pd-muted)}.kpi .k-v{font-family:var(--pd-head);font-size:30px;font-weight:700;line-height:1.2}.kpi .k-s{font-size:12.5px;color:var(--pd-muted)}
a.kpi:hover,button.kpi:hover{text-decoration:none}
/* lists */
.pd-list{display:flex;flex-direction:column}
.pd-row{display:flex;align-items:flex-start;gap:12px;padding:12px 20px;border-top:1px solid var(--pd-line-2);color:inherit;text-decoration:none}
.pd-row:first-child{border-top:0}
a.pd-row:hover,button.pd-row:hover{background:var(--pd-sunk);text-decoration:none}
button.pd-row{font-family:inherit;width:100%;text-align:start;background:transparent;border-left:0;border-right:0;border-bottom:0;cursor:pointer}
/* tables → cards on mobile */
.tbl-wrap{overflow-x:auto;position:relative}
.tbl{width:100%;border-collapse:collapse}
.tbl th{font-size:12.5px;font-weight:700;color:var(--pd-muted);text-align:start;padding:10px 14px;border-bottom:1px solid var(--pd-line);background:var(--pd-sunk);white-space:nowrap}
.tbl td{padding:12px 14px;border-bottom:1px solid var(--pd-line-2);font-size:14px;vertical-align:middle;line-height:1.6}
.tbl tbody tr:hover{background:#FAFCFF}
.tbl tbody tr:last-child td{border-bottom:0}
@media (max-width:640px){.tbl.tbl-stack,.tbl.tbl-stack tbody,.tbl.tbl-stack tr,.tbl.tbl-stack td{display:block;width:100%;box-sizing:border-box}.tbl.tbl-stack{min-width:0!important}.tbl.tbl-stack thead{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}.tbl.tbl-stack tr{padding:12px 16px;border-bottom:1px solid var(--pd-line-2)}.tbl.tbl-stack td{border:0;padding:3px 0;display:flex;gap:10px;align-items:baseline}.tbl.tbl-stack td[data-label]::before{content:attr(data-label);flex:0 0 36%;font-size:12px;font-weight:700;color:var(--pd-muted)}}
/* empty / status */
.empty{display:flex;flex-direction:column;align-items:center;text-align:center;gap:8px;padding:32px 20px;color:var(--pd-muted)}
.empty .e-ic{width:48px;height:48px;border-radius:50%;background:var(--pd-tint);color:var(--pd-blue-d);display:flex;align-items:center;justify-content:center;font-size:20px}
.empty .e-t{font-weight:700;color:var(--pd-ink);font-size:15px}
.pd-lock{padding:40px 24px;text-align:center;display:flex;flex-direction:column;gap:10px;align-items:center}
/* steps */
.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;counter-reset:pdst}
.steps>li{counter-increment:pdst;position:relative;display:flex;gap:14px;align-items:flex-start;padding-bottom:14px}
.steps>li:last-child{padding-bottom:0}
.steps>li::before{content:counter(pdst);flex:none;width:30px;height:30px;border-radius:50%;background:var(--pd-blue);color:#fff;font-family:var(--pd-head);font-weight:700;font-size:14px;line-height:30px;text-align:center;position:relative;z-index:1;box-shadow:0 0 0 4px var(--pd-surface)}
.steps>li::after{content:"";position:absolute;inset-inline-start:14px;top:34px;bottom:4px;width:2px;border-radius:2px;background:#CAE2F0}
.steps>li:last-child::after{display:none}
.steps>li>span{padding-top:1px;min-width:0}
.steps.sm>li::before{width:26px;height:26px;font-size:13px;line-height:26px}
.steps.sm>li::after{inset-inline-start:12px;top:30px}
.steps>li.done::before{content:"\2713";background:var(--pd-ok)}
.steps>li.todo::before{background:#fff;color:var(--pd-muted);box-shadow:inset 0 0 0 2px #9DBCDB,0 0 0 4px #fff}
.vchk{appearance:none;-webkit-appearance:none;margin:1px 0 0;flex:none;width:26px;height:26px;border-radius:50%;border:2px solid #9DBCDB;background:#fff;display:grid;place-content:center;cursor:pointer;transition:background-color .18s,border-color .18s}
.vchk::after{content:"";width:6px;height:11px;border:solid #fff;border-width:0 2.5px 2.5px 0;transform:translate(0,-1px) rotate(45deg) scale(0);transition:transform .2s cubic-bezier(.3,1.6,.5,1)}
.vchk:checked{background:var(--pd-ok);border-color:var(--pd-ok)}
.vchk:checked::after{transform:translate(0,-1px) rotate(45deg) scale(1)}
.pbar{height:6px;border-radius:999px;background:var(--pd-line-2);overflow:hidden}
.pbar>span{display:block;height:100%;border-radius:999px;background:var(--pd-ok);transition:width .3s ease}
/* motion */
@keyframes pdRise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes pdPop{0%{opacity:0;transform:scale(.6)}70%{transform:scale(1.08)}100%{opacity:1;transform:none}}
@keyframes pdDraw{from{stroke-dashoffset:var(--len,800)}to{stroke-dashoffset:0}}
@media (prefers-reduced-motion:no-preference){
.pd-page>*{animation:pdRise .28s cubic-bezier(.2,.7,.2,1) both}
.pd-page>*:nth-child(2){animation-delay:.03s}.pd-page>*:nth-child(3){animation-delay:.06s}.pd-page>*:nth-child(4){animation-delay:.09s}.pd-page>*:nth-child(5){animation-delay:.12s}.pd-page>*:nth-child(6){animation-delay:.15s}.pd-page>*:nth-child(n+7){animation-delay:.18s}
.pd-in{animation:pdRise .26s cubic-bezier(.2,.7,.2,1) both}
.pd-pop{animation:pdPop .3s cubic-bezier(.2,.7,.2,1) both}
.steps>li{animation:pdRise .26s cubic-bezier(.2,.7,.2,1) both}
.steps>li:nth-child(2){animation-delay:.04s}.steps>li:nth-child(3){animation-delay:.08s}.steps>li:nth-child(4){animation-delay:.12s}.steps>li:nth-child(n+5){animation-delay:.16s}
.btn,.chip,.seg>*,.inp,.card,.pd-row{transition:background-color .16s,color .16s,border-color .16s,box-shadow .16s,transform .12s}
.btn:active,.seg>*:active{transform:scale(.97)}
a.card:hover,button.card:hover,.lift:hover{box-shadow:var(--pd-shadow-lg);border-color:#B1D1E6;transform:translateY(-2px)}
}
@media (max-width:640px){.pd-main{padding:18px 16px 56px}.pd-h1{font-size:23px}.pd-sec-h{padding:14px 16px}.pd-pad{padding:16px}.pd-row{padding:12px 16px}.pd-head .pd-actions{width:100%}.pd-head .pd-actions>.btn{flex:1 1 auto}}

/* ---- brand layer v2 (iSchool Identity Manual: blue surfaces, rocket swoosh, circles & bars) ---- */
.pd-head{position:relative;overflow:hidden;isolation:isolate;align-items:center;padding:26px 30px;border-radius:28px;background:var(--pd-blue);color:#fff;min-height:132px;box-sizing:border-box}
.pd-head::before{content:"";position:absolute;z-index:-1;inset-inline-end:-36px;top:-48px;width:300px;height:170px;background:url("data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%20420%20220%22%3E%3Cpath%20d%3D%22M30%20190%20C%20120%2060%2C%20300%2010%2C%20390%2070%20C%20430%20100%2C%20400%20160%2C%20340%20170%22%20fill%3D%22none%22%20stroke%3D%22%23FFD700%22%20stroke-width%3D%2226%22%20stroke-linecap%3D%22round%22/%3E%3Ccircle%20cx%3D%22336%22%20cy%3D%22170%22%20r%3D%2218%22%20fill%3D%22%23FF7F1C%22/%3E%3C/svg%3E") no-repeat center/contain;opacity:.95;transform:scaleX(-1)}
[dir=ltr] .pd-head::before{transform:none}
.pd-head::after{content:"";position:absolute;z-index:-1;inset-inline-end:28px;bottom:10px;width:160px;height:44px;background:url("data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20width%3D%22120%22%20height%3D%2244%22%20viewBox%3D%220%200%20120%2044%22%3E%3Cg%20fill%3D%22%2305ACFF%22%3E%3Ccircle%20cx%3D%228%22%20cy%3D%2210%22%20r%3D%225%22/%3E%3Crect%20x%3D%2220%22%20y%3D%225%22%20width%3D%2244%22%20height%3D%2210%22%20rx%3D%225%22/%3E%3Ccircle%20cx%3D%2276%22%20cy%3D%2210%22%20r%3D%225%22/%3E%3Crect%20x%3D%2288%22%20y%3D%225%22%20width%3D%2228%22%20height%3D%2210%22%20rx%3D%225%22/%3E%3Crect%20x%3D%224%22%20y%3D%2227%22%20width%3D%2230%22%20height%3D%2210%22%20rx%3D%225%22/%3E%3Ccircle%20cx%3D%2246%22%20cy%3D%2232%22%20r%3D%225%22/%3E%3Crect%20x%3D%2258%22%20y%3D%2227%22%20width%3D%2244%22%20height%3D%2210%22%20rx%3D%225%22/%3E%3Ccircle%20cx%3D%22112%22%20cy%3D%2232%22%20r%3D%225%22/%3E%3C/g%3E%3C/svg%3E") repeat-x;opacity:.3}
.pd-head .pd-head-t{gap:6px}
.pd-head .pd-h1{color:#fff;font-size:30px}
.pd-head .pd-lead{color:#fff;opacity:.95}
.pd-head .pd-crumbs{color:#E1F5FF}
.pd-head .pd-crumbs a,.pd-main .pd-head .pd-crumbs a:not([class]){color:#fff;text-decoration:none;font-weight:600;background:rgba(255,255,255,.16);padding:2px 12px;border-radius:999px}
.pd-head .pd-crumbs li+li::before{color:#fff}
.pd-head .pd-crumbs li:last-child{background:#043FAD;color:#fff;font-weight:700;padding:2px 12px;border-radius:999px}
.pd-head .btn{background:rgba(255,255,255,.14);border-color:rgba(255,255,255,.45);color:#fff}
.pd-head .btn:hover{background:rgba(255,255,255,.24);border-color:#fff;color:#fff}
.pd-head .btn-primary,.pd-head .btn-accent{background:var(--pd-yellow);border-color:var(--pd-yellow);color:var(--pd-ink)}
.pd-head .btn-primary:hover,.pd-head .btn-accent:hover{background:#FFE14D;border-color:#FFE14D;color:var(--pd-ink)}
.pd-head .btn-dark,.pd-head .btn-ok{background:#043FAD;border-color:#043FAD;color:#fff}
.pd-head .chip{background:rgba(255,255,255,.18);color:#fff}
.pd-head .chip-accent{background:var(--pd-yellow);color:var(--pd-ink)}
.pd-head a:focus-visible,.pd-head button:focus-visible{outline-color:var(--pd-yellow)}
.pd-h2{display:flex;align-items:center;gap:10px}
.pd-h2::before{content:"";width:12px;height:12px;border-radius:50%;background:var(--pd-yellow);box-shadow:0 0 0 3px #FFF3B0;flex:none}
.card{border-radius:var(--pd-r-lg)}
.pd-sec-h{border-bottom-color:#E1F0FB}
.kpi .k-v{color:var(--pd-blue-d)}
.seg{border-color:var(--pd-line);box-shadow:var(--pd-shadow)}
.seg>[aria-pressed=true],.seg>[aria-selected=true],.seg>[aria-current=page]{background:var(--pd-blue)}
.chip-brand{background:#DDF1FF;color:var(--pd-blue-d)}
.chip-info{background:#DDF4FF;color:var(--pd-info)}
.steps>li::before{background:var(--pd-blue);box-shadow:0 0 0 4px var(--pd-surface)}
.empty .e-ic{background:var(--pd-yellow);color:var(--pd-ink)}
@media (max-width:640px){.pd-head{padding:20px 18px;border-radius:22px}.pd-head::before{width:190px;height:110px;top:-36px;inset-inline-end:-40px}.pd-head::after{display:none}.pd-head .pd-h1{font-size:24px}}
/* == PD DS END == */
/* LiveUpdates — page-specific */
.lu-live{display:inline-flex;align-items:center;gap:8px;align-self:flex-start;margin-top:4px;padding:4px 12px;border-radius:999px;background:#043FAD;color:#fff;font-size:12.5px;font-weight:600}
.lu-live .pulse{width:9px;height:9px;border-radius:50%;background:var(--pd-yellow);box-shadow:0 0 0 0 rgba(255,215,0,.7)}
@media (prefers-reduced-motion:no-preference){.lu-live .pulse{animation:luPulse 1.8s ease-out infinite}}
@keyframes luPulse{0%{box-shadow:0 0 0 0 rgba(255,215,0,.7)}80%,100%{box-shadow:0 0 0 9px rgba(255,215,0,0)}}
/* summary strip */
.lu-sum{position:relative;overflow:hidden;isolation:isolate;display:flex;align-items:center;gap:14px;padding:16px 18px;border-radius:22px;border:1px solid var(--pd-line);background:var(--pd-surface);color:var(--pd-ink);font-family:inherit;text-align:start;cursor:pointer;min-height:92px;box-sizing:border-box;width:100%}
.lu-sum::after{content:"";position:absolute;z-index:-1;inset-inline-end:-26px;bottom:-30px;width:96px;height:96px;border-radius:50%;border:16px solid rgba(255,255,255,.18)}
.lu-sum .n{flex:none;width:54px;height:54px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:var(--pd-head);font-size:24px;font-weight:700}
.lu-sum .t{display:flex;flex-direction:column;gap:2px;min-width:0}
.lu-sum .t b{font-size:15px}.lu-sum .t span{font-size:12.5px}
.lu-sum.blue{background:var(--pd-blue);border-color:var(--pd-blue);color:#fff}.lu-sum.blue .n{background:var(--pd-yellow);color:var(--pd-ink)}
.lu-sum.sun{background:var(--pd-yellow);border-color:var(--pd-yellow);color:var(--pd-ink)}.lu-sum.sun .n{background:var(--pd-blue-d);color:#fff}.lu-sum.sun::after{border-color:rgba(255,127,28,.22)}
.lu-sum.plain .n{background:var(--pd-bad-bg);color:var(--pd-bad)}.lu-sum.plain::after{border-color:#ECF8FF}
.lu-sum[aria-pressed=true]{box-shadow:0 0 0 3px #fff,0 0 0 6px var(--pd-blue-d)}
a.lu-sum{text-decoration:none}
/* columns */
.lu-cols{display:grid;gap:20px;align-items:start;grid-template-columns:repeat(auto-fit,minmax(min(100%,440px),1fr))}
.lu-cols.is-one{grid-template-columns:minmax(0,1fr)}
.lu-sec{overflow:hidden;min-width:0}
.lu-sh{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;padding:16px 20px;border-bottom:1px solid #E1F0FB}
.lu-sh.info{background:linear-gradient(180deg,#E1F5FF,#F5FAFE)}
.lu-sh.iss{background:linear-gradient(180deg,#FFF7D1,#FFFCEF)}
.lu-sh .ic{flex:none;width:42px;height:42px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:var(--pd-head);font-weight:700;font-size:20px}
.lu-sh.info .ic{background:var(--pd-blue);color:#fff}.lu-sh.iss .ic{background:var(--pd-yellow);color:var(--pd-ink)}
.lu-sh .tt{flex:1 1 180px;min-width:0;display:flex;flex-direction:column;gap:2px}
.lu-sh .pd-h2::before{display:none}
.lu-sh .sub{font-size:12.5px;color:var(--pd-muted)}
/* timeline */
.tl-g{padding:14px 20px 4px}
.tl-gl{display:flex;align-items:center;gap:8px}
.tl-day{padding:2px 12px;border-radius:999px;font-size:12.5px;font-weight:700;background:#E6F0F9;color:var(--pd-ink-3);white-space:nowrap}
.tl-day.is-recent{background:var(--pd-blue-d);color:#fff}
.tl-gl .ds{font-size:12.5px;color:var(--pd-muted);white-space:nowrap}
.tl-gl .ln{flex:1;height:2px;border-radius:2px;background:var(--pd-line-2)}
.tl-items{position:relative;list-style:none;margin:10px 0 0;padding:0;padding-inline-start:30px;display:flex;flex-direction:column;gap:10px}
.tl-items::before{content:"";position:absolute;inset-inline-start:10px;top:8px;bottom:8px;width:2px;border-radius:2px;background:#CAE2F0}
.tl-items>li{position:relative;min-width:0}
.tl-items>li::before{content:"";position:absolute;inset-inline-start:-26px;top:16px;width:14px;height:14px;border-radius:50%;background:var(--c,#056FEC);box-shadow:0 0 0 4px var(--pd-surface),0 0 0 5px #CAE2F0;z-index:1}
.tl-it{display:flex;flex-direction:column;gap:6px;padding:12px 14px;border:1px solid var(--pd-line);border-radius:16px;background:var(--pd-surface);color:var(--pd-ink);overflow-wrap:anywhere}
a.tl-it{text-decoration:none}
a.tl-it:hover{border-color:#9DBCDB;box-shadow:var(--pd-shadow-lg);text-decoration:none}
.tl-it.is-new{border-color:#FFE16B;background:linear-gradient(180deg,#FFFCEB,#fff 60%)}
.tl-top{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.tl-top .tm{margin-inline-start:auto;font-size:12.5px;color:var(--pd-muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.tl-t{font-weight:700;font-size:15px;line-height:1.55}
.tl-w{font-size:13.5px;line-height:1.7;color:var(--pd-ink-3)}
.tl-m{display:flex;flex-wrap:wrap;align-items:center;gap:4px 10px;font-size:12.5px;color:var(--pd-muted)}
.tl-m .go{margin-inline-start:auto;font-weight:700;font-size:13px;color:var(--pd-blue-d);white-space:nowrap}
.tl-m .sep{color:var(--pd-line-3)}
.tl-ar{font-weight:700;color:var(--pd-muted)}
.lu-foot{padding:6px 20px 16px;display:flex;justify-content:flex-end}
@media (max-width:640px){.tl-g{padding:12px 14px 2px}.lu-sh{padding:14px 16px}.tl-items{padding-inline-start:26px}.tl-items::before{inset-inline-start:8px}.tl-items>li::before{inset-inline-start:-24px}.lu-foot{padding:6px 14px 14px}}

linkOpts: [['', 'بدون رابط'], ['guide', 'دليل المعلومات'], ['issues', 'المشكلات الحالية'], ['transfer', 'تحويل التذاكر']].map(([v, label]) => ({ v, label, sel: v === (f.link || '') })),
submit,
hasFlash: !!st.flash, flash: st.flash || {}, dismiss: () => this.setState({ flash: null }),
nInfoNew: String(nInfoNew), nIssNew: String(nIssNew), hasInfoNew: nInfoNew > 0, hasIssNew: nIssNew > 0,
nActive: String(nActive), monLine: nMon + ' قيد المتابعة',
pInfo: V === 'info' ? 'true' : 'false', pIss: V === 'issues' ? 'true' : 'false',
pickInfo: () => this.setState({ view: V === 'info' ? 'all' : 'info' }), pickIss: () => this.setState({ view: V === 'issues' ? 'all' : 'issues' }),
segs, colsCls: V === 'all' ? 'lu-cols' : 'lu-cols is-one',
showInfo: V !== 'issues', showIssues: V !== 'info',
nInfo: String(info.length), nIss: String(iss.length),
infoGroups: group(info, mapInfo), issGroups: group(iss, mapIss),
noInfo: info.length === 0, noIss: iss.length === 0
};
}
}
</script>

<span class="chip chip-info">{{modeName}}</span>
<span class="chip {{cur.stCls}}"><span class="dot"></span>{{cur.status}}</span>
<template data-sc="if" value="{{cur.hasCat}}" hint-placeholder-val="{{ true }}"><span class="chip">{{cur.cat}}</span></template>
<span>آخر تحديث {{cur.updated}} · بواسطة {{cur.by}} · الإصدار {{cur.version}}</span>
</div>
<div class="g-title">
<div>
<h2 id="g-ttl" class="g-h">{{cur.title}}</h2>
<p class="g-en"><bdi dir="ltr">{{cur.en}}</bdi></p>
</div>
<div class="pd-actions">
<button type="button" class="btn {{doneAll}}" onClick="{{copyAll}}">{{copyAllLabel}}</button>

</div>
</article>

<template data-sc="if" value="{{editing}}" hint-placeholder-val="{{ false }}">
<form class="card g-form g-edit pd-form pd-in" onSubmit="{{saveEdit}}" novalidate>
<div class="g-form-h"><h2 class="pd-h2">تعديل: {{cur.title}}</h2><span class="hint" style="margin: 0">يُسجَّل التعديل في سجل التعديلات باسمك.</span></div>
<div class="pd-form-row">
<div><label class="lbl" for="e7">نوع الطلب</label><select id="e7" class="inp" onChange="{{onEK}}"><template data-sc="for" list="{{eKindOpts}}" as="o" hint-placeholder-count="2"><option value="{{o.v}}" selected="{{o.sel}}">{{o.label}}</option></template></select></div>
<div><label class="lbl" for="e8">نوع الجلسة</label><select id="e8" class="inp" onChange="{{onEM}}"><template data-sc="for" list="{{eModeOpts}}" as="o" hint-placeholder-count="3"><option value="{{o.v}}" selected="{{o.sel}}">{{o.label}}</option></template></select></div>
</div>
<fieldset class="g-fs g-fs-r">
<legend>✦ الرد على الطالب</legend>
<template data-sc="for" list="{{dReplies}}" as="r" hint-placeholder-count="1">
<div class="g-rep">
<div><label class="lbl" for="{{r.lid}}">متى يُستخدم هذا الرد؟</label><input id="{{r.lid}}" class="inp" value="{{r.label}}" onInput="{{r.onLabel}}" placeholder="مثال: الجلسة قائمة الآن" autocomplete="off"></div>
<div><label class="lbl" for="{{r.tid}}">نص الرد</label><textarea id="{{r.tid}}" class="inp" rows="4" onInput="{{r.onText}}">{{r.text}}</textarea></div>
</div>
</template>
<div style="display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px">
<button type="button" class="btn btn-sm" onClick="{{addReply}}">+ رد لحالة أخرى</button>
<span class="hint" style="margin: 0">اترك نص الرد فارغاً لحذفه عند الحفظ.</span>
</div>
</fieldset>
<div><label class="lbl" for="e1">1 · الإجراء (Process)</label><textarea id="e1" class="inp" rows="5" onInput="{{onP}}" aria-describedby="e-h">{{dP}}</textarea><p id="e-h" class="hint">سطر لكل خطوة أو ملاحظة</p></div>
<div><label class="lbl" for="e2">2 · خطوات التحقق (Validation Steps)</label><textarea id="e2" class="inp" rows="4" onInput="{{onV}}" aria-describedby="e2-h">{{dV}}</textarea><p id="e2-h" class="hint">سطر لكل خطوة — تظهر أيضاً في التصنيف كبيانات تُطلب من الطالب.</p></div>
<div><label class="lbl" for="e3">3 · ملاحظات للأيجنت (Notes for Agents)</label><textarea id="e3" class="inp" rows="4" onInput="{{onN}}">{{dN}}</textarea></div>
<div class="pd-form-row">
<div><label class="lbl" for="e4">4 · Topic في نظام التذاكر</label><input id="e4" class="inp" dir="ltr" value="{{dLT}}" onInput="{{onLT}}"></div>
<div><label class="lbl" for="e5">Tag</label><input id="e5" class="inp" dir="ltr" value="{{dLG}}" onInput="{{onLG}}"></div>
<div><label class="lbl" for="e6">الجهة</label><select id="e6" class="inp" onChange="{{onLD}}"><template data-sc="for" list="{{deptOpts}}" as="o" hint-placeholder-count="3"><option value="{{o.v}}" selected="{{o.sel}}">{{o.v}}</option></template></select></div>
</div>
<div class="pd-form-actions">
<button type="submit" class="btn btn-dark">حفظ ونشر</button>
<button type="button" class="btn btn-ghost" onClick="{{cancelEdit}}">إلغاء</button>
</div>
</form>
</template>

<template data-sc="if" value="{{viewing}}" hint-placeholder-val="{{ true }}">
<template data-sc="if" value="{{blank}}" hint-placeholder-val="{{ false }}">
<div class="card empty pd-in">
<span class="e-ic" aria-hidden="true">✎</span>
<span class="e-t">هذا الموضوع ما زال مسودة فارغة</span>
<template data-sc="if" value="{{canEdit}}" hint-placeholder-val="{{ false }}"><span style="max-width: 50ch">أضف الرد على الطالب والإجراء وخطوات التحقق والملاحظات، ثم احفظ وانشر ليظهر للأيجنتس.</span><button type="button" class="btn btn-dark" onClick="{{startEdit}}">أكمل الموضوع</button></template>
<template data-sc="if" value="{{readOnly}}" hint-placeholder-val="{{ true }}"><span style="max-width: 50ch">لم يُكتب محتوى هذا الموضوع بعد. اسأل قائد الفريق، أو اتبع خريطة التحويل.</span><a href="Transfer.dc.html" class="btn btn-accent">افتح خريطة التحويل</a></template>
</div>
</template>
<template data-sc="if" value="{{notBlank}}" hint-placeholder-val="{{ true }}">
<nav class="g-jump" aria-label="أقسام الموضوع">
<a href="#s-reply" class="chip g-jr">✦ الرد</a>
<a href="#s-process" class="chip">1 · الإجراء</a>
<a href="#s-valid" class="chip">2 · خطوات التحقق</a>
<a href="#s-notes" class="chip">3 · ملاحظات للأيجنت</a>
<a href="#s-label" class="chip">4 · التصنيف</a>
</nav>

<template data-sc="if" value="{{reviewBanner}}" hint-placeholder-val="{{ false }}">
<div class="note note-warn" role="note"><span aria-hidden="true">!</span><span>مسودة مقترحة — تحتاج مراجعة المحتوى. بُنيت من معلومات الدليل الحالية، وما بين [ ] ينتظر تأكيد قائد الفريق قبل إرساله للطالب.</span></div>
</template>
<template data-sc="if" value="{{notOkBanner}}" hint-placeholder-val="{{ false }}">
<div class="note note-warn" role="note"><span aria-hidden="true">!</span><span>حالة الموضوع: {{cur.status}}. لم يعتمده قائد الفريق بعد — تأكّد من أي معلومة بين [ ] قبل إرسالها للطالب.</span></div>
</template>

<section id="s-reply" class="card g-sec g-reply" aria-labelledby="h-r">
<div class="pd-sec-h">
<span class="g-num" aria-hidden="true">✦</span>
<h3 id="h-r" class="pd-h2">الرد على الطالب <span class="g-sub">{{scriptCount}}</span></h3>
</div>
<div class="g-body" style="display: flex; flex-direction: column; gap: 12px">
<template data-sc="for" list="{{scripts}}" as="x" hint-placeholder-count="1">
<div class="reply">
<div class="r-h"><b>{{x.label}}</b><button type="button" class="btn btn-accent copy {{x.done}}" onClick="{{x.copy}}">{{x.cp}}</button></div>
<p>{{x.text}}</p>
</div>
</template>
<template data-sc="if" value="{{noScripts}}" hint-placeholder-val="{{ false }}">
<div class="g-empty-s"><span>لا يوجد رد معتمد لهذا الموضوع بعد. اتبع الإجراء أدناه، أو استخدم قالباً جاهزاً.</span><a href="Templates.dc.html" class="btn btn-sm">قوالب SMS</a><template data-sc="if" value="{{canEdit}}" hint-placeholder-val="{{ false }}"><button type="button" class="btn btn-sm btn-dark" onClick="{{startEdit}}">أكمل الموضوع</button></template></div>
</template>
</div>
</section>

<section id="s-process" class="card g-sec" aria-labelledby="h-p">
<div class="pd-sec-h">
<span class="g-num" aria-hidden="true">1</span>
<h3 id="h-p" class="pd-h2">الإجراء <span class="g-sub g-sub-en">Process</span></h3>
<template data-sc="if" value="{{hasP}}" hint-placeholder-val="{{ true }}"><button type="button" class="btn btn-sm copy {{doneP}}" onClick="{{copyP}}">{{cpP}}</button></template>
</div>
<div class="g-body">
<ol class="steps">
<template data-sc="for" list="{{cur.process}}" as="x" hint-placeholder-count="4"><li><span>{{x.t}}</span></li></template>
</ol>
<template data-sc="if" value="{{cur.emptyP}}" hint-placeholder-val="{{ false }}"><div class="g-empty-s"><span>لم يُكتب الإجراء بعد.</span><template data-sc="if" value="{{canEdit}}" hint-placeholder-val="{{ false }}"><button type="button" class="btn btn-sm btn-dark" onClick="{{startEdit}}">أكمل الموضوع</button></template></div></template>
</div>
</section>

<section id="s-valid" class="card g-sec" aria-labelledby="h-v">
<div class="pd-sec-h">
<span class="g-num" aria-hidden="true" style="background: var(--pd-ok-bg); color: var(--pd-ok)">2</span>
<h3 id="h-v" class="pd-h2">خطوات التحقق <span class="g-sub g-sub-en">Validation Steps</span></h3>
<template data-sc="if" value="{{hasValid}}" hint-placeholder-val="{{ true }}"><button type="button" class="btn btn-sm copy {{doneV}}" onClick="{{copyV}}">{{cpV}}</button></template>
</div>
<div class="g-body">
<template data-sc="if" value="{{hasValid}}" hint-placeholder-val="{{ true }}">
<ol class="steps sm g-vlist">
<template data-sc="for" list="{{cur.valid}}" as="v" hint-placeholder-count="4"><li><span>{{v.t}}</span></li></template>
</ol>
</template>
<template data-sc="if" value="{{cur.emptyV}}" hint-placeholder-val="{{ false }}"><div class="g-empty-s"><span>لم تُكتب خطوات التحقق بعد.</span><template data-sc="if" value="{{canEdit}}" hint-placeholder-val="{{ false }}"><button type="button" class="btn btn-sm btn-dark" onClick="{{startEdit}}">أكمل الموضوع</button></template></div></template>
</div>
</section>

<section id="s-notes" class="card g-sec g-notes" aria-labelledby="h-n">
<div class="pd-sec-h">
<span class="g-num" aria-hidden="true">3</span>
<h3 id="h-n" class="pd-h2">ملاحظات للأيجنت <span class="g-sub g-sub-en">Notes for Agents</span></h3>
<template data-sc="if" value="{{hasN}}" hint-placeholder-val="{{ true }}"><button type="button" class="btn btn-sm copy {{doneN}}" onClick="{{copyN}}">{{cpN}}</button></template>
</div>
<div class="g-body">
<template data-sc="if" value="{{hasN}}" hint-placeholder-val="{{ true }}"><ul><template data-sc="for" list="{{cur.notes}}" as="x" hint-placeholder-count="3"><li>{{x.t}}</li></template></ul></template>
<template data-sc="if" value="{{cur.emptyN}}" hint-placeholder-val="{{ false }}"><div class="g-empty-s"><span>لا ملاحظات للأيجنت بعد.</span><template data-sc="if" value="{{canEdit}}" hint-placeholder-val="{{ false }}"><button type="button" class="btn btn-sm btn-dark" onClick="{{startEdit}}">أكمل الموضوع</button></template></div></template>
</div>
</section>
</template>

<section id="s-label" class="card g-sec g-label" aria-labelledby="h-l">
<div class="pd-sec-h">
<span class="g-num" aria-hidden="true">4</span>
<h3 id="h-l" class="pd-h2">التصنيف <span class="g-sub g-sub-en">Label</span></h3>
<button type="button" class="btn btn-sm copy {{doneL}}" onClick="{{copyL}}">{{cpL}}</button>
</div>
<div class="g-body">
<div class="mm" role="group" aria-label="خريطة قرار التصنيف">
<div class="mm-node mm-root"><small>الحالة: {{cur.title}}</small><b>هل بيانات الطالب واضحة؟</b></div>
<span class="mm-stem" aria-hidden="true"></span>
<div class="mm-brs">

<div class="mm-br mm-ok">
<div class="mm-node mm-q"><span class="mm-ic" aria-hidden="true">✓</span>البيانات واضحة</div>
<span class="mm-ar" aria-hidden="true"></span>
<div class="mm-node mm-lab">
<div class="mm-t"><span class="mm-ic" aria-hidden="true">1</span>طبّق هذا التصنيف على التذكرة</div>
<div class="g-fields">
<div class="g-field"><dl><dt>Topic في نظام التذاكر</dt><dd><bdi dir="ltr">{{cur.label.topic}}</bdi></dd></dl><button type="button" class="btn {{doneLT}}" onClick="{{copyLT}}" aria-label="نسخ Topic">{{cpLT}}</button></div>
<div class="g-field"><dl><dt>Tag</dt><dd><bdi dir="ltr">{{cur.label.tag}}</bdi></dd></dl><button type="button" class="btn {{doneLG}}" onClick="{{copyLG}}" aria-label="نسخ Tag">{{cpLG}}</button></div>
<div class="g-field"><dl><dt>الجهة المسؤولة</dt><dd>{{cur.label.dept}}</dd></dl><button type="button" class="btn {{doneLD}}" onClick="{{copyLD}}" aria-label="نسخ الجهة">{{cpLD}}</button></div>
</div>
</div>
<span class="mm-ar" aria-hidden="true"></span>
<div class="mm-node mm-end"><p><b>2 · اتبع الإجراء</b> خطوة بخطوة ثم أرسل الرد المعتمد.</p><a href="#s-process" class="btn btn-sm">اذهب إلى الإجراء</a></div>
</div>

<div class="mm-br mm-no">
<div class="mm-node mm-q"><span class="mm-ic" aria-hidden="true">?</span>البيانات غير واضحة</div>
<span class="mm-ar" aria-hidden="true"></span>
<div class="mm-node mm-ask">
<div class="mm-t"><span class="mm-ic" aria-hidden="true">1</span>اطلب من الطالب البيانات الناقصة</div>
<ol class="steps sm"><template data-sc="for" list="{{askItems}}" as="a" hint-placeholder-count="3"><li><span>{{a.t}}</span></li></template></ol>
<template data-sc="if" value="{{askFallback}}" hint-placeholder-val="{{ false }}"><p class="hint">لم تُكتب خطوات التحقق لهذا الموضوع بعد — اطلب على الأقل ما سبق.</p></template>
</div>
<span class="mm-ar" aria-hidden="true"></span>
<div class="mm-fork">
<div><div class="mm-node mm-same"><span class="chip chip-ok">✓ اتضحت البيانات</span><p>طبّق نفس التصنيف أعلاه، ثم اتبع الإجراء.</p><button type="button" class="btn btn-sm {{doneL2}}" onClick="{{copyL2}}">{{cpL2}}</button></div></div>
<div><div class="mm-node mm-esc"><span class="chip chip-bad">✕ ما زالت غير واضحة</span><p>صعّد إلى Team Leader، أو راجع خريطة التحويل.</p><a href="Transfer.dc.html" class="btn btn-sm">خريطة التحويل</a></div></div>
</div>
</div>

</div>
</div>
</div>
</section>
</template>

</section>
</div>
</template>

</div></main>
</div>
</script>
<script type="text/x-css" id="css-Guide">
/* == PD DS START == iSchool Pedia design system v1 — single source: scratchpad/ds/design_system.css (injected by apply_ds.py) */
:root{--pd-sky:#05ACFF;--pd-sun:#FFBB1C;--pd-rust:#C76316;--pd-ice:#B1D1E6;--pd-blue:#056FEC;--pd-blue-d:#043FAD;--pd-blue-dd:#032F82;--pd-yellow:#FFD700;--pd-orange:#FF7F1C;--pd-ink:#14213D;--pd-ink-2:#273248;--pd-ink-3:#3B465C;--pd-muted:#5A6478;--pd-canvas:#ECF8FF;--pd-surface:#FFFFFF;--pd-sunk:#F5FAFE;--pd-line:#CAE2F0;--pd-line-2:#E6F0F9;--pd-line-3:#C9DCEE;--pd-tint:#ECF8FF;--pd-ok:#0F6B3A;--pd-ok-bg:#E9F7EF;--pd-ok-line:#9CCFB2;--pd-warn:#7A5200;--pd-warn-bg:#FFF7D1;--pd-warn-line:#FFE16B;--pd-bad:#A14A06;--pd-bad-bg:#FFEEDF;--pd-bad-line:#FFC9A0;--pd-info:#03679A;--pd-info-bg:#E1F5FF;--pd-r-sm:10px;--pd-r:14px;--pd-r-lg:22px;--pd-shadow:0 1px 2px rgba(4,63,173,.05),0 1px 1px rgba(20,33,61,.03);--pd-shadow-lg:0 12px 32px -16px rgba(4,63,173,.35);--pd-head:'Somar Rounded','Baloo Bhaijaan 2',sans-serif;--pd-body:'Somar Rounded','IBM Plex Sans Arabic',sans-serif}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--pd-canvas)}
.pd-main a{text-decoration:none}.pd-main a:not([class]){color:var(--pd-blue-d);text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:3px;text-decoration-color:rgba(4,63,173,.35)}.pd-main a:not([class]):hover{color:var(--pd-blue-dd);text-decoration-color:currentColor}
.pd-main a.pd-row,.pd-main a.card,.pd-main a.kpi,.pd-main a.att,.pd-main a.qlink{color:var(--pd-ink)}
.pd-main a.btn:hover,.pd-main a.card:hover,.pd-main a.pd-row:hover,.pd-main a.chip:hover,.pd-main a.kpi:hover{text-decoration:none}
:focus-visible{outline:3px solid var(--pd-blue);outline-offset:2px}
.pd-sr{position:absolute!important;width:1px!important;height:1px!important;overflow:hidden!important;clip:rect(0 0 0 0)!important;white-space:nowrap!important}
/* shell */
.pd-app{font-family:var(--pd-body);color:var(--pd-ink);background:var(--pd-canvas);min-height:100vh;display:flex;flex-wrap:wrap;flex-direction:row-reverse}
.pd-side{flex:1 1 248px;background:var(--pd-blue-d)}
.pd-main{flex:999 1 640px;min-width:0;box-sizing:border-box;padding:24px 28px 72px}
.pd-page{max-width:1240px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
.pd-head{display:flex;flex-wrap:wrap;align-items:flex-end;gap:12px 16px}
.pd-head-t{flex:1 1 320px;min-width:0;display:flex;flex-direction:column;gap:4px}
.pd-crumbs{display:flex;flex-wrap:wrap;align-items:center;gap:6px;font-size:13px;color:var(--pd-muted);margin:0;padding:0;list-style:none}
.pd-crumbs a{color:var(--pd-muted)}.pd-crumbs a:hover{color:var(--pd-blue-d)}
.pd-crumbs li+li::before{content:"‹";margin-inline-end:6px;color:var(--pd-line-3)}
.pd-h1{margin:0;font-family:var(--pd-head);font-size:28px;line-height:1.3;font-weight:700;color:var(--pd-ink)}
.pd-lead{margin:0;font-size:14.5px;line-height:1.7;color:var(--pd-muted);max-width:72ch}
.pd-actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.pd-h2{margin:0;font-family:var(--pd-head);font-size:18px;line-height:1.4;font-weight:700}
.pd-h3{margin:0;font-size:15px;font-weight:700}
.pd-eyebrow{font-size:12px;font-weight:700;letter-spacing:.3px;color:var(--pd-muted)}
.pd-muted{color:var(--pd-muted)}
/* surfaces */
.card{background:var(--pd-surface);border:1px solid var(--pd-line);border-radius:var(--pd-r-lg);box-shadow:var(--pd-shadow)}
.pd-pad{padding:18px 20px}
.pd-sec-h{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;padding:16px 20px;border-bottom:1px solid var(--pd-line-2)}
.pd-sec-h .pd-h2{flex:1;min-width:0}
.pd-grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(min(100%,var(--min,260px)),1fr))}
.pd-split{display:flex;flex-wrap:wrap;gap:20px;align-items:flex-start}
.pd-split>.pd-aside{flex:1 1 340px;min-width:0}
.pd-split>.pd-body{flex:999 1 560px;min-width:0;display:flex;flex-direction:column;gap:16px}
@media (min-width:1100px){.pd-sticky{position:sticky;top:16px}}
/* buttons */
.btn{font-family:inherit;font-size:14px;font-weight:600;line-height:1.2;padding:10px 18px;min-height:44px;box-sizing:border-box;border-radius:999px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--pd-line-3);background:var(--pd-surface);color:var(--pd-ink-2);text-decoration:none;white-space:nowrap}
.btn:hover{border-color:var(--pd-blue);color:var(--pd-blue-d);text-decoration:none}
.btn-primary{background:var(--pd-blue);border-color:var(--pd-blue);color:#fff}.btn-primary:hover{background:var(--pd-blue-d);border-color:var(--pd-blue-d);color:#fff}
.btn-dark{background:var(--pd-blue-d);border-color:var(--pd-blue-d);color:#fff}.btn-dark:hover{background:var(--pd-blue-dd);border-color:var(--pd-blue-dd);color:#fff}
.btn-accent{background:var(--pd-yellow);border-color:var(--pd-yellow);color:var(--pd-ink)}.btn-accent:hover{background:#FFE14D;border-color:#FFE14D;color:var(--pd-ink)}
.btn-ok{background:var(--pd-ok);border-color:var(--pd-ok);color:#fff}.btn-ok:hover{filter:brightness(1.08);color:#fff}
.btn-ghost{background:transparent;border-color:transparent;color:var(--pd-blue-d)}.btn-ghost:hover{background:var(--pd-tint);border-color:transparent}
.btn-danger{color:var(--pd-bad)}.btn-danger:hover{border-color:var(--pd-bad);color:var(--pd-bad);background:var(--pd-bad-bg)}
.btn-sm{min-height:36px;padding:6px 14px;font-size:13px}
.btn-block{width:100%}
.btn:disabled,.btn[aria-disabled=true]{opacity:.45;cursor:not-allowed;filter:none}
.btn.is-done{background:var(--pd-ok);border-color:var(--pd-ok);color:#fff}
/* chips & badges */
.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:600;line-height:1.6;white-space:nowrap;background:var(--pd-line-2);color:var(--pd-ink-3)}
.chip-brand{background:var(--pd-tint);color:var(--pd-blue-d)}.chip-ok{background:var(--pd-ok-bg);color:var(--pd-ok)}.chip-warn{background:var(--pd-warn-bg);color:var(--pd-warn)}.chip-bad{background:var(--pd-bad-bg);color:var(--pd-bad)}.chip-info{background:var(--pd-info-bg);color:var(--pd-info)}.chip-dark{background:var(--pd-blue-d);color:#fff}.chip-accent{background:var(--pd-yellow);color:var(--pd-ink)}
.dot{width:8px;height:8px;border-radius:50%;flex:none;display:inline-block;background:currentColor}
/* segmented filters / tabs */
.seg{display:inline-flex;flex-wrap:wrap;gap:4px;padding:4px;border-radius:999px;background:var(--pd-surface);border:1px solid var(--pd-line)}
.seg>button,.seg>a{font-family:inherit;font-size:13.5px;font-weight:600;min-height:36px;padding:0 14px;border-radius:999px;border:0;background:transparent;color:var(--pd-ink-3);cursor:pointer;display:inline-flex;align-items:center;gap:6px;text-decoration:none}
.seg>button:hover{background:var(--pd-tint);color:var(--pd-blue-d)}
.seg>[aria-pressed=true],.seg>[aria-selected=true],.seg>[aria-current=page]{background:var(--pd-blue-d);color:#fff}
.seg .n{font-size:11px;font-weight:700;padding:0 7px;border-radius:999px;background:rgba(20,33,61,.08);line-height:18px}
.seg>[aria-pressed=true] .n,.seg>[aria-selected=true] .n{background:#fff;color:var(--pd-blue-d)}
/* toolbar */
.pd-toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.pd-search{position:relative;flex:1 1 260px;min-width:0}
.pd-search>svg{position:absolute;inset-inline-start:14px;top:50%;transform:translateY(-50%);color:var(--pd-muted);pointer-events:none}
.pd-search>.inp{padding-inline-start:40px;border-radius:999px}
/* forms */
.inp{width:100%;box-sizing:border-box;font-family:inherit;font-size:14.5px;line-height:1.6;padding:9px 14px;border:1px solid var(--pd-line-3);border-radius:12px;background:var(--pd-surface);color:var(--pd-ink);min-height:44px;transition:border-color .15s,box-shadow .15s}
.inp:hover{border-color:#9DBCDB}.inp:focus{border-color:var(--pd-blue);box-shadow:0 0 0 3px rgba(5,111,236,.15);outline:none}
.inp[aria-invalid=true]{border-color:var(--pd-bad);box-shadow:0 0 0 3px rgba(161,74,6,.12)}
textarea.inp{resize:vertical}
.lbl{display:block;font-size:13px;font-weight:600;color:var(--pd-ink-3);margin-bottom:6px}
.lbl .req{color:var(--pd-bad)}
.hint{font-size:12.5px;color:var(--pd-muted);margin-top:4px}
.err{font-size:13px;color:var(--pd-bad);font-weight:600}
.pd-form{display:flex;flex-direction:column;gap:14px}
.pd-form-row{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr))}
.pd-form-actions{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding-top:4px}
/* notes / banners */
.note{display:flex;gap:10px;align-items:flex-start;padding:12px 16px;border-radius:var(--pd-r);font-size:14px;line-height:1.7;border:1px solid var(--pd-line);background:var(--pd-sunk);color:var(--pd-ink-2)}
.note-info{background:var(--pd-tint);border-color:#B1D1E6;color:var(--pd-blue-d)}.note-warn{background:var(--pd-warn-bg);border-color:var(--pd-warn-line);color:#5C3D00}.note-ok{background:var(--pd-ok-bg);border-color:var(--pd-ok-line);color:var(--pd-ok)}.note-bad{background:var(--pd-bad-bg);border-color:var(--pd-bad-line);color:var(--pd-bad)}
/* kpi */
.kpi{display:flex;flex-direction:column;gap:2px;padding:16px 18px;text-align:start;font-family:inherit;color:inherit;text-decoration:none}
.kpi .k-l{font-size:13px;color:var(--pd-muted)}.kpi .k-v{font-family:var(--pd-head);font-size:30px;font-weight:700;line-height:1.2}.kpi .k-s{font-size:12.5px;color:var(--pd-muted)}
a.kpi:hover,button.kpi:hover{text-decoration:none}
/* lists */
.pd-list{display:flex;flex-direction:column}
.pd-row{display:flex;align-items:flex-start;gap:12px;padding:12px 20px;border-top:1px solid var(--pd-line-2);color:inherit;text-decoration:none}
.pd-row:first-child{border-top:0}
a.pd-row:hover,button.pd-row:hover{background:var(--pd-sunk);text-decoration:none}
button.pd-row{font-family:inherit;width:100%;text-align:start;background:transparent;border-left:0;border-right:0;border-bottom:0;cursor:pointer}
/* tables → cards on mobile */
.tbl-wrap{overflow-x:auto;position:relative}
.tbl{width:100%;border-collapse:collapse}
.tbl th{font-size:12.5px;font-weight:700;color:var(--pd-muted);text-align:start;padding:10px 14px;border-bottom:1px solid var(--pd-line);background:var(--pd-sunk);white-space:nowrap}
.tbl td{padding:12px 14px;border-bottom:1px solid var(--pd-line-2);font-size:14px;vertical-align:middle;line-height:1.6}
.tbl tbody tr:hover{background:#FAFCFF}
.tbl tbody tr:last-child td{border-bottom:0}
@media (max-width:640px){.tbl.tbl-stack,.tbl.tbl-stack tbody,.tbl.tbl-stack tr,.tbl.tbl-stack td{display:block;width:100%;box-sizing:border-box}.tbl.tbl-stack{min-width:0!important}.tbl.tbl-stack thead{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}.tbl.tbl-stack tr{padding:12px 16px;border-bottom:1px solid var(--pd-line-2)}.tbl.tbl-stack td{border:0;padding:3px 0;display:flex;gap:10px;align-items:baseline}.tbl.tbl-stack td[data-label]::before{content:attr(data-label);flex:0 0 36%;font-size:12px;font-weight:700;color:var(--pd-muted)}}
/* empty / status */
.empty{display:flex;flex-direction:column;align-items:center;text-align:center;gap:8px;padding:32px 20px;color:var(--pd-muted)}
.empty .e-ic{width:48px;height:48px;border-radius:50%;background:var(--pd-tint);color:var(--pd-blue-d);display:flex;align-items:center;justify-content:center;font-size:20px}
.empty .e-t{font-weight:700;color:var(--pd-ink);font-size:15px}
.pd-lock{padding:40px 24px;text-align:center;display:flex;flex-direction:column;gap:10px;align-items:center}
/* steps */
.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;counter-reset:pdst}
.steps>li{counter-increment:pdst;position:relative;display:flex;gap:14px;align-items:flex-start;padding-bottom:14px}
.steps>li:last-child{padding-bottom:0}
.steps>li::before{content:counter(pdst);flex:none;width:30px;height:30px;border-radius:50%;background:var(--pd-blue);color:#fff;font-family:var(--pd-head);font-weight:700;font-size:14px;line-height:30px;text-align:center;position:relative;z-index:1;box-shadow:0 0 0 4px var(--pd-surface)}
.steps>li::after{content:"";position:absolute;inset-inline-start:14px;top:34px;bottom:4px;width:2px;border-radius:2px;background:#CAE2F0}
.steps>li:last-child::after{display:none}
.steps>li>span{padding-top:1px;min-width:0}
.steps.sm>li::before{width:26px;height:26px;font-size:13px;line-height:26px}
.steps.sm>li::after{inset-inline-start:12px;top:30px}
.steps>li.done::before{content:"\2713";background:var(--pd-ok)}
.steps>li.todo::before{background:#fff;color:var(--pd-muted);box-shadow:inset 0 0 0 2px #9DBCDB,0 0 0 4px #fff}
.vchk{appearance:none;-webkit-appearance:none;margin:1px 0 0;flex:none;width:26px;height:26px;border-radius:50%;border:2px solid #9DBCDB;background:#fff;display:grid;place-content:center;cursor:pointer;transition:background-color .18s,border-color .18s}
.vchk::after{content:"";width:6px;height:11px;border:solid #fff;border-width:0 2.5px 2.5px 0;transform:translate(0,-1px) rotate(45deg) scale(0);transition:transform .2s cubic-bezier(.3,1.6,.5,1)}
.vchk:checked{background:var(--pd-ok);border-color:var(--pd-ok)}
.vchk:checked::after{transform:translate(0,-1px) rotate(45deg) scale(1)}
.pbar{height:6px;border-radius:999px;background:var(--pd-line-2);overflow:hidden}
.pbar>span{display:block;height:100%;border-radius:999px;background:var(--pd-ok);transition:width .3s ease}
/* motion */
@keyframes pdRise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes pdPop{0%{opacity:0;transform:scale(.6)}70%{transform:scale(1.08)}100%{opacity:1;transform:none}}
@keyframes pdDraw{from{stroke-dashoffset:var(--len,800)}to{stroke-dashoffset:0}}
@media (prefers-reduced-motion:no-preference){
.pd-page>*{animation:pdRise .28s cubic-bezier(.2,.7,.2,1) both}
.pd-page>*:nth-child(2){animation-delay:.03s}.pd-page>*:nth-child(3){animation-delay:.06s}.pd-page>*:nth-child(4){animation-delay:.09s}.pd-page>*:nth-child(5){animation-delay:.12s}.pd-page>*:nth-child(6){animation-delay:.15s}.pd-page>*:nth-child(n+7){animation-delay:.18s}
.pd-in{animation:pdRise .26s cubic-bezier(.2,.7,.2,1) both}
.pd-pop{animation:pdPop .3s cubic-bezier(.2,.7,.2,1) both}
.steps>li{animation:pdRise .26s cubic-bezier(.2,.7,.2,1) both}
.steps>li:nth-child(2){animation-delay:.04s}.steps>li:nth-child(3){animation-delay:.08s}.steps>li:nth-child(4){animation-delay:.12s}.steps>li:nth-child(n+5){animation-delay:.16s}
.btn,.chip,.seg>*,.inp,.card,.pd-row{transition:background-color .16s,color .16s,border-color .16s,box-shadow .16s,transform .12s}
.btn:active,.seg>*:active{transform:scale(.97)}
a.card:hover,button.card:hover,.lift:hover{box-shadow:var(--pd-shadow-lg);border-color:#B1D1E6;transform:translateY(-2px)}
}
@media (max-width:640px){.pd-main{padding:18px 16px 56px}.pd-h1{font-size:23px}.pd-sec-h{padding:14px 16px}.pd-pad{padding:16px}.pd-row{padding:12px 16px}.pd-head .pd-actions{width:100%}.pd-head .pd-actions>.btn{flex:1 1 auto}}

.pd-head{position:relative;overflow:hidden;isolation:isolate;align-items:center;padding:26px 30px;border-radius:28px;background:var(--pd-blue);color:#fff;min-height:132px;box-sizing:border-box}
.pd-head::before{content:"";position:absolute;z-index:-1;inset-inline-end:-36px;top:-48px;width:300px;height:170px;background:url("data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%20420%20220%22%3E%3Cpath%20d%3D%22M30%20190%20C%20120%2060%2C%20300%2010%2C%20390%2070%20C%20430%20100%2C%20400%20160%2C%20340%20170%22%20fill%3D%22none%22%20stroke%3D%22%23FFD700%22%20stroke-width%3D%2226%22%20stroke-linecap%3D%22round%22/%3E%3Ccircle%20cx%3D%22336%22%20cy%3D%22170%22%20r%3D%2218%22%20fill%3D%22%23FF7F1C%22/%3E%3C/svg%3E") no-repeat center/contain;opacity:.95;transform:scaleX(-1)}

.pd-head::after{content:"";position:absolute;z-index:-1;inset-inline-end:28px;bottom:10px;width:160px;height:44px;background:url("data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20width%3D%22120%22%20height%3D%2244%22%20viewBox%3D%220%200%20120%2044%22%3E%3Cg%20fill%3D%22%2305ACFF%22%3E%3Ccircle%20cx%3D%228%22%20cy%3D%2210%22%20r%3D%225%22/%3E%3Crect%20x%3D%2220%22%20y%3D%225%22%20width%3D%2244%22%20height%3D%2210%22%20rx%3D%225%22/%3E%3Ccircle%20cx%3D%2276%22%20cy%3D%2210%22%20r%3D%225%22/%3E%3Crect%20x%3D%2288%22%20y%3D%225%22%20width%3D%2228%22%20height%3D%2210%22%20rx%3D%225%22/%3E%3Crect%20x%3D%224%22%20y%3D%2227%22%20width%3D%2230%22%20height%3D%2210%22%20rx%3D%225%22/%3E%3Ccircle%20cx%3D%2246%22%20cy%3D%2232%22%20r%3D%225%22/%3E%3Crect%20x%3D%2258%22%20y%3D%2227%22%20width%3D%2244%22%20height%3D%2210%22%20rx%3D%225%22/%3E%3Ccircle%20cx%3D%22112%22%20cy%3D%2232%22%20r%3D%225%22/%3E%3C/g%3E%3C/svg%3E") repeat-x;opacity:.3}
.pd-head .pd-head-t{gap:6px}
.pd-head .pd-h1{color:#fff;font-size:30px}
.pd-head .pd-lead{color:#fff;opacity:.95}
.pd-head .pd-crumbs{color:#E1F5FF}
.pd-head .pd-crumbs a,.pd-main .pd-head .pd-crumbs a:not([class]){color:#fff;text-decoration:none;font-weight:600;background:rgba(255,255,255,.16);padding:2px 12px;border-radius:999px}

.pd-head .btn-primary:hover,.pd-head .btn-accent:hover{background:#FFE14D;border-color:#FFE14D;color:var(--pd-ink)}
.pd-head .btn-dark,.pd-head .btn-ok{background:#043FAD;border-color:#043FAD;color:#fff}
.pd-head .chip{background:rgba(255,255,255,.18);color:#fff}

.card{border-radius:var(--pd-r-lg)}
.pd-sec-h{border-bottom-color:#E1F0FB}
.kpi .k-v{color:var(--pd-blue-d)}
.seg{border-color:var(--pd-line);box-shadow:var(--pd-shadow)}

@media (max-width:640px){.pd-head{padding:20px 18px;border-radius:22px}.pd-head::before{width:190px;height:110px;top:-36px;inset-inline-end:-40px}.pd-head::after{display:none}.pd-head .pd-h1{font-size:24px}}

/* Guide — page-specific */
.pd-still .pd-page>*,.pd-still .steps>li,.pd-still .pd-in{animation:none!important}
.g-orgs{display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px}
.g-orgs .seg{max-width:100%;box-sizing:border-box}
/* path bar (stepper) + search */
.g-bar{display:flex;flex-wrap:wrap;align-items:center;gap:10px 12px;padding:10px 12px}
.g-bar .pd-search{flex:1 1 240px}
.g-back svg,.g-t-go svg,.topic .g-go svg{flex:none}
[dir=ltr] .g-back svg,[dir=ltr] .g-t-go svg,[dir=ltr] .topic .g-go svg{transform:scaleX(-1)}

<script type="text/x-tpl" id="tpl-Issues">

<div dir="rtl" class="pd-app">

<main class="pd-main" id="main"><div class="pd-page">

<header class="pd-head">

<h1 class="pd-h1">المشكلات الحالية</h1>
<p class="pd-lead">راجِع هنا قبل أن تسأل: هل المشكلة معروفة ومسجّلة بالفعل؟</p>
</div>
<template data-sc="if" value="{{auth}}" hint-placeholder-val="{{ true }}">
<div class="pd-actions"><button type="button" class="btn btn-primary" onClick="{{openForm}}" aria-expanded="{{formOpen}}" aria-controls="new-issue">+ تسجيل مشكلة</button></div>
</template>
</header>

<template data-sc="if" value="{{agent}}" hint-placeholder-val="{{ false }}">

</div>
</template>

<template data-sc="if" value="{{showForm}}" hint-placeholder-val="{{ false }}">

<fieldset style="border: 0; margin: 0; padding: 0; min-width: 0">
<legend class="lbl">الفئة <span class="req">*</span></legend>
<div style="display: flex; flex-wrap: wrap; gap: 8px">
<label class="cat-opt"><input type="radio" name="cat" checked="{{fStu}}" onChange="{{fStudent}}"> مشكلة طلاب</label>

</fieldset>
<div class="pd-form-row">

<template data-sc="if" value="{{formErr}}" hint-placeholder-val="{{ false }}"><div class="err" id="f-t-err" role="alert" style="margin-top: 6px">اكتب عنواناً للمشكلة.</div></template>
</div>
<div><label class="lbl" for="f-d">الوصف</label><textarea id="f-d" class="inp" rows="3" onInput="{{fDesc}}" placeholder="ما الذي يحدث، ومن يتأثر، وما الحل المؤقت إن وُجد"></textarea></div>

</form>
</section>
</template>

<template data-sc="for" list="{{tabs}}" as="t" hint-placeholder-count="2">
<button type="button" role="tab" class="iss-tab" id="{{t.id}}" aria-selected="{{t.on}}" aria-controls="iss-panel" onClick="{{t.pick}}">{{t.label}} <span class="n {{t.hot}}" title="مفتوحة">{{t.count}}</span></button>
</template>
</div>

<div class="iss-bar">
<div class="seg" role="group" aria-label="تصفية حسب الحالة">
<template data-sc="for" list="{{filters}}" as="f" hint-placeholder-count="5">
<button type="button" aria-pressed="{{f.on}}" onClick="{{f.pick}}">{{f.label}} <span class="n">{{f.count}}</span></button>
</template>
</div>
<span class="chip chip-brand">المؤسسة: {{orgName}}</span>
</div>

<template data-sc="if" value="{{flashSt}}" hint-placeholder-val="{{ false }}">
<div class="note note-ok pd-in" role="status"><span aria-hidden="true">✓</span><span style="flex: 1">تم تغيير حالة «{{flash.title}}» إلى «{{flash.toLabel}}».</span><button type="button" class="btn btn-ghost btn-sm" onClick="{{undo}}">تراجع</button><button type="button" class="btn btn-ghost btn-sm" onClick="{{dismiss}}">إخفاء</button></div>

<template data-sc="for" list="{{rows}}" as="r" hint-placeholder-count="3">
<article class="card iss {{r.cls}}" aria-labelledby="{{r.hid}}">
<div class="iss-top">
<span class="chip {{r.scls}}"><span class="dot"></span>{{r.statusLabel}}</span>

<span class="iss-id" dir="ltr">{{r.id}}</span>
</div>
<h2 class="iss-t" id="{{r.hid}}">{{r.title}}</h2>

<div class="iss-meta"><span>سُجّلت {{r.reported}}</span><span>آخر تحديث {{r.updated}}</span><span>بواسطة {{r.by}}</span></div>
<template data-sc="if" value="{{r.hasTpl}}" hint-placeholder-val="{{ true }}">

<div class="iss-act">

</div>
</template>
</div>
</article>
</template>

</div>
</template>
</div>
</section>

</div></main>
</div>
