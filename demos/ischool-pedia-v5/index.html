/* chips & badges */
.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:600;line-height:1.6;white-space:nowrap;background:var(--pd-line-2);color:var(--pd-ink-3)}
.chip-brand{background:var(--pd-tint);color:var(--pd-blue-d)}.chip-ok{background:var(--pd-ok-bg);color:var(--pd-ok)}.chip-warn{background:var(--pd-warn-bg);color:var(--pd-warn)}.chip-bad{background:var(--pd-bad-bg);color:var(--pd-bad)}.chip-info{background:var(--pd-info-bg);color:var(--pd-info)}.chip-dark{background:var(--pd-blue-d);color:#fff}.chip-accent{background:var(--pd-yellow);color:var(--pd-ink)}
.dot{width:8px;height:8px;border-radius:50%;flex:none;display:inline-block;background:currentColor}
/* segmented filters / tabs */
.seg{display:inline-flex;flex-wrap:wrap;gap:4px;padding:4px;border-radius:999px;background:var(--pd-surface);border:1px solid var(--pd-line)}
.seg>button,.seg>a{font-family:inherit;font-size:13.5px;font-weight:600;min-height:36px;padding:0 14px;border-radius:999px;border:0;background:transparent;color:var(--pd-ink-3);cursor:pointer;display:inline-flex;align-items:center;gap:6px;text-decoration:none}
.seg>button:hover{background:var(--pd-tint);color:var(--pd-blue-d)}
.seg>[aria-pressed=true],.seg>[aria-selected=true],.seg>[aria-current=page]{background:var(--pd-blue-d);color:#fff}
.seg .n{font-size:11px;font-weight:700;padding:0 7px;border-radius:999px;background:rgba(20,33,61,.08);line-height:18px}
.seg>[aria-pressed=true] .n,.seg>[aria-selected=true] .n{background:#fff;color:var(--pd-blue-d)}
/* toolbar */
.pd-toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.pd-search{position:relative;flex:1 1 260px;min-width:0}
.pd-search>svg{position:absolute;inset-inline-start:14px;top:50%;transform:translateY(-50%);color:var(--pd-muted);pointer-events:none}
.pd-search>.inp{padding-inline-start:40px;border-radius:999px}
/* forms */
.inp{width:100%;box-sizing:border-box;font-family:inherit;font-size:14.5px;line-height:1.6;padding:9px 14px;border:1px solid var(--pd-line-3);border-radius:12px;background:var(--pd-surface);color:var(--pd-ink);min-height:44px;transition:border-color .15s,box-shadow .15s}
.inp:hover{border-color:#9DBCDB}.inp:focus{border-color:var(--pd-blue);box-shadow:0 0 0 3px rgba(5,111,236,.15);outline:none}
.inp[aria-invalid=true]{border-color:var(--pd-bad);box-shadow:0 0 0 3px rgba(161,74,6,.12)}
textarea.inp{resize:vertical}
.lbl{display:block;font-size:13px;font-weight:600;color:var(--pd-ink-3);margin-bottom:6px}
.lbl .req{color:var(--pd-bad)}
.hint{font-size:12.5px;color:var(--pd-muted);margin-top:4px}
.err{font-size:13px;color:var(--pd-bad);font-weight:600}
.pd-form{display:flex;flex-direction:column;gap:14px}
.pd-form-row{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr))}
.pd-form-actions{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding-top:4px}
/* notes / banners */
.note{display:flex;gap:10px;align-items:flex-start;padding:12px 16px;border-radius:var(--pd-r);font-size:14px;line-height:1.7;border:1px solid var(--pd-line);background:var(--pd-sunk);color:var(--pd-ink-2)}
.note-info{background:var(--pd-tint);border-color:#B1D1E6;color:var(--pd-blue-d)}.note-warn{background:var(--pd-warn-bg);border-color:var(--pd-warn-line);color:#5C3D00}.note-ok{background:var(--pd-ok-bg);border-color:var(--pd-ok-line);color:var(--pd-ok)}.note-bad{background:var(--pd-bad-bg);border-color:var(--pd-bad-line);color:var(--pd-bad)}
/* kpi */
.kpi{display:flex;flex-direction:column;gap:2px;padding:16px 18px;text-align:start;font-family:inherit;color:inherit;text-decoration:none}
.kpi .k-l{font-size:13px;color:var(--pd-muted)}.kpi .k-v{font-family:var(--pd-head);font-size:30px;font-weight:700;line-height:1.2}.kpi .k-s{font-size:12.5px;color:var(--pd-muted)}
a.kpi:hover,button.kpi:hover{text-decoration:none}
/* lists */
.pd-list{display:flex;flex-direction:column}
.pd-row{display:flex;align-items:flex-start;gap:12px;padding:12px 20px;border-top:1px solid var(--pd-line-2);color:inherit;text-decoration:none}
.pd-row:first-child{border-top:0}
a.pd-row:hover,button.pd-row:hover{background:var(--pd-sunk);text-decoration:none}
button.pd-row{font-family:inherit;width:100%;text-align:start;background:transparent;border-left:0;border-right:0;border-bottom:0;cursor:pointer}
/* tables → cards on mobile */
.tbl-wrap{overflow-x:auto;position:relative}
.tbl{width:100%;border-collapse:collapse}
.tbl th{font-size:12.5px;font-weight:700;color:var(--pd-muted);text-align:start;padding:10px 14px;border-bottom:1px solid var(--pd-line);background:var(--pd-sunk);white-space:nowrap}
.tbl td{padding:12px 14px;border-bottom:1px solid var(--pd-line-2);font-size:14px;vertical-align:middle;line-height:1.6}
.tbl tbody tr:hover{background:#FAFCFF}
.tbl tbody tr:last-child td{border-bottom:0}
@media (max-width:640px){.tbl.tbl-stack,.tbl.tbl-stack tbody,.tbl.tbl-stack tr,.tbl.tbl-stack td{display:block;width:100%;box-sizing:border-box}.tbl.tbl-stack{min-width:0!important}.tbl.tbl-stack thead{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}.tbl.tbl-stack tr{padding:12px 16px;border-bottom:1px solid var(--pd-line-2)}.tbl.tbl-stack td{border:0;padding:3px 0;display:flex;gap:10px;align-items:baseline}.tbl.tbl-stack td[data-label]::before{content:attr(data-label);flex:0 0 36%;font-size:12px;font-weight:700;color:var(--pd-muted)}}
/* empty / status */
.empty{display:flex;flex-direction:column;align-items:center;text-align:center;gap:8px;padding:32px 20px;color:var(--pd-muted)}
.empty .e-ic{width:48px;height:48px;border-radius:50%;background:var(--pd-tint);color:var(--pd-blue-d);display:flex;align-items:center;justify-content:center;font-size:20px}
.empty .e-t{font-weight:700;color:var(--pd-ink);font-size:15px}
.pd-lock{padding:40px 24px;text-align:center;display:flex;flex-direction:column;gap:10px;align-items:center}
/* steps */
.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;counter-reset:pdst}
.steps>li{counter-increment:pdst;position:relative;display:flex;gap:14px;align-items:flex-start;padding-bottom:14px}
.steps>li:last-child{padding-bottom:0}
.steps>li::before{content:counter(pdst);flex:none;width:30px;height:30px;border-radius:50%;background:var(--pd-blue);color:#fff;font-family:var(--pd-head);font-weight:700;font-size:14px;line-height:30px;text-align:center;position:relative;z-index:1;box-shadow:0 0 0 4px var(--pd-surface)}
.steps>li::after{content:"";position:absolute;inset-inline-start:14px;top:34px;bottom:4px;width:2px;border-radius:2px;background:#CAE2F0}
.steps>li:last-child::after{display:none}
.steps>li>span{padding-top:1px;min-width:0}
.steps.sm>li::before{width:26px;height:26px;font-size:13px;line-height:26px}
.steps.sm>li::after{inset-inline-start:12px;top:30px}
.steps>li.done::before{content:"\2713";background:var(--pd-ok)}
.steps>li.todo::before{background:#fff;color:var(--pd-muted);box-shadow:inset 0 0 0 2px #9DBCDB,0 0 0 4px #fff}
.vchk{appearance:none;-webkit-appearance:none;margin:1px 0 0;flex:none;width:26px;height:26px;border-radius:50%;border:2px solid #9DBCDB;background:#fff;display:grid;place-content:center;cursor:pointer;transition:background-color .18s,border-color .18s}
.vchk::after{content:"";width:6px;height:11px;border:solid #fff;border-width:0 2.5px 2.5px 0;transform:translate(0,-1px) rotate(45deg) scale(0);transition:transform .2s cubic-bezier(.3,1.6,.5,1)}
.vchk:checked{background:var(--pd-ok);border-color:var(--pd-ok)}
.vchk:checked::after{transform:translate(0,-1px) rotate(45deg) scale(1)}
.pbar{height:6px;border-radius:999px;background:var(--pd-line-2);overflow:hidden}
.pbar>span{display:block;height:100%;border-radius:999px;background:var(--pd-ok);transition:width .3s ease}
/* motion */
@keyframes pdRise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes pdPop{0%{opacity:0;transform:scale(.6)}70%{transform:scale(1.08)}100%{opacity:1;transform:none}}
@keyframes pdDraw{from{stroke-dashoffset:var(--len,800)}to{stroke-dashoffset:0}}
@media (prefers-reduced-motion:no-preference){
.pd-page>*{animation:pdRise .28s cubic-bezier(.2,.7,.2,1) both}
.pd-page>*:nth-child(2){animation-delay:.03s}.pd-page>*:nth-child(3){animation-delay:.06s}.pd-page>*:nth-child(4){animation-delay:.09s}.pd-page>*:nth-child(5){animation-delay:.12s}.pd-page>*:nth-child(6){animation-delay:.15s}.pd-page>*:nth-child(n+7){animation-delay:.18s}
.pd-in{animation:pdRise .26s cubic-bezier(.2,.7,.2,1) both}
.pd-pop{animation:pdPop .3s cubic-bezier(.2,.7,.2,1) both}
.steps>li{animation:pdRise .26s cubic-bezier(.2,.7,.2,1) both}
.steps>li:nth-child(2){animation-delay:.04s}.steps>li:nth-child(3){animation-delay:.08s}.steps>li:nth-child(4){animation-delay:.12s}.steps>li:nth-child(n+5){animation-delay:.16s}
.btn,.chip,.seg>*,.inp,.card,.pd-row{transition:background-color .16s,color .16s,border-color .16s,box-shadow .16s,transform .12s}
.btn:active,.seg>*:active{transform:scale(.97)}
a.card:hover,button.card:hover,.lift:hover{box-shadow:var(--pd-shadow-lg);border-color:#B1D1E6;transform:translateY(-2px)}
}
@media (max-width:640px){.pd-main{padding:18px 16px 56px}.pd-h1{font-size:23px}.pd-sec-h{padding:14px 16px}.pd-pad{padding:16px}.pd-row{padding:12px 16px}.pd-head .pd-actions{width:100%}.pd-head .pd-actions>.btn{flex:1 1 auto}}

.pd-head::before{content:"";position:absolute;z-index:-1;inset-inline-end:-36px;top:-48px;width:300px;height:170px;background:url("data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%20420%20220%22%3E%3Cpath%20d%3D%22M30%20190%20C%20120%2060%2C%20300%2010%2C%20390%2070%20C%20430%20100%2C%20400%20160%2C%20340%20170%22%20fill%3D%22none%22%20stroke%3D%22%23FFD700%22%20stroke-width%3D%2226%22%20stroke-linecap%3D%22round%22/%3E%3Ccircle%20cx%3D%22336%22%20cy%3D%22170%22%20r%3D%2218%22%20fill%3D%22%23FF7F1C%22/%3E%3C/svg%3E") no-repeat center/contain;opacity:.95;transform:scaleX(-1)}

.pd-head .pd-head-t{gap:6px}
.pd-head .pd-h1{color:#fff;font-size:30px}
.pd-head .pd-lead{color:#fff;opacity:.95}
.pd-head .pd-crumbs{color:#E1F5FF}
.pd-head .pd-crumbs a,.pd-main .pd-head .pd-crumbs a:not([class]){color:#fff;text-decoration:none;font-weight:600;background:rgba(255,255,255,.16);padding:2px 12px;border-radius:999px}

.pd-head .btn-primary:hover,.pd-head .btn-accent:hover{background:#FFE14D;border-color:#FFE14D;color:var(--pd-ink)}
.pd-head .btn-dark,.pd-head .btn-ok{background:#043FAD;border-color:#043FAD;color:#fff}

/* Transfer — page-specific */
/* the prototype shell only freezes main>*; the DS shell animates .pd-page>* — stop it replaying on every keystroke */
#screen.pd-still .pd-page>*{animation:none!important}
.tr-split>.pd-body{flex-basis:700px}
.tr-title{display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px}
/* stepper */
.stp-row{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:8px 20px;align-items:center}
.stp{display:flex;align-items:center;gap:8px;font-size:13.5px;font-weight:600;color:var(--pd-muted)}
.stp>span:first-child{width:28px;height:28px;flex:none;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-family:var(--pd-head);font-size:13px;font-weight:700;background:var(--pd-surface);color:var(--pd-muted);box-shadow:inset 0 0 0 2px var(--pd-line-3)}
.stp.is-done{color:var(--pd-ok)}.stp.is-done>span:first-child{background:var(--pd-ok);color:#fff;box-shadow:none}
.stp.is-cur{color:var(--pd-blue-d)}.stp.is-cur>span:first-child{background:var(--pd-blue);color:#fff;box-shadow:0 0 0 4px rgba(5,111,236,.15)}
.stp+.stp::before{content:"";width:22px;height:2px;border-radius:2px;background:var(--pd-line-3);margin-inline-end:4px}
/* map card */
.tr-map-h{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;padding:14px 18px;border-bottom:1px solid var(--pd-line-2)}
.tr-map-h .pd-h2{flex:0 1 auto}
.tr-map-h .pd-search{flex:1 1 260px}
.tr-qbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:10px 18px;background:var(--pd-sunk);border-bottom:1px solid var(--pd-line-2);font-size:13.5px;color:var(--pd-ink-3)}
.tr-scroll{overflow-x:auto;padding:22px 18px 20px}
/* flowchart */
.fc-wrap{min-width:var(--minw)}
.fc-top{display:flex;flex-direction:column;align-items:center}
.fc-node{font-family:inherit;cursor:pointer;border:2px solid transparent;text-align:center;color:inherit}

.fc-root:hover{background:var(--pd-blue-dd)}
.fc-root small{font-size:12px;color:#CAE2F0}
.fc-dec{width:300px;max-width:100%;height:112px;padding:8px 58px;box-sizing:border-box;background:var(--pd-yellow);color:var(--pd-ink);clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;border:0}

.fc-vl{width:2px;height:24px;background:#9DBCDB}

.fc-br::before{content:"";position:absolute;top:0;height:2px;background:#9DBCDB;inset-inline:calc(100% / var(--n) / 2 - 4px)}

.fc-b.is-sel::before{background:var(--tc)}
.fc-b.is-off{opacity:.42}.fc-b.is-off:hover{opacity:.8}
.fc-bn{width:100%;box-sizing:border-box;padding:12px;border-radius:var(--pd-r);display:flex;flex-direction:column;align-items:center;gap:3px;background:var(--tb);color:var(--tc);border-color:var(--tb)}

.fc-cases::before{content:"";position:absolute;inset-inline-start:5px;top:-12px;bottom:22px;width:2px;background:var(--pd-line)}
.fc-c{position:relative;font-family:inherit;text-align:start;cursor:pointer;width:100%;box-sizing:border-box;padding:9px 12px;min-height:44px;border-radius:12px;border:1.5px solid var(--pd-line);background:var(--pd-surface);color:var(--pd-ink);display:flex;flex-direction:column;gap:3px;font-size:13.5px;line-height:1.6;transition:opacity .2s,border-color .16s,background-color .16s,box-shadow .16s}

.fc-wrap.is-edit .fc-dec[aria-pressed=true] small{color:#fff}
/* result panel */
.tr-band{padding:16px 20px;background:var(--tb);color:var(--tc);display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 10px;border-radius:var(--pd-r-lg) var(--pd-r-lg) 0 0}

.tr-sec{padding:16px 20px;display:flex;flex-direction:column;gap:10px;border-top:1px solid var(--pd-line-2)}

.tr-notebox{padding:12px 14px;border-radius:12px;background:#FFFBEA;border:1px solid var(--pd-warn-line);display:flex;flex-direction:column;gap:8px}

.fl{position:relative;perspective:1400px;min-width:0}

}),

<script type="text/x-tpl" id="tpl-Users">

</section>
</template>

<div class="pd-head-t">
<ol class="pd-crumbs" aria-label="المسار"><li><a href="Dashboard.dc.html">لوحة اليوم</a></li><li>الإدارة</li><li>المستخدمون</li></ol>

</div>
</div>
<div class="pd-form pd-pad">

<template data-sc="if" value="{{edBad}}" hint-placeholder-val="{{ false }}"><div id="ed-err" class="err" role="alert" style="margin-top: 6px">{{err}}</div></template></div>
</div>
<fieldset>
<legend class="lbl">نطاق المؤسسات</legend>
<div style="display: flex; flex-wrap: wrap; gap: 8px">

</div>

</span></td>

<script type="text/x-css" id="css-Users">
/* == PD DS START == iSchool Pedia design system v1 — single source: scratchpad/ds/design_system.css (injected by apply_ds.py) */
:root{--pd-sky:#05ACFF;--pd-sun:#FFBB1C;--pd-rust:#C76316;--pd-ice:#B1D1E6;--pd-blue:#056FEC;--pd-blue-d:#043FAD;--pd-blue-dd:#032F82;--pd-yellow:#FFD700;--pd-orange:#FF7F1C;--pd-ink:#14213D;--pd-ink-2:#273248;--pd-ink-3:#3B465C;--pd-muted:#5A6478;--pd-canvas:#ECF8FF;--pd-surface:#FFFFFF;--pd-sunk:#F5FAFE;--pd-line:#CAE2F0;--pd-line-2:#E6F0F9;--pd-line-3:#C9DCEE;--pd-tint:#ECF8FF;--pd-ok:#0F6B3A;--pd-ok-bg:#E9F7EF;--pd-ok-line:#9CCFB2;--pd-warn:#7A5200;--pd-warn-bg:#FFF7D1;--pd-warn-line:#FFE16B;--pd-bad:#A14A06;--pd-bad-bg:#FFEEDF;--pd-bad-line:#FFC9A0;--pd-info:#03679A;--pd-info-bg:#E1F5FF;--pd-r-sm:10px;--pd-r:14px;--pd-r-lg:22px;--pd-shadow:0 1px 2px rgba(4,63,173,.05),0 1px 1px rgba(20,33,61,.03);--pd-shadow-lg:0 12px 32px -16px rgba(4,63,173,.35);--pd-head:'Somar Rounded','Baloo Bhaijaan 2',sans-serif;--pd-body:'Somar Rounded','IBM Plex Sans Arabic',sans-serif}

:focus-visible{outline:3px solid var(--pd-blue);outline-offset:2px}

.btn-dark{background:var(--pd-blue-d);border-color:var(--pd-blue-d);color:#fff}.btn-dark:hover{background:var(--pd-blue-dd);border-color:var(--pd-blue-dd);color:#fff}

.btn:disabled,.btn[aria-disabled=true]{opacity:.45;cursor:not-allowed;filter:none}

/* chips & badges */
.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:600;line-height:1.6;white-space:nowrap;background:var(--pd-line-2);color:var(--pd-ink-3)}

.seg>[aria-pressed=true],.seg>[aria-selected=true],.seg>[aria-current=page]{background:var(--pd-blue-d);color:#fff}
.seg .n{font-size:11px;font-weight:700;padding:0 7px;border-radius:999px;background:rgba(20,33,61,.08);line-height:18px}
.seg>[aria-pressed=true] .n,.seg>[aria-selected=true] .n{background:#fff;color:var(--pd-blue-d)}
/* toolbar */
.pd-toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.pd-search{position:relative;flex:1 1 260px;min-width:0}
.pd-search>svg{position:absolute;inset-inline-start:14px;top:50%;transform:translateY(-50%);color:var(--pd-muted);pointer-events:none}
.pd-search>.inp{padding-inline-start:40px;border-radius:999px}
/* forms */
.inp{width:100%;box-sizing:border-box;font-family:inherit;font-size:14.5px;line-height:1.6;padding:9px 14px;border:1px solid var(--pd-line-3);border-radius:12px;background:var(--pd-surface);color:var(--pd-ink);min-height:44px;transition:border-color .15s,box-shadow .15s}
.inp:hover{border-color:#9DBCDB}.inp:focus{border-color:var(--pd-blue);box-shadow:0 0 0 3px rgba(5,111,236,.15);outline:none}

.kpi{display:flex;flex-direction:column;gap:2px;padding:16px 18px;text-align:start;font-family:inherit;color:inherit;text-decoration:none}
.kpi .k-l{font-size:13px;color:var(--pd-muted)}.kpi .k-v{font-family:var(--pd-head);font-size:30px;font-weight:700;line-height:1.2}.kpi .k-s{font-size:12.5px;color:var(--pd-muted)}

.pd-list{display:flex;flex-direction:column}

button.pd-row{font-family:inherit;width:100%;text-align:start;background:transparent;border-left:0;border-right:0;border-bottom:0;cursor:pointer}
/* tables → cards on mobile */
.tbl-wrap{overflow-x:auto;position:relative}
.tbl{width:100%;border-collapse:collapse}

.tbl tbody tr:last-child td{border-bottom:0}
@media (max-width:640px){.tbl.tbl-stack,.tbl.tbl-stack tbody,.tbl.tbl-stack tr,.tbl.tbl-stack td{display:block;width:100%;box-sizing:border-box}.tbl.tbl-stack{min-width:0!important}.tbl.tbl-stack thead{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}.tbl.tbl-stack tr{padding:12px 16px;border-bottom:1px solid var(--pd-line-2)}.tbl.tbl-stack td{border:0;padding:3px 0;display:flex;gap:10px;align-items:baseline}.tbl.tbl-stack td[data-label]::before{content:attr(data-label);flex:0 0 36%;font-size:12px;font-weight:700;color:var(--pd-muted)}}
/* empty / status */
.empty{display:flex;flex-direction:column;align-items:center;text-align:center;gap:8px;padding:32px 20px;color:var(--pd-muted)}
.empty .e-ic{width:48px;height:48px;border-radius:50%;background:var(--pd-tint);color:var(--pd-blue-d);display:flex;align-items:center;justify-content:center;font-size:20px}
.empty .e-t{font-weight:700;color:var(--pd-ink);font-size:15px}
.pd-lock{padding:40px 24px;text-align:center;display:flex;flex-direction:column;gap:10px;align-items:center}

.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;counter-reset:pdst}

.steps>li>span{padding-top:1px;min-width:0}

.steps.sm>li::after{inset-inline-start:12px;top:30px}

.vchk:checked{background:var(--pd-ok);border-color:var(--pd-ok)}

.pbar{height:6px;border-radius:999px;background:var(--pd-line-2);overflow:hidden}

/* motion */

@media (prefers-reduced-motion:no-preference){

.pd-pop{animation:pdPop .3s cubic-bezier(.2,.7,.2,1) both}
.steps>li{animation:pdRise .26s cubic-bezier(.2,.7,.2,1) both}

if (draft.orgs.join() !== edUser.orgs.join()) changed.push('عدّل نطاق ' + edUser.name + ' إلى ' + draft.orgs.map(o => ON[o]).join('، '));
changed.forEach(c => this.audit(myName, c));
this.saveUsers(users.map(u => u.id === edUser.id ? { ...u, role: draft.role, orgs: draft.orgs } : u), { editId: null, draft: null, err: '', errAt: '', flash: changed.length ? 'حُفظت تعديلات ' + edUser.name + '.' : 'لا توجد تغييرات.' });
},
err: st.err,
roleOpts, rfOpts,
q: st.q,
onQ: (e) => this.setState({ q: e.target.value, confirmId: null }),
onRf: (e) => this.setState({ rf: e.target.value, confirmId: null }),
clearFilters: () => { this.setField('urf', 'all'); this.setState({ q: '', rf: 'all', sf: 'all' }); },
shown: list.length + ' من ' + base.length,
empty: list.length === 0, hasRows: list.length > 0,
rows: list.map(u => {
const s = SC[u.status], c = av(u.role), isMe = u.name === myName;
const susp = u.status === 'suspended';
const lastAdmin = u.role === 'admin' && adminsActive <= 1;
const canToggle = canSusp && !isMe && !lastAdmin && u.status !== 'invited';
const confirming = canToggle && !susp && st.confirmId === u.id;
const setStatus = (ns) => { this.audit(myName, (ns === 'active' ? 'فعّل حساب ' : 'أوقف حساب ') + u.name); this.saveUsers(users.map(x => x.id === u.id ? { ...x, status: ns } : x), { flash: (ns === 'active' ? 'فُعّل حساب ' : 'أُوقف حساب ') + u.name + '.', editId: st.editId === u.id ? null : st.editId, draft: st.editId === u.id ? null : st.draft, confirmId: null }); };
return {
name: u.name, mail: u.mail, ini: ini(u.name), avBg: c[0], avFg: c[1], op: susp ? '0.45' : '1',
trCls: (u.id === st.editId ? 'sel ' : '') + (susp ? 'off' : ''),
roleName: (R[u.role] || R.agent).name, rcls: RCLS[u.role] || '',
orgs: u.orgs.map(o => ({ t: ON[o] })),
statusLabel: s[0], scls: s[1], last: u.last, isMe,
confirming, idle: !confirming,
canEdit: canEdit && !susp, editAria: 'تعديل ' + u.name,
edit: () => { this.setState({ editId: u.id, draft: { role: u.role, orgs: u.orgs }, inviting: false, err: '', errAt: '', flash: '', confirmId: null }); this.setField('ed-role', u.role); this.later(() => { const el = document.getElementById('ed-role'); if (el) el.focus(); }); },
canResend: canInvite && u.status === 'invited',
resend: () => { this.audit(myName, 'أعاد إرسال دعوة ' + u.name); this.setState({ flash: 'أُعيد إرسال الدعوة إلى ' + u.name + '.', confirmId: null }); },
canSuspend: canToggle && !susp, canReactivate: canToggle && susp,
askSuspend: () => this.setState({ confirmId: u.id, flash: '' }),
cancel: () => this.setState({ confirmId: null }),
doSuspend: () => setStatus('suspended'),
reactivate: () => setStatus('active')
};
})
};
}
}
</script>

tl: { name: 'قائد الفريق', who: '[Team Leader]', ini: 'T', sys: true, desc: 'يعتمد المحتوى وينشره، ويتابع المشكلات والتحويل.', scope: ['ALL'], p: { guide: all, issues: 'vced', activities: 'vced', templates: all, transfer: 'vce', users: 'v' } },

reporter: { name: 'مُبلّغ المشكلات', who: 'Habiba', ini: 'H', sys: true, desc: 'يسجّل المشكلات الحالية ويحدّث حالتها.', scope: ['DEMI', 'DECI'], p: { guide: 'v', issues: 'vce', activities: 'vc', templates: 'v', transfer: 'v', users: '' } },
agent: { name: 'CS Agent', who: 'Rehab Abdullah', ini: 'R', sys: true, desc: 'يقرأ الدليل وينسخ الردود والقوالب فقط.', scope: ['ALL'], p: { guide: 'v', issues: 'v', activities: 'v', templates: 'v', transfer: 'v', users: '' } }
};
}
pdRole() {

}
can(m, a) { const R = this.rbac()[this.pdRole()]; return !!R && (R.p[m] || '').indexOf(a.charAt(0)) >= 0; }

try { if (window.__PD_USERS) return window.__PD_USERS; } catch (e) {}
return [['Abdelrhman', 'admin'], ['[Team Leader]', 'tl'], ['Habiba', 'reporter'], ['[Content Editor]', 'editor'], ['Rehab Abdullah', 'agent'], ['Sarah Yasser', 'agent'], ['samuel.samir', 'agent'], ['mariam.khaled', 'agent'], ['[Former Agent]', 'agent']].map(([name, role]) => ({ name, role, status: name === '[Former Agent]' ? 'suspended' : 'active' }));

const st = this.state;
const role = this.pdRole(), R = this.rbac(), me = R[role];
const canView = this.can('users', 'view'), canManage = this.can('users', 'edit');
const ids = Object.keys(R);
const sel = R[st.sel] ? st.sel : 'editor';
const cur = R[sel];
const users = this.users();
const MOD = [['guide', 'دليل المعلومات', 'vcead'], ['issues', 'المشكلات الحالية', 'vced'], ['activities', 'الإشعارات والأنشطة', 'vced'], ['templates', 'قوالب SMS', 'vcead'], ['transfer', 'تحويل التذاكر', 'vced'], ['users', 'المستخدمون والأدوار', 'vced']];
const ACT = [['v', 'عرض'], ['c', 'إضافة'], ['e', 'تعديل'], ['a', 'اعتماد ونشر'], ['d', 'حذف']];
const AN = { v: 'عرض', c: 'إضافة', e: 'تعديل', a: 'اعتماد ونشر', d: 'حذف' };
const DOT = { admin: ['#043FAD', '#FFD700'], tl: ['#056FEC', '#fff'], editor: ['#05ACFF', '#14213D'], reporter: ['#FF7F1C', '#14213D'], agent: ['#B1D1E6', '#14213D'] };
const dot = (id) => DOT[id] || ['#FFD700', '#14213D'];
const ON = { ALL: 'كل المؤسسات', DEMI: 'DEMI', DECI: 'DECI', DEMI_S: 'DEMI Summer', DECI_S: 'DECI Summer' };
const cntL = (n) => n === 0 ? 'بلا أعضاء' : n === 1 ? 'عضو واحد' : n === 2 ? 'عضوان' : n + (n <= 10 ? ' أعضاء' : ' عضواً');
const members = (id) => users.filter(u => u.role === id && u.status !== 'suspended');
const locked = !!cur.lock || !canManage;
const level = (p) => !p ? 'بدون وصول' : p.indexOf('d') >= 0 || p.indexOf('a') >= 0 ? (p.length >= 4 ? 'تحكم كامل' : 'إدارة') : p.indexOf('e') >= 0 ? 'تعديل' : p.indexOf('c') >= 0 ? 'إضافة' : 'عرض فقط';
const LV = { 'تحكم كامل': 'lv-full', 'إدارة': 'lv-manage', 'تعديل': 'lv-edit', 'إضافة': 'lv-add', 'عرض فقط': 'lv-view', 'بدون وصول': 'lv-none' };
const kind = (r) => r.lock ? 'نظامي · ثابت' : r.sys ? 'نظامي' : 'مخصّص';
const kcls = (r) => r.lock ? 'chip-dark' : r.sys ? '' : 'chip-accent';
const setPerm = (m, a, on) => {
const map = this.clone(); let p = map[sel].p[m] || '';
if (on) { p = p + a; if (a !== 'v' && p.indexOf('v') < 0) p = 'v' + p; } else { p = a === 'v' ? '' : p.replace(a, ''); }
map[sel].p[m] = 'vcead'.split('').filter(x => p.indexOf(x) >= 0).join('');
const ml = MOD.find(x => x[0] === m)[1];
this.commit(map, (on ? 'منح' : 'سحب') + ' "' + AN[a] + '" في ' + ml + ' ' + (on ? 'لدور' : 'من دور') + ' "' + cur.name + '"');
};
const sumList = MOD.map(([m, label]) => { const p = cur.p[m] || ''; return p ? { m: label, a: p.split('').map(x => AN[x]).join('، ') } : null; }).filter(Boolean);
const seedAudit = [
{ when: 'اليوم 11:05', who: 'Abdelrhman', what: 'منح "إضافة" و"تعديل" في المشكلات الحالية لدور "مُبلّغ المشكلات"' },
{ when: 'اليوم 08:50', who: 'Abdelrhman', what: 'أسند دور "مُبلّغ المشكلات" إلى Habiba' },
{ when: 'أمس 18:40', who: 'Abdelrhman', what: 'عدّل نطاق دور "محرر المحتوى" إلى DEMI، DECI' },
{ when: '4 أكتوبر', who: 'Abdelrhman', what: 'أوقف حساب [Former Agent]' },
{ when: '3 أكتوبر', who: 'Abdelrhman', what: 'أنشأ الأدوار الخمسة الافتراضية' }
];
const audit = this.auditList().map(a => ({ ...a, cls: 'new' })).concat(seedAudit.map(a => ({ ...a, cls: '' }))).slice(0, 10);
const mem = members(sel);
return {
role, org: st.org, myRoleName: me.name,
setRole: (r) => this.pdSetRole(r, { delAsk: false }), setOrg: (o) => this.setState({ org: o }),
noAccess: !canView, hasAccess: canView, readOnly: canView && !canManage, canManage,
newRole: () => {
const map = this.clone(); let n = 1; while (map['custom' + n]) n++;
const id = 'custom' + n;
map[id] = { name: 'دور مخصّص ' + n, who: '', ini: String(n), sys: false, desc: 'دور مخصّص — نُسخ من CS Agent. عدّل الاسم والصلاحيات.', scope: ['ALL'], p: JSON.parse(JSON.stringify(map.agent.p)) };
this.commit(map, 'أنشأ "دور مخصّص ' + n + '"', { sel: id });
try { setTimeout(() => { const el = document.getElementById('rname'); if (el) { el.focus(); el.select(); } }, 0); } catch (e) {}
},
roleCount: String(ids.length),
roles: ids.map(id => ({
name: R[id].name, desc: R[id].desc, count: cntL(members(id).length), dot: dot(id)[0],
kind: kind(R[id]), kcls: kcls(R[id]),
cur: id === sel ? 'true' : 'false', curCls: id === sel ? 'cur' : '',
pick: () => this.setState({ sel: id, delAsk: false })
})),
cur: {
name: cur.name, desc: cur.desc, ini: cur.ini || cur.name.charAt(0), dot: dot(sel)[0], dotInk: dot(sel)[1],
count: cntL(mem.length), kind: kind(cur), kcls: kcls(cur),
nameEditable: !cur.sys && canManage, nameFixed: cur.sys || !canManage,
canDelete: !cur.sys && canManage && mem.length === 0,
locked, lockNote: cur.lock ? 'دور مدير النظام ثابت حتى لا يفقد أحد التحكم في المنصة.' : 'للعرض فقط — تعديل الأدوار لمن لديه صلاحية تعديل "المستخدمون والأدوار".'
},
renameRole: (e) => { const map = this.clone(); map[sel].name = e.target.value || 'دور مخصّص'; try { window.__PD_RBAC = map; } catch (x) {} this.setState({ tick: st.tick + 1 }); },
delAsk: !!st.delAsk, delIdle: !st.delAsk,
askDelete: () => this.setState({ delAsk: true }),
cancelDelete: () => this.setState({ delAsk: false }),
deleteRole: () => { const map = this.clone(); const nm = map[sel].name; delete map[sel]; this.commit(map, 'حذف الدور "' + nm + '"', { sel: 'editor' }); },
acts: ACT.map(([k, label]) => ({ label })),
matrix: MOD.map(([m, label, appl]) => {
const p = cur.p[m] || '';
return {
label, level: level(p),
cells: ACT.map(([a, al]) => {
const ok = appl.indexOf(a) >= 0, on = p.indexOf(a) >= 0;
return { na: !ok, ok, naT: label + ' — ' + al + ': لا ينطبق', pressed: on ? 'true' : 'false', mark: on ? '✓' : '', dis: locked,
cls: (on ? 'on' : '') + (locked ? ' lock' : ''),
aria: label + ' — ' + al + (on ? ': مسموح' : ': غير مسموح'),
toggle: () => { if (!locked) setPerm(m, a, !on); } };
})
};
}),
scope: ['ALL', 'DEMI', 'DECI', 'DEMI_S', 'DECI_S'].map(id => {
const on = (cur.scope || []).indexOf(id) >= 0;
return { label: ON[id], on, dis: locked, cls: (on ? 'on' : '') + (locked ? ' dis' : ''),
toggle: () => { if (locked) return; const map = this.clone(); const s = map[sel].scope || []; let n = id === 'ALL' ? ['ALL'] : s.filter(x => x !== 'ALL' && x !== id).concat(on ? [] : [id]); if (!n.length) n = ['ALL']; map[sel].scope = n; this.commit(map, 'عدّل نطاق دور "' + cur.name + '" إلى ' + n.map(x => ON[x]).join('، ')); } };
}),
summary: sumList, summaryEmpty: sumList.length === 0, hasSummary: sumList.length > 0,
members: mem.map(u => ({ name: u.name })), noMembers: mem.length === 0, hasMembers: mem.length > 0,
lblModule: 'القسم',
compare: MOD.map(([m, label]) => ({ label, cells: ids.map(id => { const t = level(R[id].p[m] || ''); return { t, cls: LV[t], role: R[id].name, curCls: id === sel ? 'cur' : '' }; }) })),
audit, auditN: String(audit.length)
};
}

pear — choose Join from Your Browser and you’ll enter the session straight from the browser.", "من صفحة السيشن اضغط Join، ولو برنامج Zoom مش متسطّب على جهازك اختار Join from Your Browser وهتدخل من المتصفح على طول.": "On the session page press Join. If Zoom isn’t installed, choose Join from Your Browser and you’ll enter from the browser.", "تأكد من موعد الجلسة على السيستم وأنها قائمة الآن.": "Check the session time in the system and confirm it is live now.", "تأكد أن الطالب سيدخل من لابتوب أو كمبيوتر — الدخول غير متاح من الموبايل أو التابلت.": "Make sure the student joins from a laptop or computer — phones and tablets are not supported.", "إذا كانت الجلسة الآن: أرسل للطالب رابط الدخول المباشر (LOGIN LINK) للـ Dashboard، وأبلغه أن جلسته قائمة الآن ويستطيع الدخول.": "If the session is now: send the student the direct Dashboard LOGIN LINK and tell them their session is live and they can join.", "اشرح له خطوات الدخول من منصة التعلم.": "Explain the joining steps on the learning platform.", "اسأله إن كان برنامج Zoom مثبّتاً على جهازه. إذا لم يكن: يضغط Join من المنصة، ثم يختار Join from Your Browser ليدخل من المتصفح مباشرة.": "Ask whether Zoom is installed. If not: press Join on the platform, then choose Join from Your Browser to enter directly from the browser.", "موعد الجلسة على السيستم قائم الآن": "Session time in the system is now", "الطالب على لابتوب أو كمبيوتر (ليس موبايل أو تابلت)": "Student is on a laptop or computer (not a phone or tablet)", "أُرسل رابط الدخول المباشر (LOGIN LINK)": "Direct LOGIN LINK sent", "Zoom مثبّت، أو شُرح له Join from Your Browser": "Zoom installed, or Join from Your Browser explained", "الدخول من الموبايل أو التابلت غير متاح.": "Joining from a phone or tablet is not supported.", "إذا لم تبدأ الجلسة بعد: أبلغه بالموعد المسجّل (موضوع \"السؤال عن موعد الجلسة الافتراضية\").": "If the session hasn’t started: give the registered time (topic “Online session time inquiry”).", "إذا ظهرت مشكلة أثناء الدخول: انتقل إلى موضوع \"مشكلة في الدخول إلى الجلسة الافتراضية\".": "If a problem appears while joining: go to the topic “Online session join issue”.", "أهلاً بحضرتك، ياريت تجرب تفتح الرابط من متصفح تاني زي Google Chrome، وتتأكد إن الإنترنت شغال كويس، وبعدها ادخل تاني. ولو المشكلة لسه موجودة بلّغنا وإحنا معاك.": "Hello, please try opening the link in another browser such as Google Chrome, make sure your internet connection is working, then join again. If the problem continues, let us know and we’ll help.", "أهلاً بحضرتك، المشكلة اتحلت. ياريت تعمل Refresh للصفحة وهتقدر تدخل السيشن بشكل طبيعي.": "Hello, the issue is fixed. Please refresh the page and you’ll be able to join the session normally.", "بنعتذر جداً لحضرتك عن التأخير. المدرب موجود في السيشن دلوقتي، وتقدر تنضم وتحضرها حالاً.": "We’re very sorry for the delay. The trainer is in the session now, and you can join right away.", "حدّد المشكلة: الرابط لا يحمّل، أو رسالة Host locked the session، أو المدرب لم يدخل الجلسة.": "Identify the problem: the link won’t load, a “Host locked the session” message, or the trainer hasn’t joined.", "الرابط لا يحمّل: اطلب من الطالب تغيير المتصفح والتأكد من اتصال الإنترنت.": "Link won’t load: ask the student to switch browsers and check the internet connection.", "رسالة Host locked the session: أرسل الحالة إلى بيتر ليراجعها ويحلّها. بعد أن يؤكد بيتر الحل، اطلب من الطالب عمل Refresh للصفحة ليدخل بشكل طبيعي.": "“Host locked the session”: send the case to Peter to review and fix. After Peter confirms, ask the student to refresh the page and join normally.", "المدرب لم يدخل الجلسة: تواصل مع بيتر ليراجع الحالة. بعد أن يؤكد بيتر دخول المدرب، اعتذر للطالب وأبلغه أن المدرب في الجلسة الآن ويستطيع الانضمام.": "Trainer hasn’t joined: contact Peter to review. After Peter confirms the trainer joined, apologize and tell the student they can join now.", "Student ID وموعد الجلسة": "Student ID and session time", "نوع المشكلة: الرابط / Host locked / المدرب لم يدخل": "Problem type: link / Host locked / trainer absent", "المتصفح المستخدم واتصال الإنتر   function renderChildren(src, scope, out) {
    for (var n = src.firstChild; n; n = n.nextSibling) renderNode(n, scope, out);
  }
  function renderNode(n, scope, out) {
    if (n.nodeType === 3) { out.appendChild(document.createTextNode(interp(T(n.nodeValue), scope))); return; }
    if (n.nodeType !== 1) return;
    var tag = n.localName;
    if (tag === 'template' && n.dataset.sc) {
      if (n.dataset.sc === 'for') {
        var m = WHOLE.exec(n.getAttribute('list') || '');
        var list = m ? lookup(m[1], scope) : [];
        var as = n.getAttribute('as') || 'item';
        (list || []).forEach(function (item, i) {
          var x = {}; x[as] = item; x.$index = i;
          renderChildren(n.content, child(scope, x), out);
        });
      } else {
        var mv = WHOLE.exec(n.getAttribute('value') || '');
        if (mv && lookup(mv[1], scope)) renderChildren(n.content, scope, out);
      }
      return;
    }
    if (tag === 'dc-import') {
      var props = {};
      Array.prototype.forEach.call(n.attributes, function (a) {
        if (a.name === 'name' || a.name.indexOf('hint-') === 0) return;
        var key = a.name.replace(/-([a-z])/g, function (_, c) { return c.toUpperCase(); });
        var w = WHOLE.exec(a.value);
        props[key] = w ? lookup(w[1], scope) : interp(a.value, scope);
      });
      out.appendChild(mount(n.getAttribute('name'), props, current + ':' + n.getAttribute('name')));
      return;
    }
    var el = n.namespaceURI && n.namespaceURI !== 'http://www.w3.org/1999/xhtml'
      ? document.createElementNS(n.namespaceURI, n.tagName)
      : document.createElement(tag);
    Array.prototype.forEach.call(n.attributes, function (a) {
      var name = a.name, w = WHOLE.exec(a.value);
      if (/^on[a-z]+$/.test(name)) {
        var fn = w ? lookup(w[1], scope) : null;
        if (typeof fn === 'function') el.addEventListener(name.slice(2), function (ev) { fn(ev); });
        return;
      }
      if (w && (name === 'checked' || name === 'selected' || name === 'disabled')) {
        if (lookup(w[1], scope)) el.setAttribute(name, '');
        return;
      }
      if (name === 'classname') name = 'class';
      var val = a.value;
      if (/^(placeholder|aria-label|value|title|alt|label)$/.test(name)) val = T(val);
      if (LANG === 'en' && name === 'dir' && val === 'rtl') val = 'ltr';
      if (LANG === 'en' && name === 'style') val = val.replace(/text-align:\s*right/g, 'text-align: left');
      el.setAttribute(name, interp(val, scope));
    });
    if (tag === 'template') { renderChildren(n.content, scope, el.content); }
    else renderChildren(n, scope, el);
    out.appendChild(el);
  }
  function mount(name, props, key) {
    var Cls = getClass(name);
    var p = Object.assign({}, (META[name] || {}).defaults, props || {});
    var inst = instances[key];
    if (!inst) { inst = new Cls(p); instances[key] = inst; }
    inst.props = p;
    var vals = inst.renderVals() || {};
    var frag = document.createDocumentFragment();
    renderChildren(getTemplate(name), vals, frag);
    return frag;
  }

  var root = document.getElementById('screen');
  var lastRendered = null;
  function render() {
    if (!current) return;
    var y = window.scrollY;
    var same = lastRendered === current;
    var ae = document.activeElement, fid = same && ae && root.contains(ae) ? ae.id : null, ss = null, se = null;
    try { if (fid) { ss = ae.selectionStart; se = ae.selectionEnd; } } catch (e) {}
    var saved = {};
    if (same) root.querySelectorAll('input[id],textarea[id],select[id]').forEach(function (el) { if (el.type !== 'radio' && el.type !== 'checkbox') saved[el.id] = el.value; });
    var seen = {};
    if (same) root.querySelectorAll('.pd-in,.pd-pop').forEach(function (el) { seen[el.className.replace(' pd-seen', '') + '|' + el.textContent.slice(0, 160)] = 1; });
    var frag = mount(current, {}, current);
    root.classList.toggle('pd-still', same);
    root.replaceChildren(frag);
    if (same) root.querySelectorAll('.pd-in,.pd-pop').forEach(function (el) { if (seen[el.className.replace(' pd-seen', '') + '|' + el.textContent.slice(0, 160)]) el.classList.add('pd-seen'); });
    lastRendered = current;
    if (same) Object.keys(saved).forEach(function (id) {
      var el = document.getElementById(id); if (!el) return;
      if (el.tagName === 'INPUT' && el.hasAttribute('value')) return;
      if (el.tagName === 'TEXTAREA' && el.hasAttribute('readonly')) return;
      if (el.tagName === 'TEXTAREA' && el.textContent && el.textContent !== saved[id] && document.activeElement !== el && !fid) return;
      el.value = saved[id];
    });
    if (fid) { var f = document.getElementById(fid); if (f) { f.focus({ preventScroll: true }); try { if (ss != null) f.setSelectionRange(ss, se); } catch (e) {} } }
    window.scrollTo(0, y);
  }
  function go(id, hash) {
    if (!META[id]) id = 'Dashboard';
    var changed = id !== current;
    current = id;
    document.getElementById('screen-css').textContent =
      document.getElementById('css-' + id).textContent + '\n' + document.getElementById('css-AppNav').textContent.replace(/body\{margin:0\}/, '');
    document.title = LANG === 'en' ? 'iSchool Pedia — ' + LABELS_EN[id] : META[id].title;
    render();
    pick.value = id;
    var idx = SCREENS.findIndex(function (s) { return s.id === id; });
    pos.textContent = (idx + 1) + ' / ' + SCREENS.length;
    if (hash) {
      var t = document.getElementById(hash.slice(1));
      if (t) { t.scrollIntoView({ block: 'start' }); return; }
    }
    if (changed) window.scrollTo(0, 0);
  }
  function route() {
    var m = /^#\/([A-Za-z]+)(?:\/(.*))?$/.exec(location.hash);
    go(m ? m[1] : 'Dashboard', m && m[2] ? '#' + m[2] : null);
  }
  function navigate(id, hash) {
    var target = '#/' + id + (hash ? '/' + hash.slice(1) : '');
    if (location.hash === target) route(); else location.hash = target;
  }

  var pick = document.getElementById('proto-pick');
  var pos = document.getElementById('proto-pos');
  function buildBar() {
    var u = UI[LANG];
    document.documentElement.lang = LANG;
    document.documentElement.dir = LANG === 'en' ? 'ltr' : 'rtl';
    document.getElementById('proto-lbl').textContent = u.lbl;
    var pv = document.getElementById('proto-prev'), nx = document.getElementById('proto-next'), lg = document.getElementById('proto-lang');
    pv.textContent = u.prev; pv.setAttribute('aria-label', u.prevA);
    nx.textContent = u.next; nx.setAttribute('aria-label', u.nextA);
    lg.textContent = u.lang; lg.setAttribute('aria-label', u.langA);
    pick.replaceChildren();
    ['Agent', 'Admin'].forEach(function (g) {
      var og = document.createElement('optgroup');
      og.label = g === 'Agent' ? u.agent : u.admin;
      SCREENS.filter(function (s) { return s.group === g; }).forEach(function (s) {
        var o = document.createElement('option'); o.value = s.id;
        o.textContent = LANG === 'en' ? LABELS_EN[s.id] : s.label; og.appendChild(o);
      });
      pick.appendChild(og);
    });
    if (current) pick.value = current;
  }
  buildBar();
  document.getElementById('proto-lang').addEventListener('click', function () {
    LANG = LANG === 'en' ? 'ar' : 'en';
    window.__PEDIA_LANG = LANG; Object.keys(instances).forEach(function (k) { if (k.indexOf('Article') === 0) delete instances[k]; });
    try { localStorage.setItem('pedia-lang', LANG); } catch (e) {}
    buildBar(); render();
    document.title = LANG === 'en' ? 'iSchool Pedia — ' + LABELS_EN[current] : META[current].title;
  });
  pick.addEventListener('change', function () { navigate(pick.value); });
  function step(d) {
    var i = SCREENS.findIndex(function (s) { return s.id === current; });
    navigate(SCREENS[(i + d + SCREENS.length) % SCREENS.length].id);
  }
  document.getElementById('proto-prev').addEventListener('click', function () { step(-1); });
  document.getElementById('proto-next').addEventListener('click', function () { step(1); });

  document.addEventListener('click', function (ev) {
    var a = ev.target.closest && ev.target.closest('a[href]');
    if (!a || (a.isConnected && !root.contains(a))) return;
    var href = a.getAttribute('href');
    var m = /^([A-Za-z]+)\.dc\.html(#.+)?$/.exec(href);
    if (m) { ev.preventDefault(); navigate(m[1], m[2]); return; }
    if (href.charAt(0) === '#') {
      ev.preventDefault();
      if (href.length > 1) { var t = document.getElementById(href.slice(1)); if (t) t.scrollIntoView({ behavior: 'smooth', block: 'start' }); }
    }
  });
  document.addEventListener('submit', function (ev) { ev.preventDefault(); });
  window.addEventListener('hashchange', route);
  route();
})();
</script>
</body>
