/* == PD DS START == iSchool Pedia design system v1 — single source: scratchpad/ds/design_system.css (injected by apply_ds.py) */
:root{--pd-sky:#05ACFF;--pd-sun:#FFBB1C;--pd-rust:#C76316;--pd-ice:#B1D1E6;--pd-blue:#056FEC;--pd-blue-d:#043FAD;--pd-blue-dd:#032F82;--pd-yellow:#FFD700;--pd-orange:#FF7F1C;--pd-ink:#14213D;--pd-ink-2:#273248;--pd-ink-3:#3B465C;--pd-muted:#5A6478;--pd-canvas:#ECF8FF;--pd-surface:#FFFFFF;--pd-sunk:#F5FAFE;--pd-line:#CAE2F0;--pd-line-2:#E6F0F9;--pd-line-3:#C9DCEE;--pd-tint:#ECF8FF;--pd-ok:#0F6B3A;--pd-ok-bg:#E9F7EF;--pd-ok-line:#9CCFB2;--pd-warn:#7A5200;--pd-warn-bg:#FFF7D1;--pd-warn-line:#FFE16B;--pd-bad:#A14A06;--pd-bad-bg:#FFEEDF;--pd-bad-line:#FFC9A0;--pd-info:#03679A;--pd-info-bg:#E1F5FF;--pd-r-sm:10px;--pd-r:14px;--pd-r-lg:22px;--pd-shadow:0 1px 2px rgba(4,63,173,.05),0 1px 1px rgba(20,33,61,.03);--pd-shadow-lg:0 12px 32px -16px rgba(4,63,173,.35);--pd-head:'Somar Rounded','Baloo Bhaijaan 2',sans-serif;--pd-body:'Somar Rounded','IBM Plex Sans Arabic',sans-serif}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--pd-canvas)}
.pd-main a{text-decoration:none}.pd-main a:not([class]){color:var(--pd-blue-d);text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:3px;text-decoration-color:rgba(4,63,173,.35)}.pd-main a:not([class]):hover{color:var(--pd-blue-dd);text-decoration-color:currentColor}
.pd-main a.pd-row,.pd-main a.card,.pd-main a.kpi,.pd-main a.att,.pd-main a.qlink{color:var(--pd-ink)}
.pd-main a.btn:hover,.pd-main a.card:hover,.pd-main a.pd-row:hover,.pd-main a.chip:hover,.pd-main a.kpi:hover{text-decoration:none}
:focus-visible{outline:3px solid var(--pd-blue);outline-offset:2px}
.pd-sr{position:absolute!important;width:1px!important;height:1px!important;overflow:hidden!important;clip:rect(0 0 0 0)!important;white-space:nowrap!important}
/* shell */
.pd-app{font-family:var(--pd-body);color:var(--pd-ink);background:var(--pd-canvas);min-height:100vh;display:flex;flex-wrap:wrap;flex-direction:row-reverse}
.pd-side{flex:1 1 248px;background:var(--pd-blue-d)}
.pd-main{flex:999 1 640px;min-width:0;box-sizing:border-box;padding:24px 28px 72px}
.pd-page{max-width:1240px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
.pd-head{display:flex;flex-wrap:wrap;align-items:flex-end;gap:12px 16px}
.pd-head-t{flex:1 1 320px;min-width:0;display:flex;flex-direction:column;gap:4px}
.pd-crumbs{display:flex;flex-wrap:wrap;align-items:center;gap:6px;font-size:13px;color:var(--pd-muted);margin:0;padding:0;list-style:none}
.pd-crumbs a{color:var(--pd-muted)}.pd-crumbs a:hover{color:var(--pd-blue-d)}
.pd-crumbs li+li::before{content:"‹";margin-inline-end:6px;color:var(--pd-line-3)}
.pd-h1{margin:0;font-family:var(--pd-head);font-size:28px;line-height:1.3;font-weight:700;color:var(--pd-ink)}
.pd-lead{margin:0;font-size:14.5px;line-height:1.7;color:var(--pd-muted);max-width:72ch}
.pd-actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.pd-h2{margin:0;font-family:var(--pd-head);font-size:18px;line-height:1.4;font-weight:700}
.pd-h3{margin:0;font-size:15px;font-weight:700}
.pd-eyebrow{font-size:12px;font-weight:700;letter-spacing:.3px;color:var(--pd-muted)}
.pd-muted{color:var(--pd-muted)}
/* surfaces */
.card{background:var(--pd-surface);border:1px solid var(--pd-line);border-radius:var(--pd-r-lg);box-shadow:var(--pd-shadow)}
.pd-pad{padding:18px 20px}
.pd-sec-h{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;padding:16px 20px;border-bottom:1px solid var(--pd-line-2)}
.pd-sec-h .pd-h2{flex:1;min-width:0}
.pd-grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(min(100%,var(--min,260px)),1fr))}
.pd-split{display:flex;flex-wrap:wrap;gap:20px;align-items:flex-start}
.pd-split>.pd-aside{flex:1 1 340px;min-width:0}
.pd-split>.pd-body{flex:999 1 560px;min-width:0;display:flex;flex-direction:column;gap:16px}
@media (min-width:1100px){.pd-sticky{position:sticky;top:16px}}
/* buttons */
.btn{font-family:inherit;font-size:14px;font-weight:600;line-height:1.2;padding:10px 18px;min-height:44px;box-sizing:border-box;border-radius:999px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--pd-line-3);background:var(--pd-surface);color:var(--pd-ink-2);text-decoration:none;white-space:nowrap}
.btn:hover{border-color:var(--pd-blue);color:var(--pd-blue-d);text-decoration:none}
.btn-primary{background:var(--pd-blue);border-color:var(--pd-blue);color:#fff}.btn-primary:hover{background:var(--pd-blue-d);border-color:var(--pd-blue-d);color:#fff}
.btn-dark{background:var(--pd-blue-d);border-color:var(--pd-blue-d);color:#fff}.btn-dark:hover{background:var(--pd-blue-dd);border-color:var(--pd-blue-dd);color:#fff}
.btn-accent{background:var(--pd-yellow);border-color:var(--pd-yellow);color:var(--pd-ink)}.btn-accent:hover{background:#FFE14D;border-color:#FFE14D;color:var(--pd-ink)}
.btn-ok{background:var(--pd-ok);border-color:var(--pd-ok);color:#fff}.btn-ok:hover{filter:brightness(1.08);color:#fff}
.btn-ghost{background:transparent;border-color:transparent;color:var(--pd-blue-d)}.btn-ghost:hover{background:var(--pd-tint);border-color:transparent}
.btn-danger{color:var(--pd-bad)}.btn-danger:hover{border-color:var(--pd-bad);color:var(--pd-bad);background:var(--pd-bad-bg)}
.btn-sm{min-height:36px;padding:6px 14px;font-size:13px}
.btn-block{width:100%}
.btn:disabled,.btn[aria-disabled=true]{opacity:.45;cursor:not-allowed;filter:none}
.btn.is-done{background:var(--pd-ok);border-color:var(--pd-ok);color:#fff}
/* chips & badges */
.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:600;line-height:1.6;white-space:nowrap;background:var(--pd-line-2);color:var(--pd-ink-3)}
.chip-brand{background:var(--pd-tint);color:var(--pd-blue-d)}.chip-ok{background:var(--pd-ok-bg);color:var(--pd-ok)}.chip-warn{background:var(--pd-warn-bg);color:var(--pd-warn)}.chip-bad{background:var(--pd-bad-bg);color:var(--pd-bad)}.chip-info{background:var(--pd-info-bg);color:var(--pd-info)}.chip-dark{background:var(--pd-blue-d);color:#fff}.chip-accent{background:var(--pd-yellow);color:var(--pd-ink)}
.dot{width:8px;height:8px;border-radius:50%;flex:none;display:inline-block;background:currentColor}
/* segmented filters / tabs */
.seg{display:inline-flex;flex-wrap:wrap;gap:4px;padding:4px;border-radius:999px;background:var(--pd-surface);border:1px solid var(--pd-line)}
.seg>button,.seg>a{font-family:inherit;font-size:13.5px;font-weight:600;min-height:36px;padding:0 14px;border-radius:999px;border:0;background:transparent;color:var(--pd-ink-3);cursor:pointer;display:inline-flex;align-items:center;gap:6px;text-decoration:none}
.seg>button:hover{background:var(--pd-tint);color:var(--pd-blue-d)}
.seg>[aria-pressed=true],.seg>[aria-selected=true],.seg>[aria-current=page]{background:var(--pd-blue-d);color:#fff}
.seg .n{font-size:11px;font-weight:700;padding:0 7px;border-radius:999px;background:rgba(20,33,61,.08);line-height:18px}
.seg>[aria-pressed=true] .n,.seg>[aria-selected=true] .n{background:#fff;color:var(--pd-blue-d)}
/* toolbar */
.pd-toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.pd-search{position:relative;flex:1 1 260px;min-width:0}
.pd-search>svg{position:absolute;inset-inline-start:14px;top:50%;transform:translateY(-50%);color:var(--pd-muted);pointer-events:none}
.pd-search>.inp{padding-inline-start:40px;border-radius:999px}
/* forms */
.inp{width:100%;box-sizing:border-box;font-family:inherit;font-size:14.5px;line-height:1.6;padding:9px 14px;border:1px solid var(--pd-line-3);border-radius:12px;background:var(--pd-surface);color:var(--pd-ink);min-height:44px;transition:border-color .15s,box-shadow .15s}
.inp:hover{border-color:#9DBCDB}.inp:focus{border-color:var(--pd-blue);box-shadow:0 0 0 3px rgba(5,111,236,.15);outline:none}
.inp[aria-invalid=true]{border-color:var(--pd-bad);box-shadow:0 0 0 3px rgba(161,74,6,.12)}
textarea.inp{resize:vertical}
.lbl{display:block;font-size:13px;font-weight:600;color:var(--pd-ink-3);margin-bottom:6px}
.lbl .req{color:var(--pd-bad)}
.hint{font-size:12.5px;color:var(--pd-muted);margin-top:4px}
.err{font-size:13px;color:var(--pd-bad);font-weight:600}
.pd-form{display:flex;flex-direction:column;gap:14px}
.pd-form-row{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr))}
.pd-form-actions{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding-top:4px}
/* notes / banners */
.note{display:flex;gap:10px;align-items:flex-start;padding:12px 16px;border-radius:var(--pd-r);font-size:14px;line-height:1.7;border:1px solid var(--pd-line);background:var(--pd-sunk);color:var(--pd-ink-2)}
.note-info{background:var(--pd-tint);border-color:#B1D1E6;color:var(--pd-blue-d)}.note-warn{background:var(--pd-warn-bg);border-color:var(--pd-warn-line);color:#5C3D00}.note-ok{background:var(--pd-ok-bg);border-color:var(--pd-ok-line);color:var(--pd-ok)}.note-bad{background:var(--pd-bad-bg);border-color:var(--pd-bad-line);color:var(--pd-bad)}
/* kpi */
.kpi{display:flex;flex-direction:column;gap:2px;padding:16px 18px;text-align:start;font-family:inherit;color:inherit;text-decoration:none}
.kpi .k-l{font-size:13px;color:var(--pd-muted)}.kpi .k-v{font-family:var(--pd-head);font-size:30px;font-weight:700;line-height:1.2}.kpi .k-s{font-size:12.5px;color:var(--pd-muted)}
a.kpi:hover,button.kpi:hover{text-decoration:none}
/* lists */
.pd-list{display:flex;flex-direction:column}
.pd-row{display:flex;align-items:flex-start;gap:12px;padding:12px 20px;border-top:1px solid var(--pd-line-2);color:inherit;text-decoration:none}
.pd-row:first-child{border-top:0}
a.pd-row:hover,button.pd-row:hover{background:var(--pd-sunk);text-decoration:none}
button.pd-row{font-family:inherit;width:100%;text-align:start;background:transparent;border-left:0;border-right:0;border-bottom:0;cursor:pointer}
/* tables → cards on mobile */
.tbl-wrap{overflow-x:auto;position:relative}
.tbl{width:100%;border-collapse:collapse}
.tbl th{font-size:12.5px;font-weight:700;color:var(--pd-muted);text-align:start;padding:10px 14px;border-bottom:1px solid var(--pd-line);background:var(--pd-sunk);white-space:nowrap}
.tbl td{padding:12px 14px;border-bottom:1px solid var(--pd-line-2);font-size:14px;vertical-align:middle;line-height:1.6}
.tbl tbody tr:hover{background:#FAFCFF}
.tbl tbody tr:last-child td{border-bottom:0}
@media (max-width:640px){.tbl.tbl-stack,.tbl.tbl-stack tbody,.tbl.tbl-stack tr,.tbl.tbl-stack td{display:block;width:100%;box-sizing:border-box}.tbl.tbl-stack{min-width:0!important}.tbl.tbl-stack thead{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}.tbl.tbl-stack tr{padding:12px 16px;border-bottom:1px solid var(--pd-line-2)}.tbl.tbl-stack td{border:0;padding:3px 0;display:flex;gap:10px;align-items:baseline}.tbl.tbl-stack td[data-label]::before{content:attr(data-label);flex:0 0 36%;font-size:12px;font-weight:700;color:var(--pd-muted)}}
/* empty / status */
.empty{display:flex;flex-direction:column;align-items:center;text-align:center;gap:8px;padding:32px 20px;color:var(--pd-muted)}
.empty .e-ic{width:48px;height:48px;border-radius:50%;background:var(--pd-tint);color:var(--pd-blue-d);display:flex;align-items:center;justify-content:center;font-size:20px}
.empty .e-t{font-weight:700;color:var(--pd-ink);font-size:15px}
.pd-lock{padding:40px 24px;text-align:center;display:flex;flex-direction:column;gap:10px;align-items:center}
/* steps */
.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;counter-reset:pdst}
.steps>li{counter-increment:pdst;position:relative;display:flex;gap:14px;align-items:flex-start;padding-bottom:14px}
.steps>li:last-child{padding-bottom:0}
.steps>li::before{content:counter(pdst);flex:none;width:30px;height:30px;border-radius:50%;background:var(--pd-blue);color:#fff;font-family:var(--pd-head);font-weight:700;font-size:14px;line-height:30px;text-align:center;position:relative;z-index:1;box-shadow:0 0 0 4px var(--pd-surface)}
.steps>li::after{content:"";position:absolute;inset-inline-start:14px;top:34px;bottom:4px;width:2px;border-radius:2px;background:#CAE2F0}
.steps>li:last-child::after{display:none}
.steps>li>span{padding-top:1px;min-width:0}
.steps.sm>li::before{width:26px;height:26px;font-size:13px;line-height:26px}
.steps.sm>li::after{inset-inline-start:12px;top:30px}
.steps>li.done::before{content:"\2713";background:var(--pd-ok)}
.steps>li.todo::before{background:#fff;color:var(--pd-muted);box-shadow:inset 0 0 0 2px #9DBCDB,0 0 0 4px #fff}
.vchk{appearance:none;-webkit-appearance:none;margin:1px 0 0;flex:none;width:26px;height:26px;border-radius:50%;border:2px solid #9DBCDB;background:#fff;display:grid;place-content:center;cursor:pointer;transition:background-color .18s,border-color .18s}
.vchk::after{content:"";width:6px;height:11px;border:solid #fff;border-width:0 2.5px 2.5px 0;transform:translate(0,-1px) rotate(45deg) scale(0);transition:transform .2s cubic-bezier(.3,1.6,.5,1)}
.vchk:checked{background:var(--pd-ok);border-color:var(--pd-ok)}
.vchk:checked::after{transform:translate(0,-1px) rotate(45deg) scale(1)}
.pbar{height:6px;border-radius:999px;background:var(--pd-line-2);overflow:hidden}
.pbar>span{display:block;height:100%;border-radius:999px;background:var(--pd-ok);transition:width .3s ease}
/* motion */
@keyframes pdRise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes pdPop{0%{opacity:0;transform:scale(.6)}70%{transform:scale(1.08)}100%{opacity:1;transform:none}}
@keyframes pdDraw{from{stroke-dashoffset:var(--len,800)}to{stroke-dashoffset:0}}
@media (prefers-reduced-motion:no-preference){
.pd-page>*{animation:pdRise .28s cubic-bezier(.2,.7,.2,1) both}
.pd-page>*:nth-child(2){animation-delay:.03s}.pd-page>*:nth-child(3){animation-delay:.06s}.pd-page>*:nth-child(4){animation-delay:.09s}.pd-page>*:nth-child(5){animation-delay:.12s}.pd-page>*:nth-child(6){animation-delay:.15s}.pd-page>*:nth-child(n+7){animation-delay:.18s}
.pd-in{animation:pdRise .26s cubic-bezier(.2,.7,.2,1) both}
.pd-pop{animation:pdPop .3s cubic-bezier(.2,.7,.2,1) both}
.steps>li{animation:pdRise .26s cubic-bezier(.2,.7,.2,1) both}
.steps>li:nth-child(2){animation-delay:.04s}.steps>li:nth-child(3){animation-delay:.08s}.steps>li:nth-child(4){animation-delay:.12s}.steps>li:nth-child(n+5){animation-delay:.16s}
.btn,.chip,.seg>*,.inp,.card,.pd-row{transition:background-color .16s,color .16s,border-color .16s,box-shadow .16s,transform .12s}
.btn:active,.seg>*:active{transform:scale(.97)}
a.card:hover,button.card:hover,.lift:hover{box-shadow:var(--pd-shadow-lg);border-color:#B1D1E6;transform:translateY(-2px)}
}
@media (max-width:640px){.pd-main{padding:18px 16px 56px}.pd-h1{font-size:23px}.pd-sec-h{padding:14px 16px}.pd-pad{padding:16px}.pd-row{padding:12px 16px}.pd-head .pd-actions{width:100%}.pd-head .pd-actions>.btn{flex:1 1 auto}}

/* ---- brand layer v2 (iSchool Identity Manual: blue surfaces, rocket swoosh, circles & bars) ---- */
.pd-head{position:relative;overflow:hidden;isolation:isolate;align-items:center;padding:26px 30px;border-radius:28px;background:var(--pd-blue);color:#fff;min-height:132px;box-sizing:border-box}
.pd-head::before{content:"";position:absolute;z-index:-1;inset-inline-end:-36px;top:-48px;width:300px;height:170px;background:url("data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%20420%20220%22%3E%3Cpath%20d%3D%22M30%20190%20C%20120%2060%2C%20300%2010%2C%20390%2070%20C%20430%20100%2C%20400%20160%2C%20340%20170%22%20fill%3D%22none%22%20stroke%3D%22%23FFD700%22%20stroke-width%3D%2226%22%20stroke-linecap%3D%22round%22/%3E%3Ccircle%20cx%3D%22336%22%20cy%3D%22170%22%20r%3D%2218%22%20fill%3D%22%23FF7F1C%22/%3E%3C/svg%3E") no-repeat center/contain;opacity:.95;transform:scaleX(-1)}
[dir=ltr] .pd-head::before{transform:none}
.pd-head::after{content:"";position:absolute;z-index:-1;inset-inline-end:28px;bottom:10px;width:160px;height:44px;background:url("data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20width%3D%22120%22%20height%3D%2244%22%20viewBox%3D%220%200%20120%2044%22%3E%3Cg%20fill%3D%22%2305ACFF%22%3E%3Ccircle%20cx%3D%228%22%20cy%3D%2210%22%20r%3D%225%22/%3E%3Crect%20x%3D%2220%22%20y%3D%225%22%20width%3D%2244%22%20height%3D%2210%22%20rx%3D%225%22/%3E%3Ccircle%20cx%3D%2276%22%20cy%3D%2210%22%20r%3D%225%22/%3E%3Crect%20x%3D%2288%22%20y%3D%225%22%20width%3D%2228%22%20height%3D%2210%22%20rx%3D%225%22/%3E%3Crect%20x%3D%224%22%20y%3D%2227%22%20width%3D%2230%22%20height%3D%2210%22%20rx%3D%225%22/%3E%3Ccircle%20cx%3D%2246%22%20cy%3D%2232%22%20r%3D%225%22/%3E%3Crect%20x%3D%2258%22%20y%3D%2227%22%20width%3D%2244%22%20height%3D%2210%22%20rx%3D%225%22/%3E%3Ccircle%20cx%3D%22112%22%20cy%3D%2232%22%20r%3D%225%22/%3E%3C/g%3E%3C/svg%3E") repeat-x;opacity:.3}
.pd-head .pd-head-t{gap:6px}
.pd-head .pd-h1{color:#fff;font-size:30px}
.pd-head .pd-lead{color:#fff;opacity:.95}
.pd-head .pd-crumbs{color:#E1F5FF}
.pd-head .pd-crumbs a,.pd-main .pd-head .pd-crumbs a:not([class]){color:#fff;text-decoration:none;font-weight:600;background:rgba(255,255,255,.16);padding:2px 12px;border-radius:999px}
.pd-head .pd-crumbs li+li::before{color:#fff}
.pd-head .pd-crumbs li:last-child{background:#043FAD;color:#fff;font-weight:700;padding:2px 12px;border-radius:999px}
.pd-head .btn{background:rgba(255,255,255,.14);border-color:rgba(255,255,255,.45);color:#fff}
.pd-head .btn:hover{background:rgba(255,255,255,.24);border-color:#fff;color:#fff}
.pd-head .btn-primary,.pd-head .btn-accent{background:var(--pd-yellow);border-color:var(--pd-yellow);color:var(--pd-ink)}
.pd-head .btn-primary:hover,.pd-head .btn-accent:hover{background:#FFE14D;border-color:#FFE14D;color:var(--pd-ink)}
.pd-head .btn-dark,.pd-head .btn-ok{background:#043FAD;border-color:#043FAD;color:#fff}
.pd-head .chip{background:rgba(255,255,255,.18);color:#fff}
.pd-head .chip-accent{background:var(--pd-yellow);color:var(--pd-ink)}
.pd-head a:focus-visible,.pd-head button:focus-visible{outline-color:var(--pd-yellow)}
.pd-h2{display:flex;align-items:center;gap:10px}
.pd-h2::before{content:"";width:12px;height:12px;border-radius:50%;background:var(--pd-yellow);box-shadow:0 0 0 3px #FFF3B0;flex:none}
.card{border-radius:var(--pd-r-lg)}
.pd-sec-h{border-bottom-color:#E1F0FB}
.kpi .k-v{color:var(--pd-blue-d)}
.seg{border-color:var(--pd-line);box-shadow:var(--pd-shadow)}
.seg>[aria-pressed=true],.seg>[aria-selected=true],.seg>[aria-current=page]{background:var(--pd-blue)}
.chip-brand{background:#DDF1FF;color:var(--pd-blue-d)}
.chip-info{background:#DDF4FF;color:var(--pd-info)}
.steps>li::before{background:var(--pd-blue);box-shadow:0 0 0 4px var(--pd-surface)}
.empty .e-ic{background:var(--pd-yellow);color:var(--pd-ink)}

.iss-tabs{display:flex;gap:4px;border-bottom:1px solid var(--pd-line);overflow-x:auto}
.iss-tab{font-family:inherit;font-size:15px;font-weight:600;min-height:48px;padding:0 16px;border:0;border-bottom:3px solid transparent;margin-bottom:-1px;background:transparent;color:var(--pd-ink-3);cursor:pointer;display:inline-flex;align-items:center;gap:8px;white-space:nowrap}
.iss-tab:hover{color:var(--pd-blue-d)}

.iss-tab .n{font-size:12px;font-weight:700;min-width:22px;text-align:center;padding:0 7px;border-radius:999px;line-height:20px;background:var(--pd-line-2);color:var(--pd-ink-3)}
.iss-tab .n.hot{background:var(--pd-orange);color:var(--pd-ink)}

.iss{padding:18px 20px;display:flex;flex-direction:column;gap:10px}
.iss.is-res{background:var(--pd-sunk)}
.iss.is-new{border-color:var(--pd-blue);box-shadow:0 0 0 3px rgba(5,111,236,.14)}
.iss-top{display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center}
.iss-id{margin-inline-start:auto;font-size:12px;color:var(--pd-muted);font-variant-numeric:tabular-nums}
.iss-t{margin:0;font-family:var(--pd-head);font-size:18px;line-height:1.45}
.iss-d{margin:0;font-size:14.5px;line-height:1.85;color:var(--pd-ink-2)}
.iss-meta{display:flex;flex-wrap:wrap;gap:2px 16px;font-size:12.5px;color:var(--pd-muted)}
.iss-reply{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;padding:10px 14px;border-radius:var(--pd-r);border:1px dashed var(--pd-line-3);background:var(--pd-surface)}
.iss-reply>div{flex:1 1 280px;min-width:0;display:flex;flex-direction:column;gap:2px}
.iss-reply .k{font-size:12px;font-weight:700;color:var(--pd-muted)}
.iss-reply .v{font-size:14px;line-height:1.8;color:var(--pd-ink)}
.iss-act{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;padding-top:10px;border-top:1px solid var(--pd-line-2)}
.iss-act .sp{flex:1 1 0}
.iss-st{display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center;font-size:12.5px;color:var(--pd-muted);font-weight:600}
.seg.sm>button{min-height:36px;font-size:13px;padding:0 12px}
.cat-opt{display:inline-flex;align-items:center;gap:8px;min-height:44px;box-sizing:border-box;padding:0 16px;border:1px solid var(--pd-line-3);border-radius:999px;font-size:14px;cursor:pointer;background:var(--pd-surface)}
.cat-opt:has(input:checked){border-color:var(--pd-blue);background:var(--pd-tint);color:var(--pd-blue-d);font-weight:600}
.cat-opt input{accent-color:var(--pd-blue);margin:0}
@media (max-width:640px){.iss-bar .seg{border-radius:22px}.iss{padding:16px}.iss-act .sp{display:none}.iss-st{width:100%}}

<script type="text/x-tpl" id="tpl-Activities">

<div dir="rtl" class="pd-app">
<div class="pd-side"><dc-import name="AppNav" active="activities" role="{{role}}" org="{{org}}" on-role="{{setRole}}" on-org="{{setOrg}}" hint-size="260px,1100px"></dc-import></div>
<main class="pd-main" id="main"><div class="pd-page">

<header class="pd-head">
<div class="pd-head-t">
<ol class="pd-crumbs" aria-label="المسار"><li><a href="Dashboard.dc.html">لوحة اليوم</a></li><li>القسم 3</li></ol>
<h1 class="pd-h1">الإشعارات والإيميلات والأنشطة</h1>
<p class="pd-lead">سجل تاريخي لما أُرسل للطلاب ومتى — للرجوع إليه قبل الرد. التسجيل يدوي ولا يرسل شيئاً.</p>
</div>
<div class="pd-actions">
<template data-sc="if" value="{{auth}}" hint-placeholder-val="{{ true }}"><button type="button" class="btn btn-primary" onClick="{{openForm}}" aria-expanded="{{formOpen}}" aria-controls="new-rec">+ إضافة سجل</button></template>
<template data-sc="if" value="{{readOnly}}" hint-placeholder-val="{{ false }}"><span class="chip">عرض فقط</span></template>
</div>
</header>

<template data-sc="if" value="{{showForm}}" hint-placeholder-val="{{ false }}">
<section class="card pd-in" id="new-rec" aria-labelledby="h-new" style="border-color: var(--pd-blue)">
<div class="pd-sec-h"><h2 id="h-new" class="pd-h2">سجل جديد</h2><span class="hint" style="margin: 0">للتوثيق فقط — لا يُرسل شيء للطلاب.</span></div>
<form class="pd-form pd-pad" onSubmit="{{save}}" novalidate>
<div class="pd-form-row">
<div><label class="lbl" for="r-type">النوع <span class="req">*</span></label><select id="r-type" class="inp" onChange="{{fType}}"><option value="email">إيميل</option><option value="notif">إشعار</option><option value="act">نشاط</option></select></div>
<div><label class="lbl" for="r-date">التاريخ <span class="req">*</span></label><input id="r-date" class="inp" type="date" value="{{fDate}}" onInput="{{fDate_}}" aria-invalid="{{dErr}}" aria-describedby="r-date-err">
<template data-sc="if" value="{{dateErr}}" hint-placeholder-val="{{ false }}"><div class="err" id="r-date-err" role="alert" style="margin-top: 6px">اختر تاريخ الإرسال.</div></template></div>
<div><label class="lbl" for="r-time">الوقت <span class="hint" style="display: inline">(اختياري)</span></label><input id="r-time" class="inp" type="time" value="{{fTime}}" onInput="{{fTime_}}"></div>
<div><label class="lbl" for="r-org">المؤسسة <span class="req">*</span></label><select id="r-org" class="inp" onChange="{{fOrg}}"><template data-sc="for" list="{{orgOpts}}" as="o" hint-placeholder-count="4"><option value="{{o.v}}" selected="{{o.sel}}">{{o.label}}</option></template></select></div>
<div><label class="lbl" for="r-int">الدفعة</label><input id="r-int" class="inp" onInput="{{fIntake}}" placeholder="الدفعة الثالثة"></div>
</div>
<div><label class="lbl" for="r-desc">الوصف <span class="req">*</span></label><textarea id="r-desc" class="inp" rows="3" onInput="{{fDesc}}" placeholder="مثال: إرسال متطلبات التخرج للطلاب" aria-invalid="{{xErr}}" aria-describedby="r-desc-err"></textarea>
<template data-sc="if" value="{{descErr}}" hint-placeholder-val="{{ false }}"><div class="err" id="r-desc-err" role="alert" style="margin-top: 6px">اكتب وصفاً للسجل.</div></template></div>
<div class="pd-form-actions">
<button type="submit" class="btn btn-primary">حفظ السجل</button>
<button type="button" class="btn btn-ghost" onClick="{{closeForm}}">إلغاء</button>
</div>
</form>
</section>
</template>

<template data-sc="if" value="{{hasFlash}}" hint-placeholder-val="{{ false }}">
<div class="note note-ok pd-in" role="status"><span aria-hidden="true">✓</span><span style="flex: 1">{{flashMsg}}</span><button type="button" class="btn btn-ghost btn-sm" onClick="{{dismiss}}">إخفاء</button></div>
</template>

<div class="card pd-pad pd-toolbar" style="padding: 12px 14px">
<div class="pd-search" role="search">
<svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg>
<label for="aq" class="pd-sr">ابحث في السجل</label>
<input id="aq" class="inp" type="search" value="{{q}}" onInput="{{onQ}}" autocomplete="off" placeholder="هل أُرسل إيميل عن…؟ ابحث بالوصف">
</div>
<div class="act-mf">
<label class="lbl" for="amonth">الشهر</label>
<select id="amonth" class="inp" onChange="{{pickMonth}}">
<template data-sc="for" list="{{months}}" as="m" hint-placeholder-count="4"><option value="{{m.v}}" selected="{{m.sel}}">{{m.label}}</option></template>
</select>
</div>
<div class="seg" role="group" aria-label="النوع">
<template data-sc="for" list="{{types}}" as="t" hint-placeholder-count="4">
<button type="button" aria-pressed="{{t.on}}" onClick="{{t.pick}}">{{t.label}} <span class="n">{{t.count}}</span></button>
</template>
</div>
<span class="chip chip-brand">المؤسسة: {{orgName}}</span>
</div>

<section class="card act-log" style="overflow: hidden" aria-labelledby="h-log">
<div class="pd-sec-h"><h2 id="h-log" class="pd-h2">السجل</h2><span class="act-cnt" aria-live="polite">{{countLabel}}</span>
<template data-sc="if" value="{{hasQ}}" hint-placeholder-val="{{ false }}"><button type="button" class="btn btn-ghost btn-sm" onClick="{{clearQ}}">مسح البحث</button></template>
</div>
<template data-sc="for" list="{{groups}}" as="g" hint-placeholder-count="1">
<div class="act-m">
<span class="act-m-ic" aria-hidden="true"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="3"></rect><path d="M3 10h18M8 3v4M16 3v4"></path></svg></span>
<span class="act-m-t"><b id="{{g.id}}">{{g.label}}</b><span class="act-m-n">{{g.count}}</span></span>
<span class="act-m-c">
<template data-sc="for" list="{{g.sum}}" as="c" hint-placeholder-count="3"><span class="act-sum"><b class="{{c.cls}}">{{c.n}}</b><span>{{c.label}}</span></span></template>
</span>
</div>
<div class="tbl-wrap">
<table class="tbl tbl-stack act-tbl" aria-labelledby="{{g.id}}">
<colgroup><col style="width: 21%"><col style="width: 15%"><col style="width: 14%"><col><col style="width: 11%"><template data-sc="if" value="{{canEdit}}" hint-placeholder-val="{{ true }}"><col style="width: 13%"></template></colgroup>
<thead class="{{g.thCls}}"><tr><th scope="col">التاريخ</th><th scope="col">النوع</th><th scope="col">المؤسسة / الدفعة</th><th scope="col">الوصف</th><th scope="col">أضافه</th><template data-sc="if" value="{{canEdit}}" hint-placeholder-val="{{ true }}"><th scope="col"><span class="pd-sr">إجراءات</span></th></template></tr></thead>
<tbody>
<template data-sc="for" list="{{g.rows}}" as="r" hint-placeholder-count="3">
<tr class="{{r.cls}}">
<td data-label="{{L.date}}" class="act-date">
<span class="act-dt">
<span class="act-badge" aria-hidden="true"><b>{{r.day}}</b><span>{{r.mon}}</span></span>
<template data-sc="if" value="{{r.view}}" hint-placeholder-val="{{ true }}"><span class="act-dtx"><span class="act-wd">{{r.wd}}</span><span class="act-full">{{r.full}}</span>
<template data-sc="if" value="{{r.hasTime}}" hint-placeholder-val="{{ true }}"><span class="act-tm"><svg aria-hidden="true" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v5l3 2"></path></svg><span>{{r.time}}</span></span></template></span></template>
<template data-sc="if" value="{{r.editing}}" hint-placeholder-val="{{ false }}"><span class="act-ed"><label for="ae-date" class="pd-sr">التاريخ</label><input id="ae-date" class="inp" type="date" value="{{ed.date}}" onInput="{{edDate}}" aria-invalid="{{edDErr}}"><label for="ae-time" class="pd-sr">الوقت</label><input id="ae-time" class="inp" type="time" value="{{ed.time}}" onInput="{{edTime}}"></span></template>
</span>
</td>
<td data-label="{{L.type}}"><span class="act-tc {{r.tcls}}">
<template data-sc="if" value="{{r.isEmail}}" hint-placeholder-val="{{ true }}"><svg aria-hidden="true" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"></rect><path d="M3 7l9 6 9-6"></path></svg></template>
<template data-sc="if" value="{{r.isNotif}}" hint-placeholder-val="{{ false }}"><svg aria-hidden="true" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 1 1 12 0c0 7 3 9 3 9H3s3-2 3-9"></path><path d="M10 21h4"></path></svg></template>
<template data-sc="if" value="{{r.isAct}}" hint-placeholder-val="{{ false }}"><svg aria-hidden="true" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 21V4M5 4h11l-2 4 2 4H5"></path></svg></template>
{{r.typeLabel}}</span></td>
<td data-label="{{L.org}}"><span class="act-org"><span>{{r.orgName}}</span><template data-sc="if" value="{{r.hasIntake}}" hint-placeholder-val="{{ true }}"><span>{{r.intake}}</span></template></span></td>
<td data-label="{{L.desc}}">
<template data-sc="if" value="{{r.view}}" hint-placeholder-val="{{ true }}"><span>{{r.desc}}</span></template>
<template data-sc="if" value="{{r.editing}}" hint-placeholder-val="{{ false }}"><span style="display: flex; flex-direction: column; gap: 6px"><label for="ae-desc" class="pd-sr">الوصف</label><textarea id="ae-desc" class="inp" rows="3" onInput="{{edDesc}}" aria-invalid="{{edXErr}}">{{ed.desc}}</textarea>
<template data-sc="if" value="{{edErr}}" hint-placeholder-val="{{ false }}"><span class="err" role="alert">{{edErrMsg}}</span></template></span></template>
</td>
<td data-label="{{L.by}}" style="color: var(--pd-muted)">{{r.by}}</td>
<template data-sc="if" value="{{canEdit}}" hint-placeholder-val="{{ true }}"><td data-label="{{L.act}}">
<template data-sc="if" value="{{r.view}}" hint-placeholder-val="{{ true }}"><button type="button" class="btn btn-sm" onClick="{{r.edit}}" aria-label="تعديل سجل {{r.dm}}">تعديل</button></template>
<template data-sc="if" value="{{r.editing}}" hint-placeholder-val="{{ false }}"><span style="display: flex; flex-wrap: wrap; gap: 6px"><button type="button" class="btn btn-ok btn-sm" onClick="{{edSave}}">حفظ</button><button type="button" class="btn btn-ghost btn-sm" onClick="{{edCancel}}">إلغاء</button></span></template>
</td></template>
</tr>
</template>
</tbody>
</table>
</div>
</template>
<template data-sc="if" value="{{empty}}" hint-placeholder-val="{{ false }}">
<div class="empty"><span class="e-ic" aria-hidden="true">?</span><span class="e-t">{{emptyT}}</span><span>{{emptyS}}</span>
<span style="display: flex; flex-wrap: wrap; gap: 8px; justify-content: center">
<template data-sc="if" value="{{hasQ}}" hint-placeholder-val="{{ false }}"><button type="button" class="btn btn-sm" onClick="{{clearQ}}">مسح البحث</button></template>
<template data-sc="if" value="{{typeOn}}" hint-placeholder-val="{{ false }}"><button type="button" class="btn btn-sm" onClick="{{allTypes}}">عرض كل الأنواع</button></template>
<template data-sc="if" value="{{monthOn}}" hint-placeholder-val="{{ false }}"><button type="button" class="btn btn-sm" onClick="{{allMonths}}">عرض كل الشهور</button></template>
</span>
</div>
</template>
</section>

</div></main>
</div>
</script>
<script type="text/x-css" id="css-Activities">
/* == PD DS START == iSchool Pedia design system v1 — single source: scratchpad/ds/design_system.css (injected by apply_ds.py) */
:root{--pd-sky:#05ACFF;--pd-sun:#FFBB1C;--pd-rust:#C76316;--pd-ice:#B1D1E6;--pd-blue:#056FEC;--pd-blue-d:#043FAD;--pd-blue-dd:#032F82;--pd-yellow:#FFD700;--pd-orange:#FF7F1C;--pd-ink:#14213D;--pd-ink-2:#273248;--pd-ink-3:#3B465C;--pd-muted:#5A6478;--pd-canvas:#ECF8FF;--pd-surface:#FFFFFF;--pd-sunk:#F5FAFE;--pd-line:#CAE2F0;--pd-line-2:#E6F0F9;--pd-line-3:#C9DCEE;--pd-tint:#ECF8FF;--pd-ok:#0F6B3A;--pd-ok-bg:#E9F7EF;--pd-ok-line:#9CCFB2;--pd-warn:#7A5200;--pd-warn-bg:#FFF7D1;--pd-warn-line:#FFE16B;--pd-bad:#A14A06;--pd-bad-bg:#FFEEDF;--pd-bad-line:#FFC9A0;--pd-info:#03679A;--pd-info-bg:#E1F5FF;--pd-r-sm:10px;--pd-r:14px;--pd-r-lg:22px;--pd-shadow:0 1px 2px rgba(4,63,173,.05),0 1px 1px rgba(20,33,61,.03);--pd-shadow-lg:0 12px 32px -16px rgba(4,63,173,.35);--pd-head:'Somar Rounded','Baloo Bhaijaan 2',sans-serif;--pd-body:'Somar Rounded','IBM Plex Sans Arabic',sans-serif}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--pd-canvas)}
.pd-main a{text-decoration:none}.pd-main a:not([class]){color:var(--pd-blue-d);text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:3px;text-decoration-color:rgba(4,63,173,.35)}.pd-main a:not([class]):hover{color:var(--pd-blue-dd);text-decoration-color:currentColor}
.pd-main a.pd-row,.pd-main a.card,.pd-main a.kpi,.pd-main a.att,.pd-main a.qlink{color:var(--pd-ink)}
.pd-main a.btn:hover,.pd-main a.card:hover,.pd-main a.pd-row:hover,.pd-main a.chip:hover,.pd-main a.kpi:hover{text-decoration:none}
:focus-visible{outline:3px solid var(--pd-blue);outline-offset:2px}
.pd-sr{position:absolute!important;width:1px!important;height:1px!important;overflow:hidden!important;clip:rect(0 0 0 0)!important;white-space:nowrap!important}
/* shell */
.pd-app{font-family:var(--pd-body);color:var(--pd-ink);background:var(--pd-canvas);min-height:100vh;display:flex;flex-wrap:wrap;flex-direction:row-reverse}
.pd-side{flex:1 1 248px;background:var(--pd-blue-d)}
.pd-main{flex:999 1 640px;min-width:0;box-sizing:border-box;padding:24px 28px 72px}
.pd-page{max-width:1240px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
.pd-head{display:flex;flex-wrap:wrap;align-items:flex-end;gap:12px 16px}
.pd-head-t{flex:1 1 320px;min-width:0;display:flex;flex-direction:column;gap:4px}
.pd-crumbs{display:flex;flex-wrap:wrap;align-items:center;gap:6px;font-size:13px;color:var(--pd-muted);margin:0;padding:0;list-style:none}
.pd-crumbs a{color:var(--pd-muted)}.pd-crumbs a:hover{color:var(--pd-blue-d)}
.pd-crumbs li+li::before{content:"‹";margin-inline-end:6px;color:var(--pd-line-3)}
.pd-h1{margin:0;font-family:var(--pd-head);font-size:28px;line-height:1.3;font-weight:700;color:var(--pd-ink)}
.pd-lead{margin:0;font-size:14.5px;line-height:1.7;color:var(--pd-muted);max-width:72ch}
.pd-actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.pd-h2{margin:0;font-family:var(--pd-head);font-size:18px;line-height:1.4;font-weight:700}
.pd-h3{margin:0;font-size:15px;font-weight:700}
.pd-eyebrow{font-size:12px;font-weight:700;letter-spacing:.3px;color:var(--pd-muted)}
.pd-muted{color:var(--pd-muted)}
/* surfaces */
.card{background:var(--pd-surface);border:1px solid var(--pd-line);border-radius:var(--pd-r-lg);box-shadow:var(--pd-shadow)}
.pd-pad{padding:18px 20px}
.pd-sec-h{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;padding:16px 20px;border-bottom:1px solid var(--pd-line-2)}
.pd-sec-h .pd-h2{flex:1;min-width:0}
.pd-grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(min(100%,var(--min,260px)),1fr))}
.pd-split{display:flex;flex-wrap:wrap;gap:20px;align-items:flex-start}
.pd-split>.pd-aside{flex:1 1 340px;min-width:0}
.pd-split>.pd-body{flex:999 1 560px;min-width:0;display:flex;flex-direction:column;gap:16px}
@media (min-width:1100px){.pd-sticky{position:sticky;top:16px}}
/* buttons */
.btn{font-family:inherit;font-size:14px;font-weight:600;line-height:1.2;padding:10px 18px;min-height:44px;box-sizing:border-box;border-radius:999px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--pd-line-3);background:var(--pd-surface);color:var(--pd-ink-2);text-decoration:none;white-space:nowrap}
.btn:hover{border-color:var(--pd-blue);color:var(--pd-blue-d);text-decoration:none}
.btn-primary{background:var(--pd-blue);border-color:var(--pd-blue);color:#fff}.btn-primary:hover{background:var(--pd-blue-d);border-color:var(--pd-blue-d);color:#fff}
.btn-dark{background:var(--pd-blue-d);border-color:var(--pd-blue-d);color:#fff}.btn-dark:hover{background:var(--pd-blue-dd);border-color:var(--pd-blue-dd);color:#fff}
.btn-accent{background:var(--pd-yellow);border-color:var(--pd-yellow);color:var(--pd-ink)}.btn-accent:hover{background:#FFE14D;border-color:#FFE14D;color:var(--pd-ink)}
.btn-ok{background:var(--pd-ok);border-color:var(--pd-ok);color:#fff}.btn-ok:hover{filter:brightness(1.08);color:#fff}
.btn-ghost{background:transparent;border-color:transparent;color:var(--pd-blue-d)}.btn-ghost:hover{background:var(--pd-tint);border-color:transparent}
.btn-danger{color:var(--pd-bad)}.btn-danger:hover{border-color:var(--pd-bad);color:var(--pd-bad);background:var(--pd-bad-bg)}
.btn-sm{min-height:36px;padding:6px 14px;font-size:13px}
.btn-block{width:100%}
.btn:disabled,.btn[aria-disabled=true]{opacity:.45;cursor:not-allowed;filter:none}
.btn.is-done{background:var(--pd-ok);border-color:var(--pd-ok);color:#fff}
/* chips & badges */
.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:600;line-height:1.6;white-space:nowrap;background:var(--pd-line-2);color:var(--pd-ink-3)}
.chip-brand{background:var(--pd-tint);color:var(--pd-blue-d)}.chip-ok{background:var(--pd-ok-bg);color:var(--pd-ok)}.chip-warn{background:var(--pd-warn-bg);color:var(--pd-warn)}.chip-bad{background:var(--pd-bad-bg);color:var(--pd-bad)}.chip-info{background:var(--pd-info-bg);color:var(--pd-info)}.chip-dark{background:var(--pd-blue-d);color:#fff}.chip-accent{background:var(--pd-yellow);color:var(--pd-ink)}
.dot{width:8px;height:8px;border-radius:50%;flex:none;display:inline-block;background:currentColor}
/* segmented filters / tabs */
.seg{display:inline-flex;flex-wrap:wrap;gap:4px;padding:4px;border-radius:999px;background:var(--pd-surface);border:1px solid var(--pd-line)}
.seg>button,.seg>a{font-family:inherit;font-size:13.5px;font-weight:600;min-height:36px;padding:0 14px;border-radius:999px;border:0;background:transparent;color:var(--pd-ink-3);cursor:pointer;display:inline-flex;align-items:center;gap:6px;text-decoration:none}
.seg>button:hover{background:var(--pd-tint);color:var(--pd-blue-d)}
.seg>[aria-pressed=true],.seg>[aria-selected=true],.seg>[aria-current=page]{background:var(--pd-blue-d);color:#fff}
.seg .n{font-size:11px;font-weight:700;padding:0 7px;border-radius:999px;background:rgba(20,33,61,.08);line-height:18px}
.seg>[aria-pressed=true] .n,.seg>[aria-selected=true] .n{background:#fff;color:var(--pd-blue-d)}
/* toolbar */
.pd-toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.pd-search{position:relative;flex:1 1 260px;min-width:0}
.pd-search>svg{position:absolute;inset-inline-start:14px;top:50%;transform:translateY(-50%);color:var(--pd-muted);pointer-events:none}
.pd-search>.inp{padding-inline-start:40px;border-radius:999px}
/* forms */
.inp{width:100%;box-sizing:border-box;font-family:inherit;font-size:14.5px;line-height:1.6;padding:9px 14px;border:1px solid var(--pd-line-3);border-radius:12px;background:var(--pd-surface);color:var(--pd-ink);min-height:44px;transition:border-color .15s,box-shadow .15s}
.inp:hover{border-color:#9DBCDB}.inp:focus{border-color:var(--pd-blue);box-shadow:0 0 0 3px rgba(5,111,236,.15);outline:none}
.inp[aria-invalid=true]{border-color:var(--pd-bad);box-shadow:0 0 0 3px rgba(161,74,6,.12)}
textarea.inp{resize:vertical}
.lbl{display:block;font-size:13px;font-weight:600;color:var(--pd-ink-3);margin-bottom:6px}
.lbl .req{color:var(--pd-bad)}
.hint{font-size:12.5px;color:var(--pd-muted);margin-top:4px}
.err{font-size:13px;color:var(--pd-bad);font-weight:600}
.pd-form{display:flex;flex-direction:column;gap:14px}
.pd-form-row{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr))}
.pd-form-actions{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding-top:4px}
/* notes / banners */
.note{display:flex;gap:10px;align-items:flex-start;padding:12px 16px;border-radius:var(--pd-r);font-size:14px;line-height:1.7;border:1px solid var(--pd-line);background:var(--pd-sunk);color:var(--pd-ink-2)}
.note-info{background:var(--pd-tint);border-color:#B1D1E6;color:var(--pd-blue-d)}.note-warn{background:var(--pd-warn-bg);border-color:var(--pd-warn-line);color:#5C3D00}.note-ok{background:var(--pd-ok-bg);border-color:var(--pd-ok-line);color:var(--pd-ok)}.note-bad{background:var(--pd-bad-bg);border-color:var(--pd-bad-line);color:var(--pd-bad)}
/* kpi */
.kpi{display:flex;flex-direction:column;gap:2px;padding:16px 18px;text-align:start;font-family:inherit;color:inherit;text-decoration:none}
.kpi .k-l{font-size:13px;color:var(--pd-muted)}.kpi .k-v{font-family:var(--pd-head);font-size:30px;font-weight:700;line-height:1.2}.kpi .k-s{font-size:12.5px;color:var(--pd-muted)}
a.kpi:hover,button.kpi:hover{text-decoration:none}
/* lists */
.pd-list{display:flex;flex-direction:column}
.pd-row{display:flex;align-items:flex-start;gap:12px;padding:12px 20px;border-top:1px solid var(--pd-line-2);color:inherit;text-decoration:none}
.pd-row:first-child{border-top:0}
a.pd-row:hover,button.pd-row:hover{background:var(--pd-sunk);text-decoration:none}
button.pd-row{font-family:inherit;width:100%;text-align:start;background:transparent;border-left:0;border-right:0;border-bottom:0;cursor:pointer}
/* tables → cards on mobile */
.tbl-wrap{overflow-x:auto;position:relative}
.tbl{width:100%;border-collapse:collapse}
.tbl th{font-size:12.5px;font-weight:700;color:var(--pd-muted);text-align:start;padding:10px 14px;border-bottom:1px solid var(--pd-line);background:var(--pd-sunk);white-space:nowrap}
.tbl td{padding:12px 14px;border-bottom:1px solid var(--pd-line-2);font-size:14px;vertical-align:middle;line-height:1.6}
.tbl tbody tr:hover{background:#FAFCFF}
.tbl tbody tr:last-child td{border-bottom:0}
@media (max-width:640px){.tbl.tbl-stack,.tbl.tbl-stack tbody,.tbl.tbl-stack tr,.tbl.tbl-stack td{display:block;width:100%;box-sizing:border-box}.tbl.tbl-stack{min-width:0!important}.tbl.tbl-stack thead{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}.tbl.tbl-stack tr{padding:12px 16px;border-bottom:1px solid var(--pd-line-2)}.tbl.tbl-stack td{border:0;padding:3px 0;display:flex;gap:10px;align-items:baseline}.tbl.tbl-stack td[data-label]::before{content:attr(data-label);flex:0 0 36%;font-size:12px;font-weight:700;color:var(--pd-muted)}}
/* empty / status */
.empty{display:flex;flex-direction:column;align-items:center;text-align:center;gap:8px;padding:32px 20px;color:var(--pd-muted)}
.empty .e-ic{width:48px;height:48px;border-radius:50%;background:var(--pd-tint);color:var(--pd-blue-d);display:flex;align-items:center;justify-content:center;font-size:20px}
.empty .e-t{font-weight:700;color:var(--pd-ink);font-size:15px}
.pd-lock{padding:40px 24px;text-align:center;display:flex;flex-direction:column;gap:10px;align-items:center}
/* steps */
.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;counter-reset:pdst}
.steps>li{counter-increment:pdst;position:relative;display:flex;gap:14px;align-items:flex-start;padding-bottom:14px}
.steps>li:last-child{padding-bottom:0}
.steps>li::before{content:counter(pdst);flex:none;width:30px;height:30px;border-radius:50%;background:var(--pd-blue);color:#fff;font-family:var(--pd-head);font-weight:700;font-size:14px;line-height:30px;text-align:center;position:relative;z-index:1;box-shadow:0 0 0 4px var(--pd-surface)}
.steps>li::after{content:"";position:absolute;inset-inline-start:14px;top:34px;bottom:4px;width:2px;border-radius:2px;background:#CAE2F0}
.steps>li:last-child::after{display:none}
.steps>li>span{padding-top:1px;min-width:0}
.steps.sm>li::before{width:26px;height:26px;font-size:13px;line-height:26px}
.steps.sm>li::after{inset-inline-start:12px;top:30px}
.steps>li.done::before{content:"\2713";background:var(--pd-ok)}
.steps>li.todo::before{background:#fff;color:var(--pd-muted);box-shadow:inset 0 0 0 2px #9DBCDB,0 0 0 4px #fff}

</div>
<div class="seg" role="group" aria-label="النطاق">
<template data-sc="for" list="{{scopes}}" as="s" hint-placeholder-count="4"><button type="button" aria-pressed="{{s.on}}" onClick="{{s.pick}}">{{s.label}} <span class="n">{{s.n}}</span></button></template>
</div>
</div>
<div class="pd-list">

<span class="t-p">{{t.ar}}</span>
<span class="t-m">{{t.meta}}</span>

</div>

</div>
</div>
</div>
</div>

</div>

</div>
</div>
</form>

</section>

</div></main>

.pd-main{flex:999 1 640px;min-width:0;box-sizing:border-box;padding:24px 28px 72px}
.pd-page{max-width:1240px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
.pd-head{display:flex;flex-wrap:wrap;align-items:flex-end;gap:12px 16px}
.pd-head-t{flex:1 1 320px;min-width:0;display:flex;flex-direction:column;gap:4px}
.pd-crumbs{display:flex;flex-wrap:wrap;align-items:center;gap:6px;font-size:13px;color:var(--pd-muted);margin:0;padding:0;list-style:none}
.pd-crumbs a{color:var(--pd-muted)}.pd-crumbs a:hover{color:var(--pd-blue-d)}
.pd-crumbs li+li::before{content:"‹";margin-inline-end:6px;color:var(--pd-line-3)}
.pd-h1{margin:0;font-family:var(--pd-head);font-size:28px;line-height:1.3;font-weight:700;color:var(--pd-ink)}
.pd-lead{margin:0;font-size:14.5px;line-height:1.7;color:var(--pd-muted);max-width:72ch}
.pd-actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.pd-h2{margin:0;font-family:var(--pd-head);font-size:18px;line-height:1.4;font-weight:700}
.pd-h3{margin:0;font-size:15px;font-weight:700}
.pd-eyebrow{font-size:12px;font-weight:700;letter-spacing:.3px;color:var(--pd-muted)}
.pd-muted{color:var(--pd-muted)}
/* surfaces */
.card{background:var(--pd-surface);border:1px solid var(--pd-line);border-radius:var(--pd-r-lg);box-shadow:var(--pd-shadow)}
.pd-pad{padding:18px 20px}
.pd-sec-h{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;padding:16px 20px;border-bottom:1px solid var(--pd-line-2)}
.pd-sec-h .pd-h2{flex:1;min-width:0}
.pd-grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(min(100%,var(--min,260px)),1fr))}
.pd-split{display:flex;flex-wrap:wrap;gap:20px;align-items:flex-start}
.pd-split>.pd-aside{flex:1 1 340px;min-width:0}
.pd-split>.pd-body{flex:999 1 560px;min-width:0;display:flex;flex-direction:column;gap:16px}
@media (min-width:1100px){.pd-sticky{position:sticky;top:16px}}
/* buttons */
.btn{font-family:inherit;font-size:14px;font-weight:600;line-height:1.2;padding:10px 18px;min-height:44px;box-sizing:border-box;border-radius:999px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--pd-line-3);background:var(--pd-surface);color:var(--pd-ink-2);text-decoration:none;white-space:nowrap}
.btn:hover{border-color:var(--pd-blue);color:var(--pd-blue-d);text-decoration:none}
.btn-primary{background:var(--pd-blue);border-color:var(--pd-blue);color:#fff}.btn-primary:hover{background:var(--pd-blue-d);border-color:var(--pd-blue-d);color:#fff}
.btn-dark{background:var(--pd-blue-d);border-color:var(--pd-blue-d);color:#fff}.btn-dark:hover{background:var(--pd-blue-dd);border-color:var(--pd-blue-dd);color:#fff}
.btn-accent{background:var(--pd-yellow);border-color:var(--pd-yellow);color:var(--pd-ink)}.btn-accent:hover{background:#FFE14D;border-color:#FFE14D;color:var(--pd-ink)}
.btn-ok{background:var(--pd-ok);border-color:var(--pd-ok);color:#fff}.btn-ok:hover{filter:brightness(1.08);color:#fff}
.btn-ghost{background:transparent;border-color:transparent;color:var(--pd-blue-d)}.btn-ghost:hover{background:var(--pd-tint);border-color:transparent}
.btn-danger{color:var(--pd-bad)}.btn-danger:hover{border-color:var(--pd-bad);color:var(--pd-bad);background:var(--pd-bad-bg)}
.btn-sm{min-height:36px;padding:6px 14px;font-size:13px}
.btn-block{width:100%}
.btn:disabled,.btn[aria-disabled=true]{opacity:.45;cursor:not-allowed;filter:none}
.btn.is-done{background:var(--pd-ok);border-color:var(--pd-ok);color:#fff}
/* chips & badges */
.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:600;line-height:1.6;white-space:nowrap;background:var(--pd-line-2);color:var(--pd-ink-3)}
.chip-brand{background:var(--pd-tint);color:var(--pd-blue-d)}.chip-ok{background:var(--pd-ok-bg);color:var(--pd-ok)}.chip-warn{background:var(--pd-warn-bg);color:var(--pd-warn)}.chip-bad{background:var(--pd-bad-bg);color:var(--pd-bad)}.chip-info{background:var(--pd-info-bg);color:var(--pd-info)}.chip-dark{background:var(--pd-blue-d);color:#fff}.chip-accent{background:var(--pd-yellow);color:var(--pd-ink)}
.dot{width:8px;height:8px;border-radius:50%;flex:none;display:inline-block;background:currentColor}
/* segmented filters / tabs */
.seg{display:inline-flex;flex-wrap:wrap;gap:4px;padding:4px;border-radius:999px;background:var(--pd-surface);border:1px solid var(--pd-line)}
.seg>button,.seg>a{font-family:inherit;font-size:13.5px;font-weight:600;min-height:36px;padding:0 14px;border-radius:999px;border:0;background:transparent;color:var(--pd-ink-3);cursor:pointer;display:inline-flex;align-items:center;gap:6px;text-decoration:none}
.seg>button:hover{background:var(--pd-tint);color:var(--pd-blue-d)}
.seg>[aria-pressed=true],.seg>[aria-selected=true],.seg>[aria-current=page]{background:var(--pd-blue-d);color:#fff}
.seg .n{font-size:11px;font-weight:700;padding:0 7px;border-radius:999px;background:rgba(20,33,61,.08);line-height:18px}
.seg>[aria-pressed=true] .n,.seg>[aria-selected=true] .n{background:#fff;color:var(--pd-blue-d)}
/* toolbar */
.pd-toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.pd-search{position:relative;flex:1 1 260px;min-width:0}
.pd-search>svg{position:absolute;inset-inline-start:14px;top:50%;transform:translateY(-50%);color:var(--pd-muted);pointer-events:none}
.pd-search>.inp{padding-inline-start:40px;border-radius:999px}
/* forms */
.inp{width:100%;box-sizing:border-box;font-family:inherit;font-size:14.5px;line-height:1.6;padding:9px 14px;border:1px solid var(--pd-line-3);border-radius:12px;background:var(--pd-surface);color:var(--pd-ink);min-height:44px;transition:border-color .15s,box-shadow .15s}
.inp:hover{border-color:#9DBCDB}.inp:focus{border-color:var(--pd-blue);box-shadow:0 0 0 3px rgba(5,111,236,.15);outline:none}
.inp[aria-invalid=true]{border-color:var(--pd-bad);box-shadow:0 0 0 3px rgba(161,74,6,.12)}
textarea.inp{resize:vertical}
.lbl{display:block;font-size:13px;font-weight:600;color:var(--pd-ink-3);margin-bottom:6px}
.lbl .req{color:var(--pd-bad)}
.hint{font-size:12.5px;color:var(--pd-muted);margin-top:4px}
.err{font-size:13px;color:var(--pd-bad);font-weight:600}
.pd-form{display:flex;flex-direction:column;gap:14px}
.pd-form-row{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr))}
.pd-form-actions{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding-top:4px}
/* notes / banners */
.note{display:flex;gap:10px;align-items:flex-start;padding:12px 16px;border-radius:var(--pd-r);font-size:14px;line-height:1.7;border:1px solid var(--pd-line);background:var(--pd-sunk);color:var(--pd-ink-2)}
.note-info{background:var(--pd-tint);border-color:#B1D1E6;color:var(--pd-blue-d)}.note-warn{background:var(--pd-warn-bg);border-color:var(--pd-warn-line);color:#5C3D00}.note-ok{background:var(--pd-ok-bg);border-color:var(--pd-ok-line);color:var(--pd-ok)}.note-bad{background:var(--pd-bad-bg);border-color:var(--pd-bad-line);color:var(--pd-bad)}
/* kpi */
.kpi{display:flex;flex-direction:column;gap:2px;padding:16px 18px;text-align:start;font-family:inherit;color:inherit;text-decoration:none}
.kpi .k-l{font-size:13px;color:var(--pd-muted)}.kpi .k-v{font-family:var(--pd-head);font-size:30px;font-weight:700;line-height:1.2}.kpi .k-s{font-size:12.5px;color:var(--pd-muted)}
a.kpi:hover,button.kpi:hover{text-decoration:none}
/* lists */
.pd-list{display:flex;flex-direction:column}
.pd-row{display:flex;align-items:flex-start;gap:12px;padding:12px 20px;border-top:1px solid var(--pd-line-2);color:inherit;text-decoration:none}
.pd-row:first-child{border-top:0}
a.pd-row:hover,button.pd-row:hover{background:var(--pd-sunk);text-decoration:none}
button.pd-row{font-family:inherit;width:100%;text-align:start;background:transparent;border-left:0;border-right:0;border-bottom:0;cursor:pointer}
/* tables → cards on mobile */
.tbl-wrap{overflow-x:auto;position:relative}
.tbl{width:100%;border-collapse:collapse}
.tbl th{font-size:12.5px;font-weight:700;color:var(--pd-muted);text-align:start;padding:10px 14px;border-bottom:1px solid var(--pd-line);background:var(--pd-sunk);white-space:nowrap}
.tbl td{padding:12px 14px;border-bottom:1px solid var(--pd-line-2);font-size:14px;vertical-align:middle;line-height:1.6}
.tbl tbody tr:hover{background:#FAFCFF}
.tbl tbody tr:last-child td{border-bottom:0}
@media (max-width:640px){.tbl.tbl-stack,.tbl.tbl-stack tbody,.tbl.tbl-stack tr,.tbl.tbl-stack td{display:block;width:100%;box-sizing:border-box}.tbl.tbl-stack{min-width:0!important}.tbl.tbl-stack thead{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}.tbl.tbl-stack tr{padding:12px 16px;border-bottom:1px solid var(--pd-line-2)}.tbl.tbl-stack td{border:0;padding:3px 0;display:flex;gap:10px;align-items:baseline}.tbl.tbl-stack td[data-label]::before{content:attr(data-label);flex:0 0 36%;font-size:12px;font-weight:700;color:var(--pd-muted)}}
/* empty / status */
.empty{display:flex;flex-direction:column;align-items:center;text-align:center;gap:8px;padding:32px 20px;color:var(--pd-muted)}
.empty .e-ic{width:48px;height:48px;border-radius:50%;background:var(--pd-tint);color:var(--pd-blue-d);display:flex;align-items:center;justify-content:center;font-size:20px}
.empty .e-t{font-weight:700;color:var(--pd-ink);font-size:15px}
.pd-lock{padding:40px 24px;text-align:center;display:flex;flex-direction:column;gap:10px;align-items:center}
/* steps */
.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;counter-reset:pdst}
.steps>li{counter-increment:pdst;position:relative;display:flex;gap:14px;align-items:flex-start;padding-bottom:14px}
.steps>li:last-child{padding-bottom:0}
.steps>li::before{content:counter(pdst);flex:none;width:30px;height:30px;border-radius:50%;background:var(--pd-blue);color:#fff;font-family:var(--pd-head);font-weight:700;font-size:14px;line-height:30px;text-align:center;position:relative;z-index:1;box-shadow:0 0 0 4px var(--pd-surface)}
.steps>li::after{content:"";position:absolute;inset-inline-start:14px;top:34px;bottom:4px;width:2px;border-radius:2px;background:#CAE2F0}
.steps>li:last-child::after{display:none}
.steps>li>span{padding-top:1px;min-width:0}
.steps.sm>li::before{width:26px;height:26px;font-size:13px;line-height:26px}
.steps.sm>li::after{inset-inline-start:12px;top:30px}
.steps>li.done::before{content:"\2713";background:var(--pd-ok)}
.steps>li.todo::before{background:#fff;color:var(--pd-muted);box-shadow:inset 0 0 0 2px #9DBCDB,0 0 0 4px #fff}
.vchk{appearance:none;-webkit-appearance:none;margin:1px 0 0;flex:none;width:26px;height:26px;border-radius:50%;border:2px solid #9DBCDB;background:#fff;display:grid;place-content:center;cursor:pointer;transition:background-color .18s,border-color .18s}
.vchk::after{content:"";width:6px;height:11px;border:solid #fff;border-width:0 2.5px 2.5px 0;transform:translate(0,-1px) rotate(45deg) scale(0);transition:transform .2s cubic-bezier(.3,1.6,.5,1)}
.vchk:checked{background:var(--pd-ok);border-color:var(--pd-ok)}
.vchk:checked::after{transform:translate(0,-1px) rotate(45deg) scale(1)}
.pbar{height:6px;border-radius:999px;background:var(--pd-line-2);overflow:hidden}
.pbar>span{display:block;height:100%;border-radius:999px;background:var(--pd-ok);transition:width .3s ease}
/* motion */
@keyframes pdRise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes pdPop{0%{opacity:0;transform:scale(.6)}70%{transform:scale(1.08)}100%{opacity:1;transform:none}}
@keyframes pdDraw{from{stroke-dashoffset:var(--len,800)}to{stroke-dashoffset:0}}
@media (prefers-reduced-motion:no-preference){
.pd-page>*{animation:pdRise .28s cubic-bezier(.2,.7,.2,1) both}
.pd-page>*:nth-child(2){animation-delay:.03s}.pd-page>*:nth-child(3){animation-delay:.06s}.pd-page>*:nth-child(4){animation-delay:.09s}.pd-page>*:nth-child(5){animation-delay:.12s}.pd-page>*:nth-child(6){animation-delay:.15s}.pd-page>*:nth-child(n+7){animation-delay:.18s}
.pd-in{animation:pdRise .26s cubic-bezier(.2,.7,.2,1) both}
.pd-pop{animation:pdPop .3s cubic-bezier(.2,.7,.2,1) both}
.steps>li{animation:pdRise .26s cubic-bezier(.2,.7,.2,1) both}
.steps>li:nth-child(2){animation-delay:.04s}.steps>li:nth-child(3){animation-delay:.08s}.steps>li:nth-child(4){animation-delay:.12s}.steps>li:nth-child(n+5){animation-delay:.16s}
.btn,.chip,.seg>*,.inp,.card,.pd-row{transition:background-color .16s,color .16s,border-color .16s,box-shadow .16s,transform .12s}
.btn:active,.seg>*:active{transform:scale(.97)}
a.card:hover,button.card:hover,.lift:hover{box-shadow:var(--pd-shadow-lg);border-color:#B1D1E6;transform:translateY(-2px)}
}
@media (max-width:640px){.pd-main{padding:18px 16px 56px}.pd-h1{font-size:23px}.pd-sec-h{padding:14px 16px}.pd-pad{padding:16px}.pd-row{padding:12px 16px}.pd-head .pd-actions{width:100%}.pd-head .pd-actions>.btn{flex:1 1 auto}}

/* ---- brand layer v2 (iSchool Identity Manual: blue surfaces, rocket swoosh, circles & bars) ---- */
.pd-head{position:relative;overflow:hidden;isolation:isolate;align-items:center;padding:26px 30px;border-radius:28px;background:var(--pd-blue);color:#fff;min-height:132px;box-sizing:border-box}
.pd-head::before{content:"";position:absolute;z-index:-1;inset-inline-end:-36px;top:-48px;width:300px;height:170px;background:url("data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%20420%20220%22%3E%3Cpath%20d%3D%22M30%20190%20C%20120%2060%2C%20300%2010%2C%20390%2070%20C%20430%20100%2C%20400%20160%2C%20340%20170%22%20fill%3D%22none%22%20stroke%3D%22%23FFD700%22%20stroke-width%3D%2226%22%20stroke-linecap%3D%22round%22/%3E%3Ccircle%20cx%3D%22336%22%20cy%3D%22170%22%20r%3D%2218%22%20fill%3D%22%23FF7F1C%22/%3E%3C/svg%3E") no-repeat center/contain;opacity:.95;transform:scaleX(-1)}
[dir=ltr] .pd-head::before{transform:none}
.pd-head::after{content:"";position:absolute;z-index:-1;inset-inline-end:28px;bottom:10px;width:160px;height:44px;background:url("data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20width%3D%22120%22%20height%3D%2244%22%20viewBox%3D%220%200%20120%2044%22%3E%3Cg%20fill%3D%22%2305ACFF%22%3E%3Ccircle%20cx%3D%228%22%20cy%3D%2210%22%20r%3D%225%22/%3E%3Crect%20x%3D%2220%22%20y%3D%225%22%20width%3D%2244%22%20height%3D%2210%22%20rx%3D%225%22/%3E%3Ccircle%20cx%3D%2276%22%20cy%3D%2210%22%20r%3D%225%22/%3E%3Crect%20x%3D%2288%22%20y%3D%225%22%20width%3D%2228%22%20height%3D%2210%22%20rx%3D%225%22/%3E%3Crect%20x%3D%224%22%20y%3D%2227%22%20width%3D%2230%22%20height%3D%2210%22%20rx%3D%225%22/%3E%3Ccircle%20cx%3D%2246%22%20cy%3D%2232%22%20r%3D%225%22/%3E%3Crect%20x%3D%2258%22%20y%3D%2227%22%20width%3D%2244%22%20height%3D%2210%22%20rx%3D%225%22/%3E%3Ccircle%20cx%3D%22112%22%20cy%3D%2232%22%20r%3D%225%22/%3E%3C/g%3E%3C/svg%3E") repeat-x;opacity:.3}
.pd-head .pd-head-t{gap:6px}
.pd-head .pd-h1{color:#fff;font-size:30px}
.pd-head .pd-lead{color:#fff;opacity:.95}
.pd-head .pd-crumbs{color:#E1F5FF}
.pd-head .pd-crumbs a,.pd-main .pd-head .pd-crumbs a:not([class]){color:#fff;text-decoration:none;font-weight:600;background:rgba(255,255,255,.16);padding:2px 12px;border-radius:999px}
.pd-head .pd-crumbs li+li::before{color:#fff}
.pd-head .pd-crumbs li:last-child{background:#043FAD;color:#fff;font-weight:700;padding:2px 12px;border-radius:999px}
.pd-head .btn{background:rgba(255,255,255,.14);border-color:rgba(255,255,255,.45);color:#fff}
.pd-head .btn:hover{background:rgba(255,255,255,.24);border-color:#fff;color:#fff}
.pd-head .btn-primary,.pd-head .btn-accent{background:var(--pd-yellow);border-color:var(--pd-yellow);color:var(--pd-ink)}
.pd-head .btn-primary:hover,.pd-head .btn-accent:hover{background:#FFE14D;border-color:#FFE14D;color:var(--pd-ink)}
.pd-head .btn-dark,.pd-head .btn-ok{background:#043FAD;border-color:#043FAD;color:#fff}
.pd-head .chip{background:rgba(255,255,255,.18);color:#fff}
.pd-head .chip-accent{background:var(--pd-yellow);color:var(--pd-ink)}
.pd-head a:focus-visible,.pd-head button:focus-visible{outline-color:var(--pd-yellow)}
.pd-h2{display:flex;align-items:center;gap:10px}
.pd-h2::before{content:"";width:12px;height:12px;border-radius:50%;background:var(--pd-yellow);box-shadow:0 0 0 3px #FFF3B0;flex:none}
.card{border-radius:var(--pd-r-lg)}
.pd-sec-h{border-bottom-color:#E1F0FB}
.kpi .k-v{color:var(--pd-blue-d)}
.seg{border-color:var(--pd-line);box-shadow:var(--pd-shadow)}
.seg>[aria-pressed=true],.seg>[aria-selected=true],.seg>[aria-current=page]{background:var(--pd-blue)}
.chip-brand{background:#DDF1FF;color:var(--pd-blue-d)}
.chip-info{background:#DDF4FF;color:var(--pd-info)}
.steps>li::before{background:var(--pd-blue);box-shadow:0 0 0 4px var(--pd-surface)}
.empty .e-ic{background:var(--pd-yellow);color:var(--pd-ink)}
@media (max-width:640px){.pd-head{padding:20px 18px;border-radius:22px}.pd-head::before{width:190px;height:110px;top:-36px;inset-inline-end:-40px}.pd-head::after{display:none}.pd-head .pd-h1{font-size:24px}}
/* == PD DS END == */
/* Templates — page-specific */
.tpl-list{overflow:hidden;display:flex;flex-direction:column}
.tpl-tools{display:flex;flex-direction:column;gap:10px;padding:14px 16px;border-bottom:1px solid var(--pd-line-2)}
.tpl-tools .pd-search{flex:none}
.tpl-tools .seg{align-self:flex-start;max-width:100%;box-sizing:border-box;border-radius:22px}
.tpl{font-family:inherit;position:relative;width:100%;text-align:start;display:flex;flex-direction:column;gap:4px;padding:12px 18px;min-height:64px;box-sizing:border-box;border:0;border-top:1px solid var(--pd-line-2);background:transparent;color:var(--pd-ink);cursor:pointer}
.tpl:first-child{border-top:0}
.tpl:hover{background:var(--pd-sunk)}
.tpl[aria-current=true]{background:var(--pd-tint)}
.tpl[aria-current=true]::before{content:"";position:absolute;inset-inline-start:0;top:10px;bottom:10px;width:4px;border-radius:4px;background:var(--pd-blue)}
.tpl .t-n{display:flex;align-items:center;gap:8px;width:100%}
.tpl .t-n b{flex:1;min-width:0;font-size:14.5px}
.tpl .t-p{font-size:13px;color:var(--pd-muted);overflow:hidden;white-space:nowrap;text-overflow:ellipsis;width:100%}
.tpl .t-m{font-size:12px;color:var(--pd-muted)}
.phone{width:100%;max-width:330px;margin:0 auto;box-sizing:border-box;padding:9px;border-radius:36px;background:var(--pd-ink);box-shadow:var(--pd-shadow-lg)}
.ph-screen{border-radius:28px;background:#EAF2FA;min-height:300px;display:flex;flex-direction:column;overflow:hidden}
.ph-top{display:flex;align-items:center;gap:10px;padding:16px 16px 12px;background:#fff;border-bottom:1px solid var(--pd-line-2)}
.ph-av{width:34px;height:34px;flex:none;border-radius:50%;background:var(--pd-blue);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px}
.ph-body{flex:1;display:flex;flex-direction:column;align-items:flex-start;gap:6px;padding:16px 14px 20px}
.bubble{max-width:88%;margin:0;padding:11px 14px;border-radius:18px;border-start-start-radius:6px;background:#fff;color:var(--pd-ink);font-size:14.5px;line-height:1.8;white-space:pre-line;overflow-wrap:anywhere;box-shadow:0 1px 2px rgba(20,33,61,.08)}
.bubble:empty::before{content:"…";color:var(--pd-muted)}

</button>

<div class="tr-kv"><span class="k">حوّل إلى</span><span class="v" style="color: var(--tc)">{{c.to}}</span></div>
<div class="tr-kv"><span class="k">اجمع قبل التحويل</span><span class="fl-txt">{{c.before}}</span></div>
<div class="fl-stepsw">

</div>
<div class="tr-notebox">
<div style="display: flex; flex-wrap: wrap; align-items: center; gap: 8px 10px"><b style="flex: 1 1 140px; font-size: 14px">ملاحظة التحويل في التذكرة</b><button type="button" class="btn btn-sm {{c.noteCls}}" onClick="{{c.copyNote}}">{{c.noteLabel}}</button></div>
<p>{{c.note}}</p>
</div>
<button type="button" class="btn btn-block fl-backbtn" onClick="{{c.unflip}}" aria-expanded="{{c.exp}}" aria-controls="fb-{{c.id}}"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 0 1 15.5-6.2L21 8"></path><path d="M21 3v5h-5"></path></svg>رجوع</button>
</section>
</div>
</div>
</template>
</div>
</section>
</template>

<template data-sc="if" value="{{vMapOn}}" hint-placeholder-val="{{ false }}">
<section class="card pd-body" style="gap: 0; overflow: hidden" aria-labelledby="h-map">
<div class="tr-map-h">
<h2 id="h-map" class="pd-h2">خريطة التحويل</h2>
</div>
<template data-sc="if" value="{{hasQ}}" hint-placeholder-val="{{ false }}">
<div class="tr-qbar" aria-live="polite">
<span class="chip {{hitCls}}">{{hitLabel}}</span>
<template data-sc="for" list="{{hitTeams}}" as="h" hint-placeholder-count="2"><span class="chip">{{h.name}} · {{h.n}}</span></template>
<template data-sc="if" value="{{oneHit}}" hint-placeholder-val="{{ false }}"><span class="pd-muted">اضغط Enter لفتحها</span></template>
<button type="button" class="btn btn-ghost btn-sm" onClick="{{clearQ}}" style="margin-inline-start: auto">مسح البحث</button>
</div>
</template>
<template data-sc="if" value="{{noHits}}" hint-placeholder-val="{{ false }}">
<div class="empty pd-in" style="padding: 22px 20px 4px"><span class="e-ic" aria-hidden="true">?</span><span class="e-t">لا توجد حالة مطابقة</span><span>جرّب كلمة من كلام الطالب أو اسم الـ Topic، أو اختر الجهة من الخريطة.</span></div>
</template>
<div class="tr-scroll">
<div class="fc-wrap {{wrapCls}}" style="--minw: {{minW}}px">
<div class="fc-top">
<button type="button" class="fc-node fc-root" onClick="{{pickRoot}}" aria-pressed="{{rootOn}}">
<b style="font-size: 16px">{{root}}</b><small>{{rootSub}}</small>
</button>
<div class="fc-vl"></div>
<button type="button" class="fc-node fc-dec" onClick="{{pickDec}}" aria-pressed="{{decOn}}">
<b style="font-size: 15px; line-height: 1.4">{{dec}}</b><small>{{decSub}}</small>
</button>
<div class="fc-vl"></div>
</div>
<div class="fc-br" style="--n: {{nCols}}">
<template data-sc="for" list="{{branches}}" as="b" hint-placeholder-count="3">
<div class="fc-b {{b.cls}}" style="--tb: {{b.bg}}; --tc: {{b.ink}}">
<button type="button" class="fc-node fc-bn" onClick="{{b.pick}}" aria-pressed="{{b.on}}">
<b>{{b.name}}</b>
<small>{{b.sub}}</small>
<span class="chip">{{b.count}}</span>
</button>

<template data-sc="for" list="{{b.cases}}" as="c" hint-placeholder-count="4">
<button type="button" class="fc-c {{c.cls}}" onClick="{{c.pick}}" aria-pressed="{{c.on}}">
<span style="font-weight: 600">{{c.cond}}</span>
<span class="to">← {{c.to}}</span>
</button>
</template>
<template data-sc="if" value="{{b.canAdd}}" hint-placeholder-val="{{ false }}"><button type="button" class="fc-add" onClick="{{b.addCase}}">+ حالة في {{b.name}}</button></template>

</div>
</template>
</div>
<template data-sc="if" value="{{editing}}" hint-placeholder-val="{{ false }}">
<button type="button" class="fc-add fc-add-b" onClick="{{addBranch}}">+ فرع جديد (جهة تحويل)</button>
</template>
</div>
</div>
</section>
</template>

<template data-sc="if" value="{{showAside}}" hint-placeholder-val="{{ false }}">

<template data-sc="if" value="{{showHint}}" hint-placeholder-val="{{ false }}">
<div class="card tr-guide pd-in">
<span class="n" aria-hidden="true">{{hintN}}</span>
<span style="display: flex; flex-direction: column; gap: 6px; min-width: 0"><b style="font-size: 15px">{{hintT}}</b><span style="font-size: 14px; line-height: 1.7; color: var(--pd-ink-3)">{{hint}}</span><span class="hint" style="margin: 0">أو اكتب كلمات الطالب في «ابحث عن حالة…» فوق الخريطة.</span></span>
</div>
</template>

<template data-sc="if" value="{{showBranch}}" hint-placeholder-val="{{ false }}">
<section class="card pd-in" id="tr-result" style="--tb: {{cb.bg}}; --tc: {{cb.ink}}" aria-labelledby="h-br">
<div class="tr-band"><h2 id="h-br" class="pd-h2">تذاكر {{cb.name}}</h2><small>{{cb.sub}}</small></div>

<template data-sc="if" value="{{showCase}}" hint-placeholder-val="{{ false }}">
<div class="tr-sec">
<span class="pd-eyebrow">الحالة</span>
<h3 class="pd-h3" style="line-height: 1.6">{{cc.cond}}</h3>
<div class="tr-kv"><div class="tr-kv-row"><span><span class="k" style="font-size: 12px; font-weight: 600; color: var(--pd-muted)">غيّر Topic إلى</span><b dir="ltr" style="text-align: right; font-size: 14px; overflow-wrap: anywhere">{{cc.topic}}</b></span><button type="button" class="btn btn-sm {{topicCls}}" onClick="{{copyTopic}}">{{topicLabel}}</button></div></div>
<div class="tr-kv"><span class="k">حوّل إلى</span><span class="v" style="color: var(--tc)">{{cc.to}}</span></div>
<div class="tr-kv"><span class="k">اجمع قبل التحويل</span><span style="font-size: 14px; line-height: 1.7">{{cc.before}}</span></div>
<div class="tr-notebox">
<div style="display: flex; flex-wrap: wrap; align-items: center; gap: 8px 10px"><b style="flex: 1 1 140px; font-size: 14px">ملاحظة التحويل في التذكرة</b><button type="button" class="btn btn-sm {{noteCls}}" onClick="{{copyNote}}">{{noteLabel}}</button></div>
<p>{{cc.note}}</p>
</div>
</div>
</template>

<template data-sc="if" value="{{needCase}}" hint-placeholder-val="{{ false }}">
<div class="tr-sec"><div class="note note-info"><span>{{hint}}</span></div></div>
</template>

<div class="tr-sec">
<h3 class="pd-h3">خطوات الأيجنت</h3>
<ol class="steps sm" style="font-size: 14px; line-height: 1.8"><template data-sc="for" list="{{cb.steps}}" as="s" hint-placeholder-count="4"><li><span>{{s.t}}</span></li></template></ol>
</div>
</section>
</template>

<template data-sc="if" value="{{editing}}" hint-placeholder-val="{{ false }}">
<section class="card tr-ed pd-in" id="tr-editor" aria-labelledby="h-ed">
<div class="pd-sec-h"><h2 id="h-ed" class="pd-h2">{{edTitle}}</h2><template data-sc="if" value="{{edKindOn}}" hint-placeholder-val="{{ false }}"><span class="chip chip-accent">{{edKind}}</span></template></div>
<div class="pd-pad">
<template data-sc="if" value="{{edNone}}" hint-placeholder-val="{{ true }}"><div class="empty" style="padding: 18px 8px"><span class="e-ic" aria-hidden="true">✎</span><span class="e-t">لم تختر عقدة بعد</span><span>اختر عقدة من الخريطة: البداية، أو السؤال، أو جهة، أو حالة.</span></div></template>

<template data-sc="if" value="{{edTop}}" hint-placeholder-val="{{ false }}">
<div class="pd-form">
<div><label class="lbl" for="ed-t">النص</label><input id="ed-t" class="inp" value="{{edTopT}}" onInput="{{onTopT}}"></div>
<div><label class="lbl" for="ed-s">النص الفرعي</label><input id="ed-s" class="inp" value="{{edTopS}}" onInput="{{onTopS}}"></div>
</div>
</template>

<template data-sc="if" value="{{edBranch}}" hint-placeholder-val="{{ false }}">
<div class="pd-form">
<div class="pd-form-row">
<div><label class="lbl" for="ed-bn">اسم الجهة <span class="req">*</span></label><input id="ed-bn" class="inp" value="{{eb.name}}" onInput="{{eb.onName}}" aria-invalid="{{eb.nameBad}}" aria-describedby="ed-bn-e"><template data-sc="if" value="{{eb.nameBadOn}}" hint-placeholder-val="{{ false }}"><div id="ed-bn-e" class="err" role="alert" style="margin-top: 4px">اكتب اسم الجهة قبل النشر.</div></template></div>
<div><label class="lbl" for="ed-bs">وصف مختصر</label><input id="ed-bs" class="inp" value="{{eb.sub}}" onInput="{{eb.onSub}}"></div>
</div>
<div role="group" aria-labelledby="ed-tone-l" style="display: flex; flex-wrap: wrap; align-items: center; gap: 10px">
<span id="ed-tone-l" class="lbl" style="margin: 0">اللون</span>
<template data-sc="for" list="{{eb.tones}}" as="t" hint-placeholder-count="5"><button type="button" class="tone" onClick="{{t.pick}}" aria-pressed="{{t.on}}" aria-label="{{t.aria}}" style="background: {{t.c}}"></button></template>
</div>
<div><label class="lbl" for="ed-bst">خطوات الأيجنت (سطر لكل خطوة)</label><textarea id="ed-bst" class="inp" rows="5" onInput="{{eb.onSteps}}">{{eb.stepsText}}</textarea></div>
<div><label class="lbl" for="ed-bno">قالب ملاحظة التحويل</label><textarea id="ed-bno" class="inp" rows="5" dir="auto" onInput="{{eb.onNote}}">{{eb.note}}</textarea><div class="hint">يُستبدل تلقائياً: {to} المستلم · {cond} الحالة · {topic} الـ Topic · {before} ما يُجمع قبل التحويل</div></div>
<div class="pd-form-actions">
<button type="button" class="btn btn-sm" onClick="{{eb.moveStart}}" disabled="{{eb.firstDis}}">→ نقل لليمين</button>
<button type="button" class="btn btn-sm" onClick="{{eb.moveEnd}}" disabled="{{eb.lastDis}}">نقل لليسار ←</button>
<button type="button" class="btn btn-sm" onClick="{{eb.addCase}}">+ حالة</button>
<span class="tr-danger" style="display: inline-flex; flex-wrap: wrap; gap: 8px">
<template data-sc="if" value="{{eb.confirming}}" hint-placeholder-val="{{ false }}"><button type="button" class="btn btn-sm btn-ghost" onClick="{{eb.cancelDel}}">إلغاء</button></template>
<button type="button" class="btn btn-sm btn-danger" onClick="{{eb.del}}">{{eb.delLabel}}</button>
</span>
</div>
</div>
</template>

<template data-sc="if" value="{{edCase}}" hint-placeholder-val="{{ false }}">
<div class="pd-form">
<div><label class="lbl" for="ed-cc">الحالة (متى تُحوَّل؟) <span class="req">*</span></label><input id="ed-cc" class="inp" value="{{ec.cond}}" onInput="{{ec.onCond}}" aria-invalid="{{ec.condBad}}" aria-describedby="ed-cc-e"><template data-sc="if" value="{{ec.condBadOn}}" hint-placeholder-val="{{ false }}"><div id="ed-cc-e" class="err" role="alert" style="margin-top: 4px">اكتب نص الحالة قبل النشر.</div></template></div>
<div class="pd-form-row">
<div><label class="lbl" for="ed-ct">Topic في نظام التذاكر</label><input id="ed-ct" class="inp" dir="ltr" value="{{ec.topic}}" onInput="{{ec.onTopic}}"></div>
<div><label class="lbl" for="ed-cto">المستلم <span class="req">*</span></label><input id="ed-cto" class="inp" list="recips" value="{{ec.to}}" onInput="{{ec.onTo}}" aria-invalid="{{ec.toBad}}" aria-describedby="ed-cto-e"><datalist id="recips"><template data-sc="for" list="{{recips}}" as="r" hint-placeholder-count="5"><option value="{{r.v}}"></option></template></datalist><template data-sc="if" value="{{ec.toBadOn}}" hint-placeholder-val="{{ false }}"><div id="ed-cto-e" class="err" role="alert" style="margin-top: 4px">حدّد المستلم قبل النشر.</div></template></div>
</div>
<div><label class="lbl" for="ed-cb">ما يُجمع قبل التحويل</label><textarea id="ed-cb" class="inp" rows="2" onInput="{{ec.onBefore}}">{{ec.before}}</textarea></div>
<div class="pd-form-actions">
<button type="button" class="btn btn-sm" onClick="{{ec.up}}" disabled="{{ec.firstDis}}">↑ لأعلى</button>
<button type="button" class="btn btn-sm" onClick="{{ec.down}}" disabled="{{ec.lastDis}}">↓ لأسفل</button>
<span class="tr-danger" style="display: inline-flex; flex-wrap: wrap; gap: 8px">
<template data-sc="if" value="{{ec.confirming}}" hint-placeholder-val="{{ false }}"><button type="button" class="btn btn-sm btn-ghost" onClick="{{ec.cancelDel}}">إلغاء</button></template>
<button type="button" class="btn btn-sm btn-danger" onClick="{{ec.del}}">{{ec.delLabel}}</button>
</span>
</div>
</div>
</template>
</div>
</section>
</template>
</aside>
</template>
</div>

<p class="hint" style="margin: 0">مسودة — المسارات مبنية على توجيه تذاكر سبتمبر، وشروط التحويل النهائية تُعتمد لاحقاً.</p>

</div></main>
</div>
</script>

:root{--pd-sky:#05ACFF;--pd-sun:#FFBB1C;--pd-rust:#C76316;--pd-ice:#B1D1E6;--pd-blue:#056FEC;--pd-blue-d:#043FAD;--pd-blue-dd:#032F82;--pd-yellow:#FFD700;--pd-orange:#FF7F1C;--pd-ink:#14213D;--pd-ink-2:#273248;--pd-ink-3:#3B465C;--pd-muted:#5A6478;--pd-canvas:#ECF8FF;--pd-surface:#FFFFFF;--pd-sunk:#F5FAFE;--pd-line:#CAE2F0;--pd-line-2:#E6F0F9;--pd-line-3:#C9DCEE;--pd-tint:#ECF8FF;--pd-ok:#0F6B3A;--pd-ok-bg:#E9F7EF;--pd-ok-line:#9CCFB2;--pd-warn:#7A5200;--pd-warn-bg:#FFF7D1;--pd-warn-line:#FFE16B;--pd-bad:#A14A06;--pd-bad-bg:#FFEEDF;--pd-bad-line:#FFC9A0;--pd-info:#03679A;--pd-info-bg:#E1F5FF;--pd-r-sm:10px;--pd-r:14px;--pd-r-lg:22px;--pd-shadow:0 1px 2px rgba(4,63,173,.05),0 1px 1px rgba(20,33,61,.03);--pd-shadow-lg:0 12px 32px -16px rgba(4,63,173,.35);--pd-head:'Somar Rounded','Baloo Bhaijaan 2',sans-serif;--pd-body:'Somar Rounded','IBM Plex Sans Arabic',sans-serif}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--pd-canvas)}
