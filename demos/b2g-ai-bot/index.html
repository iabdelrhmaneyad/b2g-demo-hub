<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>iSchool B2G AI Bot · Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alexandria:wght@400;500;600;700;800&display=swap">
<style>
body{margin:0;background:#f5f8fc}
a{color:#0461d6}a:hover{color:#0346b0}
button{font:inherit;cursor:pointer}
input,textarea,select{font:inherit}
.dot{width:7px;height:7px;border-radius:50%;background:#8fa6b3;animation:csb-blink 1s infinite}
.dot.b{animation-delay:.15s}.dot.c{animation-delay:.3s}
@keyframes csb-blink{0%,100%{opacity:.25}50%{opacity:1}}
.chip:hover{background:#e3f1fb}
.tk:hover{background:#f5f8fc}
.opt:hover{background:#e3f1fb}
.node:hover{border-color:#0ab4fb}
.row:hover{background:#f5f8fc}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
summary{cursor:pointer}
@media (prefers-reduced-motion:reduce){.dot{animation:none}}
</style>
</head>
<body>
<div id="app"></div>
<template id="tpl">

<div dir="rtl" style="font-family: 'Alexandria', 'Rubik', system-ui, sans-serif; color: #1f2a56; background: #f5f8fc; min-height: 960px; box-sizing: border-box; padding: 12px 20px 32px; display: flex; flex-direction: column; gap: 16px">

  <!-- ===================== DEMO BAR ===================== -->
  <section aria-label="أدوات العرض التجريبي" style="background: #1f2a56; color: #ffffff; border-radius: 16px; padding: 12px 16px; display: flex; flex-direction: column; gap: 12px">
    <div style="display: flex; align-items: center; gap: 12px; flex-wrap: wrap">
      <span style="font-size: 12px; font-weight: 700; letter-spacing: .6px; color: #ffb81a">عرض تجريبي · B2G AI Bot</span>
      <div role="group" aria-label="طريقة العرض" style="display: flex; background: rgba(255,255,255,.1); border-radius: 999px; padding: 3px">
        <button onClick="{{goStudent}}" aria-pressed="{{isStudentStr}}" style="border: 0; border-radius: 999px; padding: 7px 16px; font-size: 13px; font-weight: 600; background: {{stuTabBg}}; color: {{stuTabFg}}">① واجهة الطالب</button>
        <button onClick="{{goAdmin}}" aria-pressed="{{isAdminStr}}" style="border: 0; border-radius: 999px; padding: 7px 16px; font-size: 13px; font-weight: 600; background: {{admTabBg}}; color: {{admTabFg}}">② لوحة الأدمن</button>
      </div>
      <template data-if="isStudent">
        <label for="pick-student" style="font-size: 13px; color: #c9d6f2">الطالب:</label>
        <select id="pick-student" value="{{sid}}" onChange="{{onPickStudent}}" style="border: 0; border-radius: 8px; padding: 7px 10px; font-size: 13px; background: #ffffff; color: #1f2a56; max-width: 380px">
          <template data-for="studentOptions" data-as="o">
            <option value="{{o.id}}">{{o.label}}</option>
          </template>
        </select>
        <button onClick="{{newRequest}}" style="border: 0; border-radius: 999px; padding: 7px 14px; font-size: 13px; font-weight: 600; background: #ffb81a; color: #1f2a56">+ إضافة طلب دعم</button>
      </template>
      <span style="flex: 1"></span>
      <span style="font-size: 12.5px; color: #c9d6f2">{{demoProgress}}</span>
      <button onClick="{{toggleSteps}}" aria-expanded="{{stepsOpenStr}}" style="border: 1px solid rgba(255,255,255,.35); border-radius: 999px; padding: 6px 12px; font-size: 12.5px; background: transparent; color: #ffffff">{{stepsToggleLabel}}</button>
      <button onClick="{{resetDemo}}" style="border: 1px solid rgba(255,255,255,.35); border-radius: 999px; padding: 6px 12px; font-size: 12.5px; background: transparent; color: #ffffff">إعادة ضبط العرض</button>
    </div>
    <template data-if="stepsOpen">
      <ol style="list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 8px">
        <template data-for="demoSteps" data-as="d">
          <li style="background: {{d.bg}}; border: 1px solid {{d.border}}; border-radius: 12px; padding: 10px 12px; display: flex; flex-direction: column; gap: 6px; min-width: 0">
            <div style="display: flex; align-items: center; gap: 8px">
              <span style="width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; font-size: 12px; font-weight: 700; background: {{d.dotBg}}; color: {{d.dotFg}}; flex: none">{{d.mark}}</span>
              <span style="font-size: 11px; color: #c9d6f2">{{d.where}}</span>
            </div>
            <div style="font-size: 13px; font-weight: 600; line-height: 1.5">{{d.title}}</div>
            <div style="font-size: 11.5px; color: #c9d6f2; line-height: 1.5">{{d.hint}}</div>
            <button onClick="{{d.go}}" style="align-self: flex-start; margin-top: auto; border: 0; border-radius: 999px; padding: 4px 12px; font-size: 12px; font-weight: 600; background: #ffffff; color: #1f2a56">{{d.goLabel}}</button>
          </li>
        </template>
      </ol>
    </template>
  </section>

  <template data-if="isStudent">
  <header style="background: #ffffff; border-radius: 999px; box-shadow: 0 1px 2px rgba(31,42,86,.04), 0 4px 14px rgba(31,42,86,.05); padding: 10px 24px; display: flex; align-items: center; gap: 16px; flex-wrap: wrap">
    <div style="font-weight: 800; font-size: 26px; color: #046ded; letter-spacing: -0.5px; direction: ltr">iSchool<span style="color: #ffb81a">.</span></div>
    <span style="font-size: 13px; color: #5b7280; padding-inline-start: 14px; border-inline-start: 1px solid #e6ecf2">{{headerSub}}</span>
    <span style="flex: 1"></span>
    <div style="display: flex; align-items: center; gap: 10px">
      <div>
        <div style="font-weight: 600; font-size: 15px">{{me.name}}</div>
        <div style="font-size: 12px; color: #5b7280; direction: ltr; text-align: end">{{me.sub}}</div>
      </div>
      <div aria-hidden="true" style="width: 44px; height: 44px; border-radius: 50%; background: #e3f1fb; color: #046ded; display: grid; place-items: center; font-weight: 800">{{me.initial}}</div>
    </div>
  </header>
  </template>

  <!-- ===================== STUDENT ===================== -->
  <template data-if="isStudent">
    <div style="display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; padding: 0 8px">
      <div>
        <h1 style="margin: 0; font-size: 30px; font-weight: 800">مركز المساعدة</h1>
        <div style="display: flex; gap: 10px; margin-top: 12px">
          <span style="background: #046ded; color: #ffffff; border-radius: 999px; padding: 6px 16px; font-size: 15px; font-weight: 600">طلبات الدعم</span>
          <span style="color: #5b7280; padding: 6px 4px; font-size: 15px">الأسئلة الشائعة</span>
        </div>
      </div>
      <button onClick="{{newRequest}}" style="background: #046ded; color: #ffffff; border: 0; border-radius: 999px; padding: 14px 28px; font-size: 17px; font-weight: 600; min-height: 52px">+ إضافة طلب دعم</button>
    </div>

    <div style="display: flex; flex-wrap: wrap; gap: 20px; align-items: stretch">
      <nav aria-label="طلباتي" style="flex: 1 1 280px; max-width: 340px; background: #ffffff; border: 1px solid #e6ecf2; border-radius: 16px; padding: 10px; display: flex; flex-direction: column; gap: 6px; box-sizing: border-box; align-self: flex-start">
        <template data-for="items" data-as="t">
          <button class="tk" onClick="{{t.open}}" aria-current="{{t.current}}" style="text-align: start; border: 1.5px solid {{t.border}}; background: {{t.bg}}; border-radius: 12px; padding: 14px 16px; color: #1f2a56">
            <div style="display: flex; justify-content: space-between; gap: 8px; align-items: baseline">
              <span style="font-weight: 600; font-size: 15px">{{t.title}}</span>
              <span style="font-size: 12px; color: #5b7280; direction: ltr">{{t.ref}}</span>
            </div>
            <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 10px; gap: 8px">
              <span style="font-size: 12.5px; color: #5b7280">{{t.date}}</span>
              <span style="border-radius: 999px; padding: 3px 12px; font-size: 12.5px; font-weight: 600; background: {{t.sBg}}; color: {{t.sFg}}">{{t.sLabel}}</span>
            </div>
          </button>
        </template>
        <template data-if="noItems">
          <div style="padding: 16px; font-size: 13px; color: #5b7280; text-align: center">لا توجد طلبات بعد.</div>
        </template>
      </nav>

      <!-- main panel -->
      <section aria-label="المحتوى" style="flex: 999 1 560px; min-width: 0; background: #ffffff; border: 1px solid #e6ecf2; border-radius: 16px; display: flex; flex-direction: column; min-height: 760px; overflow: hidden">

        <!-- bot conversation -->
        <template data-if="isConvo">
          <div style="padding: 16px 22px; border-bottom: 1px solid #e6ecf2; display: flex; align-items: center; gap: 12px; flex-wrap: wrap">
            <span aria-hidden="true" style="width: 34px; height: 34px; border-radius: 50%; background: #046ded; color: #ffffff; display: grid; place-items: center; font-size: 15px; font-weight: 800">i</span>
            <div>
              <h2 style="margin: 0; font-size: 17px; font-weight: 700">{{cv.title}} <span style="direction: ltr; unicode-bidi: isolate">{{cv.ref}}</span></h2>
              <div style="font-size: 12px; color: #5b7280">{{cv.handlerLine}}</div>
            </div>
            <span style="flex: 1"></span>
            <span style="border-radius: 999px; padding: 4px 14px; font-size: 12.5px; font-weight: 600; background: {{cv.sBg}}; color: {{cv.sFg}}">{{cv.sLabel}}</span>
          </div>
          <div ref="{{threadRef}}" style="flex: 1; min-height: 0; max-height: 640px; overflow-y: auto; padding: 20px 22px; display: flex; flex-direction: column; gap: 14px">
            <template data-for="cv.msgs" data-as="m">
              <template data-if="m.isBot">
                <div style="align-self: flex-end; max-width: 86%; background: #ffffff; border: 1px solid #e6ecf2; border-radius: 16px; border-start-end-radius: 5px; padding: 14px 18px; box-shadow: 0 1px 2px rgba(31,42,86,.04)">
                  <div style="display: flex; align-items: center; gap: 8px; margin-bottom: 6px">
                    <span style="font-size: 12.5px; font-weight: 700">مساعد iSchool</span>
                    <span style="font-size: 11px; font-weight: 600; color: #0461d6; background: #e3f1fb; border-radius: 6px; padding: 1px 7px">رد آلي</span>
                    <span style="flex: 1"></span>
                    <span style="font-size: 11.5px; color: #5b7280">{{m.time}}</span>
                  </div>
                  <template data-if="m.hasTitle">
                    <div style="font-weight: 700; font-size: 15px; color: #0346b0; margin-bottom: 6px; line-height: 1.6">{{m.title}}</div>
                  </template>
                  <div style="font-size: 15px; line-height: 1.85; white-space: pre-line">{{m.text}}</div>
                </div>
              </template>
              <template data-if="m.isMe">
                <div style="align-self: flex-start; max-width: 75%; display: flex; flex-direction: column; align-items: flex-start; gap: 4px">
                  <div style="background: #046ded; color: #ffffff; border-radius: 16px; border-start-start-radius: 5px; padding: 10px 16px; font-size: 15px; line-height: 1.7; white-space: pre-line">{{m.text}}</div>
                  <span style="font-size: 11.5px; color: #5b7280">أنت · {{m.time}}</span>
                </div>
              </template>
              <template data-if="m.isSys">
                <div style="align-self: center; max-width: 90%; text-align: center; font-size: 13px; font-weight: 600; border-radius: 999px; padding: 6px 16px; background: {{m.bg}}; color: {{m.fg}}">{{m.text}}</div>
              </template>
            </template>
            <template data-if="cv.typing">
              <div aria-label="المساعد يكتب" style="align-self: flex-end; background: #ffffff; border: 1px solid #e6ecf2; border-radius: 16px; padding: 12px 16px; display: flex; gap: 5px"><i class="dot"></i><i class="dot b"></i><i class="dot c"></i></div>
            </template>

            <!-- controls, inside the chat -->
            <template data-if="cv.showControls">
              <div style="align-self: flex-end; width: min(560px, 92%); background: #f3f8ff; border: 1px solid #cfe0f5; border-radius: 16px; padding: 14px 16px; display: flex; flex-direction: column; gap: 10px">
                <template data-if="cv.isMenu">
                  <div style="font-size: 14px; font-weight: 700">{{cv.menuPrompt}}</div>
                  <template data-for="cv.questions" data-as="q">
                    <template data-if="q.isHeader"><div style="font-size: 12px; color: #5b7280; font-weight: 600; margin-top: 4px">{{q.label}}</div></template>
                    <template data-if="q.isItem">
                      <button class="opt" onClick="{{q.pick}}" style="text-align: start; border: 1.5px solid #bcd8fb; background: #ffffff; color: #0346b0; border-radius: 12px; padding: 10px 14px; font-size: 14px; font-weight: 600; line-height: 1.6; min-height: 44px">{{q.label}}</button>
                    </template>
                  </template>
                </template>
                <template data-if="cv.isConfirm">
                  <div style="font-size: 14.5px; font-weight: 700">{{cv.confirmQ}}</div>
                  <div style="display: flex; flex-wrap: wrap; gap: 8px">
                    <button class="chip" onClick="{{cv.yes}}" style="border: 1.5px solid #046ded; color: #0461d6; background: #ffffff; border-radius: 999px; padding: 9px 16px; font-size: 14px; font-weight: 600; min-height: 44px">{{cv.yesLabel}}</button>
                    <button class="chip" onClick="{{cv.no}}" style="border: 1.5px solid #d5e0ec; color: #5b7280; background: #ffffff; border-radius: 999px; padding: 9px 16px; font-size: 14px; font-weight: 600; min-height: 44px">{{cv.noLabel}}</button>
                  </div>
                  <template data-if="cv.hasOthers">
                    <details style="font-size: 13px; color: #5b7280">
                      <summary>أو اختر استفسارًا آخر</summary>
                      <div style="display: flex; flex-direction: column; gap: 6px; margin-top: 8px">
                        <template data-for="cv.others" data-as="q">
                          <button class="opt" onClick="{{q.pick}}" style="text-align: start; border: 1px solid #d5e0ec; background: #ffffff; color: #1f2a56; border-radius: 10px; padding: 8px 12px; font-size: 13.5px; line-height: 1.6">{{q.label}}</button>
                        </template>
                      </div>
                    </details>
                  </template>
                </template>
                <template data-if="cv.isOffer">
                  <div style="display: flex; flex-wrap: wrap; gap: 8px">
                    <button class="chip" onClick="{{cv.offerYes}}" style="border: 1.5px solid #b3261e; color: #b3261e; background: #ffffff; border-radius: 999px; padding: 9px 16px; font-size: 14px; font-weight: 600; min-height: 44px">{{cv.offerYesLabel}}</button>
                    <button class="chip" onClick="{{cv.offerNo}}" style="border: 1.5px solid #d5e0ec; color: #5b7280; background: #ffffff; border-radius: 999px; padding: 9px 16px; font-size: 14px; font-weight: 600; min-height: 44px">{{cv.offerNoLabel}}</button>
                  </div>
                </template>
                <template data-if="cv.isBox">
                  <label for="cs-box" style="font-size: 14px; font-weight: 700">تفاصيل استفسارك</label>
                  <textarea id="cs-box" value="{{boxDraft}}" onChange="{{onBox}}" rows="4" placeholder="اكتب استفسارك هنا…" style="border: 1px solid #bcd8fb; border-radius: 12px; padding: 12px 14px; font-size: 15px; color: #1f2a56; background: #ffffff; resize: vertical; outline-color: #046ded"></textarea>
                  <label style="display: flex; align-items: center; gap: 10px; border: 1px dashed #bcd8fb; background: #ffffff; border-radius: 12px; padding: 10px 14px; font-size: 13.5px; color: #0461d6; cursor: pointer">
                    <span aria-hidden="true" style="font-size: 18px">📎</span>
                    <span>إرفاق صور توضّح المشكلة (اختياري) · الحد الأقصى 5 صور</span>
                    <input class="sr" type="file" accept="image/*" multiple="{{ true }}" onChange="{{onBoxFiles}}">
                  </label>
                  <template data-if="hasBoxFiles">
                    <div style="display: flex; flex-wrap: wrap; gap: 6px">
                      <template data-for="boxFiles" data-as="bf">
                        <span style="display: inline-flex; align-items: center; gap: 6px; background: #ffffff; border: 1px solid #d5e0ec; border-radius: 999px; padding: 4px 6px 4px 10px; font-size: 12.5px; color: #1f2a56">🖼 {{bf.name}}<button onClick="{{bf.remove}}" aria-label="حذف {{bf.name}}" style="border: 0; background: #f5f8fc; color: #5b7280; border-radius: 50%; width: 22px; height: 22px; font-size: 11px; padding: 0">✕</button></span>
                      </template>
                    </div>
                  </template>
                  <template data-if="boxFileErr">
                    <div role="alert" style="font-size: 13px; color: #b3261e">الحد الأقصى 5 صور، تم إرفاق أول 5 فقط.</div>
                  </template>
                  <template data-if="boxErr">
                    <div role="alert" style="font-size: 13px; color: #b3261e">برجاء كتابة تفاصيل الاستفسار قبل الإرسال.</div>
                  </template>
                  <div style="display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap">
                    <span style="font-size: 12px; color: #5b7280">سيتم إنشاء طلب «الإبلاغ عن مشكلة» بعد الإرسال فقط.</span>
                    <button onClick="{{cv.submitBox}}" style="border: 0; background: #046ded; color: #ffffff; border-radius: 999px; padding: 10px 22px; font-size: 15px; font-weight: 600; min-height: 44px">إرسال الاستفسار</button>
                  </div>
                </template>
                <template data-if="cv.isDone">
                  <div style="display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap">
                    <span style="font-size: 13.5px; color: #5b7280">{{cv.doneText}}</span>
                  </div>
                </template>
              </div>
            </template>
          </div>
          <template data-if="cv.isFollow">
            <div role="status" style="margin: 0 16px 16px; border: 1px solid #f6dca5; background: #fffbf1; border-radius: 14px; padding: 14px 18px; display: flex; gap: 12px; align-items: center">
              <span aria-hidden="true" style="width: 36px; height: 36px; border-radius: 50%; background: #fff4dc; color: #8a5300; display: grid; place-items: center; font-size: 18px; flex: none">⏳</span>
              <div>
                <div style="font-size: 15px; font-weight: 700; color: #8a5300">طلبك مع فريق خدمة العملاء · Pending</div>
                <div style="font-size: 13px; color: #6b5a3a; margin-top: 2px">سيتم الرد عليك هنا في نفس الطلب في أقرب وقت، ولا تحتاج لإرسال رسائل أخرى.</div>
              </div>
            </div>
          </template>
        </template>

        <!-- ticket -->
        <template data-if="isTicket">
          <div style="padding: 16px 22px; border-bottom: 1px solid #e6ecf2; display: flex; align-items: center; gap: 12px; flex-wrap: wrap">
            <h2 style="margin: 0; font-size: 18px; font-weight: 700">الإبلاغ عن مشكلة / استفسار <span style="direction: ltr; unicode-bidi: isolate">#{{tk.id}}</span></h2>
            <span style="flex: 1"></span>
            <span style="border-radius: 999px; padding: 4px 14px; font-size: 12.5px; font-weight: 600; background: {{tk.sBg}}; color: {{tk.sFg}}">{{tk.status}}</span>
          </div>
          <div style="flex: 1; padding: 20px 22px; display: flex; flex-direction: column; gap: 14px; overflow-y: auto; max-height: 520px">
            <div style="align-self: flex-start; max-width: 85%; background: #f3f7fc; border: 1px solid #e6ecf2; border-radius: 14px; padding: 14px 18px">
              <div style="font-size: 12.5px; color: #5b7280; margin-bottom: 6px">تفاصيل الطلب</div>
              <div style="font-size: 15px; line-height: 1.8">Sub Topic: {{tk.sub}}</div>
              <div style="font-size: 15px; line-height: 1.8; white-space: pre-line">Details: {{tk.details}}</div>
            </div>
            <template data-for="tk.msgs" data-as="m">
              <template data-if="m.isMe">
                <div style="align-self: flex-start; max-width: 75%; background: #046ded; color: #ffffff; border-radius: 16px; padding: 10px 16px; font-size: 15px; line-height: 1.7; white-space: pre-line">{{m.text}}</div>
              </template>
              <template data-if="m.isAgent">
                <div style="align-self: flex-end; max-width: 82%; background: #ffffff; border: 1px solid #e6ecf2; border-radius: 14px; padding: 12px 16px">
                  <div style="font-size: 12.5px; color: #5b7280; margin-bottom: 4px">فريق الدعم</div>
                  <div style="font-size: 15px; line-height: 1.8; white-space: pre-line">{{m.text}}</div>
                </div>
              </template>
            </template>
            <template data-if="tk.hasHistory">
              <details style="border: 1px dashed #bcd8fb; border-radius: 12px; padding: 10px 14px; font-size: 13.5px">
                <summary style="font-weight: 600; color: #0346b0">سجل المحادثة مع مساعد iSchool ({{tk.historyCount}} رسالة) · مرفق للفريق</summary>
                <div style="display: flex; flex-direction: column; gap: 6px; margin-top: 10px">
                  <template data-for="tk.history" data-as="h">
                    <div style="display: grid; grid-template-columns: 72px minmax(0, 1fr); gap: 8px; line-height: 1.6">
                      <span style="color: #5b7280">{{h.who}}</span>
                      <span style="white-space: pre-line">{{h.text}}</span>
                    </div>
                  </template>
                </div>
              </details>
            </template>
          </div>
          <div style="margin: 0 16px 16px; border: 1px solid #d5e0ec; border-radius: 14px; padding: 14px 18px">
            <label for="tk-reply" style="display: block; font-size: 15px; font-weight: 600">ردك</label>
            <div style="font-size: 12.5px; color: #5b7280; margin: 2px 0 8px">أرسل رسالة متابعة إلى فريق الدعم.</div>
            <textarea id="tk-reply" value="{{tkDraft}}" onChange="{{onTkDraft}}" placeholder="اكتب ردك هنا" rows="2" style="width: 100%; box-sizing: border-box; border: 0; resize: vertical; font-size: 15px; color: #1f2a56; background: transparent; outline: none"></textarea>
            <div style="display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-top: 6px">
              <span style="font-size: 13px; color: #5b7280">📎 الحد الأقصى 5 صور</span>

<script>
/* Minimal runtime for the prototype: renders the x-dc template with {{holes}}, loops (data-for) and conditions (data-if),
   wires events, and patches the page in place so typing keeps focus. */
(function () {
  var SVG_NS = 'http://www.w3.org/2000/svg';
  var BOOL = { checked: 1, disabled: 1, readonly: 1, multiple: 1, selected: 1, hidden: 1 };

  function lookup(scope, path) {
    path = String(path).trim();
    if (path === 'true') return true;
    if (path === 'false') return false;
    if (path === 'null') return null;
    if (/^-?\d+(\.\d+)?$/.test(path)) return +path;
    var parts = path.split('.'), v = scope;
    for (var i = 0; i < parts.length; i++) { if (v == null) return undefined; v = v[parts[i]]; }
    return v;
  }
  var WHOLE = /^\s*\{\{\s*([^}]+?)\s*\}\}\s*$/;
  var HOLE = /\{\{\s*([^}]+?)\s*\}\}/g;
  function interp(str, scope) { return str.replace(HOLE, function (m, p) { var v = lookup(scope, p); return v == null ? '' : String(v); }); }

  function evtName(attr, el) {
    var n = attr.slice(2);
    if (n === 'change') {
      var tag = el.tagName.toLowerCase(), type = (el.getAttribute('type') || 'text').toLowerCase();
      if (tag === 'textarea' || (tag === 'input' && ['checkbox', 'radio', 'file'].indexOf(type) < 0)) return 'input';
      return 'change';
    }
    if (n === 'focus') return 'focusin';
    return n;
  }

  function renderInto(src, scope, out) {
    for (var c = src.firstChild; c; c = c.nextSibling) {
      if (c.nodeType === 3) { out.appendChild(document.createTextNode(interp(c.nodeValue, scope))); continue; }
      if (c.nodeType !== 1) continue;
      var tag = c.tagName.toLowerCase();
      if (tag === 'template' && c.hasAttribute('data-for')) {
        var list = lookup(scope, c.getAttribute('data-for')) || [], as = c.getAttribute('data-as');
        for (var i = 0; i < list.length; i++) {
          var sc = Object.create(scope); sc[as] = list[i]; sc.$index = i;
          renderInto(c.content, sc, out);
        }
        continue;
      }
      if (tag === 'template' && c.hasAttribute('data-if')) {
        if (lookup(scope, c.getAttribute('data-if'))) renderInto(c.content, scope, out);
        continue;
      }
      var el = c.namespaceURI === SVG_NS ? document.createElementNS(SVG_NS, c.tagName) : document.createElement(tag);
      var attrs = c.attributes;
      for (var a = 0; a < attrs.length; a++) {
        var name = attrs[a].name, raw = attrs[a].value, m = WHOLE.exec(raw);
        if (name.indexOf('hint-') === 0) continue;
        var val = m ? lookup(scope, m[1]) : interp(raw, scope);
        if (name.indexOf('on') === 0 && name.length > 2) { (el.__h || (el.__h = {}))[evtName(name, c)] = val; continue; }
        if (name === 'ref') { el.__ref = val; continue; }
        if (name === 'value' && (tag === 'input' || tag === 'textarea' || tag === 'select')) { el.__val = val == null ? '' : String(val); continue; }
        if (BOOL[name]) { if (val === true || val === 'true' || val === '') el.setAttribute(name, ''); continue; }
        if (val == null || val === false) continue;
        el.setAttribute(name, String(val));
      }
      renderInto(tag === 'template' ? c.content : c, scope, el);
      out.appendChild(el);
    }
  }

      me: { name: st.first + ' ' + st.last, sub: st.id, initial: st.first[0] },
      /* student */
      sid: s.sid, studentOptions: s.students.map((x) => ({ id: x.id, label: x.first + ' ' + x.last + ' · ' + ORGS[x.org].label + ' · ' + (x.flag ? 'Flag ' + x.flag : 'No flag') + (s.orgCfg[x.org].on ? '' : ' · المساعد معطّل') })),
      onPickStudent: (e) => this.setState({ sid: e.target.value, active: null }),
      newRequest: () => this.newRequest(), items: items, noItems: items.length === 0,
      isConvo: !!c, isTicket: !!t, isForm: isForm, isEmpty: !c && !t && !isForm,
      cv: cv, tk: tk, threadRef: this.threadRef,
      boxDraft: s.boxDraft, boxErr: s.boxErr, onBox: (e) => this.setState({ boxDraft: e.target.value, boxErr: false }),
      boxFiles: s.boxFiles.map((n, i) => ({ name: n, remove: () => this.setState((p) => ({ boxFiles: p.boxFiles.filter((x, j) => j !== i), boxFileErr: false })) })),
      hasBoxFiles: s.boxFiles.length > 0, boxFileErr: s.boxFileErr,
      onBoxFiles: (e) => { var list = Array.prototype.slice.call((e.target.files || [])).map((x) => x.name); e.target.value = ''; this.setState((p) => { var all = p.boxFiles.concat(list); return { boxFiles: all.slice(0, 5), boxFileErr: all.length > 5 }; }); },
      tkDraft: s.tkDraft, onTkDraft: (e) => this.setState({ tkDraft: e.target.value }), tkSendOpacity: s.tkDraft.trim() ? 1 : 0.45,
      sendTk: () => { var v = s.tkDraft.trim(); if (!v || !t) return; this.setState((p) => ({ tickets: p.tickets.map((y) => y.id === t.id ? Object.assign({}, y, { msgs: y.msgs.concat([{ who: 'me', text: v }]) }) : y), tkDraft: '' })); },
      hasInfo: infoRows.length > 0, infoRows: infoRows, sysRows: sysRows, form: form,
      toggleType: () => setForm({ openType: !f.openType, openSub: false }), typeOptions: STUDENT_TOPICS.map((t) => ({ label: t.ar, pick: () => this.pickTopic(t) })),
      toggleSub: () => setForm({ openSub: !f.openSub, openType: false }), subOptions: SUBS.map((x) => ({ label: x, pick: () => setForm({ sub: x, openSub: false }) })),
      onDetails: (e) => setForm({ details: e.target.value, err: false }), onFile: (e) => { var fl = e.target.files && e.target.files[0]; setForm({ file: fl ? fl.name : '' }); },
      submitForm: () => this.submitForm(),
      /* admin chrome */
      adminOrg: ao, orgOptions: ORG_ORDER.map((k) => ({ v: k, l: ORGS[k].label })), onAdminOrg: (e) => this.setState({ adminOrg: e.target.value, savedNote: '', recSel: null }),
      sideNav: sideNav, admTabs: admTabs, orgLabel: aorg.label,
      tabTopics: ['student', 'teacher', 'admin'].indexOf(s.admTab) >= 0, tabFlow: s.admTab === 'flow', tabSettings: s.admTab === 'settings', tabFlags: s.admTab === 'flags', tabRecords: s.admTab === 'records',
      topicsAudience: studentAudience, topicRows: TOPICS.map((x, i) => ({ l: x, tag: i === 0 ? 'Bot tickets open here' : '' })),
      /* flow */
      draftTitle: s.dirty ? 'Draft · unpublished changes to version ' + s.version : 'Version ' + s.version + ' · published',
      lastSaved: 'Last saved 19/11/2026 12:05 PM',
      saveNote: s.dirty ? 'All changes saved to the draft.' : 'No unpublished changes.',
      undo: () => { var u = s.undoStack; if (!u.length) return; var last = JSON.parse(u[u.length - 1]); this.setState({ msgs: last.msgs, flags: last.flags, general: last.general || s.general, undoStack: u.slice(0, -1), dirty: true }); },
      undoDisabled: s.undoStack.length === 0, undoOpacity: s.undoStack.length ? 1 : 0.45,
      snap: () => this.snap(),
      preview: () => { var pick = pvStudent; if (!pick) return; this.setState({ view: 'student', sid: pick.id, active: null, usedPreview: s.dirty || s.usedPreview }, () => this.startBot()); },
      moreOpen: s.moreOpen, moreOpenStr: s.moreOpen ? 'true' : 'false', toggleMore: () => this.setState({ moreOpen: !s.moreOpen }),
      resetFlow: () => { this.snap(); this.setState({ msgs: clone(DEFAULT_MSGS), flags: clone(DEFAULT_FLAGS), general: clone(DEFAULT_GENERAL), dirty: true, moreOpen: false, openQ: null }); },
      publish: () => { if (!canPublish) return; this.setState((p) => ({ version: p.version + 1, versions: [{ n: p.version + 1, at: '19/11/2026 12:06 PM' }].concat(p.versions), dirty: false })); },
      publishDisabled: !canPublish, publishBg: canPublish ? '#046ded' : '#a9cdf0', publishTitle: probs.length ? 'Fix the problems first' : (s.dirty ? 'Publish the draft' : 'Nothing to publish'),
      flowMap: flowMap, secMsgs: secMsgs, secInq: secInq, ed: ed, pv: pv, confirmAr: M.confirmQ.ar,
      goSettings: () => this.setState({ admTab: 'settings' }),
      noProblems: probs.length === 0, hasProblems: probs.length > 0, problemsTitle: probs.length + ' item' + (probs.length > 1 ? 's' : '') + ' need content', problems: problems,
      probOpen: s.probOpen, probOpenStr: s.probOpen ? 'true' : 'false', probCaret: s.probOpen ? '▴' : '▾', toggleProblems: () => this.setState({ probOpen: !s.probOpen }),
      versions: s.versions.map((v, i) => ({ n: v.n, at: v.at, state: i === 0 ? (s.dirty ? 'Live · draft has changes' : 'Live') : 'Previous', fg: i === 0 ? '#0b7a2e' : '#5b7280' })),
      /* settings / flags / records */
      set: set, topicOptions: topicOpts, orgSummary: orgSummary,
      flagLegend: flagLegend, flagRows: flagRows, noFlagRows: flagRows.length === 0,
      recRows: recRows, noRecords: recRows.length === 0, recTitle: rc ? 'Request #' + rc.id + ' · full history' : 'Select a conversation',
      recHasTicket: !!rt, recTicket: rt ? { ref: '#' + rt.id, topic: (rt.topic || STUDENT_TOPICS[0]).ar, details: 'Student inquiry: ' + rt.inquiry + (rt.files && rt.files.length ? ' · 📎 ' + rt.files.length + ' image(s): ' + rt.files.join(', ') : '') } : { ref: '', topic: '', details: '' },
      recHistory: rc ? rc.msgs.map((m) => ({ who: whoL[m.who], text: (m.title ? m.title + '\n' : '') + m.text })) : []
    };
  }
}
