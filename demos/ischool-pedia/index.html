<div style="padding: 24px 32px; font-size: 16px; line-height: 2; white-space: pre-line">يجب تحقيق النسب المطلوبة لعناصر التدريب الأساسية كي يتمكن التلميذ من الاستمرار في المبادرة:
1- لمعرفة معايير الحضور والاستمرار لدى المبادرة، من القائمة اختر "المصادر".
2- سوف تجد ملف "دليل التلميذ" الذي يوضح تفاصيل المنهج التعليمي الذي سوف يتم دراسته.
3- الاطلاع على المحتوى التدريبي على المنصة بنسبة 70% أو أكثر.
4- حضور الجلسات الافتراضية الأسبوعية بنسبة 75% أو أكثر.
5- حضور الجلسات التطبيقية المقررة بنسبة 50% أو أكثر.
6- اجتياز الاختبارات المقررة بنسبة 60% أو أكثر.

ملحوظة: في حالة غياب التلميذ/التلميذة عن حضور الجلسة الافتراضية، يرجى مراجعة ملخص الجلسة ومواد القراءة الخاصة بالدرس الذي تم التغيب فيه وأداء الاختبار، وعدم تكرار الغياب. وذلك للحفاظ على الاستمرار في المبادرة وعدم التعرض للاستبعاد.</div>
</template>
<template data-sc="if" value="{{isEn}}" hint-placeholder-val="{{ false }}">
<div dir="ltr" style="padding: 24px 32px; font-size: 16px; line-height: 1.9; white-space: pre-line; text-align: left">To continue in the initiative, the student must reach the required rate in each core training element:
1- To see the initiative's attendance and continuation criteria, choose "Resources" from the menu.
2- You will find the "Student Guide" file, which explains the curriculum you will study.
3- View 70% or more of the training content on the platform.
4- Attend 75% or more of the weekly virtual sessions.
5- Attend 50% or more of the scheduled practical sessions.
6- Pass 60% or more of the scheduled exams.

Note: If the student misses a virtual session, please review the session summary and the reading materials for that lesson, take the quiz, and avoid repeated absences — to stay in the initiative and avoid exclusion.</div>

<main style="max-width: 1280px; margin: 0 auto; padding: 28px 24px 64px; display: flex; flex-direction: column; gap: 22px">
<div style="display: flex; flex-wrap: wrap; align-items: flex-end; gap: 16px">
<div style="flex: 1; min-width: 280px; display: flex; flex-direction: column; gap: 8px">
<div style="display: flex; flex-wrap: wrap; gap: 8px">
<span class="chip" style="background: #E9F7EF; color: #0F6B3A">Flow</span>
<span class="chip" style="background: #EEF3FC; color: #0A4FA8">DEMI · DECI</span>
<span class="chip" style="background: #F4F6FA; color: #3B465C">590 تذكرة ذكرت المشروع في سبتمبر</span>

<h1 style="margin: 0; font-family: 'Readex Pro', sans-serif; font-size: 32px">الطالب عنده مشكلة في المشروع النهائي</h1>
</div>
<button type="button" onClick="{{restart}}" style="font-family: inherit; font-size: 15px; padding: 10px 18px; min-height: 44px; border: 1px solid #D5DBE6; background: #fff; color: #3B465C; border-radius: 10px; cursor: pointer">ابدأ من الأول</button>
</div>

<div style="display: flex; flex-wrap: wrap; gap: 28px; align-items: flex-start">

<section style="flex: 999 1 640px; min-width: 0; display: flex; flex-direction: column; gap: 16px" aria-live="polite">

<ol aria-label="المسار" style="list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; font-size: 14px">
<template data-sc="for" list="{{crumbs}}" as="c" hint-placeholder-count="2">
<li style="display: flex; align-items: center; gap: 8px"><span style="background: #fff; border: 1px solid #E3E7EF; border-radius: 999px; padding: 5px 12px; color: #3B465C">{{c.label}}</span><span style="color: #9AA4B6">←</span></li>
</template>
<li style="font-weight: 600; color: #0A5FCC">{{stepLabel}}</li>
</ol>

<template data-sc="if" value="{{isQuestion}}" hint-placeholder-val="{{ true }}">
<div class="card" style="padding: 28px 32px; display: flex; flex-direction: column; gap: 18px">
<div style="display: flex; align-items: center; gap: 12px">
<span style="width: 36px; height: 36px; border-radius: 50%; background: #0A6FE8; color: #fff; display: flex; align-items: center; justify-content: center; font-family: 'Readex Pro', sans-serif; font-weight: 700">{{stepNo}}</span>
<h2 style="margin: 0; font-family: 'Readex Pro', sans-serif; font-size: 22px">{{node.q}}</h2>
</div>
<p style="margin: 0; font-size: 15px; color: #5A6478">{{node.hint}}</p>
<div style="display: flex; flex-direction: column; gap: 10px">
<template data-sc="for" list="{{options}}" as="o" hint-placeholder-count="4">
<button type="button" class="opt" onClick="{{o.pick}}">
<span style="width: 10px; height: 10px; border-radius: 50%; border: 2px solid #0A6FE8; flex: none"></span>
<span style="flex: 1">{{o.label}}</span>
<span style="font-size: 13px; color: #5A6478">{{o.note}}</span>
</button>
</template>
</div>
</div>
</template>

<template data-sc="if" value="{{isResult}}" hint-placeholder-val="{{ false }}">
<div class="card" style="overflow: hidden">
<div style="padding: 22px 28px; background: {{node.band}}; display: flex; flex-wrap: wrap; align-items: center; gap: 12px">
<span class="chip" style="background: #fff; color: {{node.ink}}; font-weight: 700">{{node.tag}}</span>
<h2 style="margin: 0; font-family: 'Readex Pro', sans-serif; font-size: 22px; color: {{node.ink}}; flex: 1">{{node.title}}</h2>
</div>
<div style="padding: 24px 28px; display: flex; flex-direction: column; gap: 16px">
<p style="margin: 0; font-size: 16px; line-height: 1.9; white-space: pre-line">{{node.body}}</p>
<div style="background: #F4F6FA; border-radius: 14px; padding: 18px 20px; display: flex; flex-direction: column; gap: 10px">
<div style="display: flex; align-items: center; justify-content: space-between; gap: 10px">
<span style="font-weight: 700">السكريبت</span>
<button type="button" style="display: flex; align-items: center; gap: 8px; font-family: inherit; font-size: 14px; font-weight: 600; border: 0; border-radius: 10px; padding: 9px 16px; min-height: 44px; cursor: pointer; background: #FFD400; color: #14213D">
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="11" height="11" rx="2"></rect><path d="M5 15V5a2 2 0 0 1 2-2h8"></path></svg>
Copy Script</button>
</div>
<p style="margin: 0; font-size: 15px; line-height: 1.9; white-space: pre-line; color: #273248">{{node.script}}</p>
</div>
<div style="display: flex; flex-wrap: wrap; gap: 10px">
<button type="button" style="font-family: inherit; font-size: 15px; font-weight: 600; padding: 10px 20px; min-height: 44px; border: 0; background: #0F6B3A; color: #fff; border-radius: 10px; cursor: pointer">اتحلت — اقفل التذكرة</button>
<button type="button" style="font-family: inherit; font-size: 15px; padding: 10px 20px; min-height: 44px; border: 1px solid #D5DBE6; background: #fff; color: #3B465C; border-radius: 10px; cursor: pointer">{{node.escalate}}</button>
<button type="button" onClick="{{back}}" style="font-family: inherit; font-size: 15px; padding: 10px 20px; min-height: 44px; border: 0; background: transparent; color: #0A5FCC; border-radius: 10px; cursor: pointer">رجوع خطوة</button>
</div>
</div>
</div>
</template>
</section>

<aside style="flex: 1 1 300px; min-width: 0; display: flex; flex-direction: column; gap: 20px">
<section class="card" style="padding: 20px" aria-labelledby="h-fill">
<h2 id="h-fill" style="margin: 0 0 12px; font-family: 'Readex Pro', sans-serif; font-size: 17px">في التذكرة سجّل</h2>
<dl style="margin: 0; display: grid; grid-template-columns: auto 1fr; gap: 10px 14px; font-size: 14px">
<dt style="color: #5A6478">Topic</dt><dd style="margin: 0; font-weight: 600">Report a Problem / inquiry</dd>
<dt style="color: #5A6478">Department</dt><dd style="margin: 0; font-weight: 600">{{dept}}</dd>
<dt style="color: #5A6478">Tag</dt><dd style="margin: 0; font-weight: 600">final-project</dd>
</dl>
</section>
<section class="card" style="padding: 20px" aria-labelledby="h-ask">
<h2 id="h-ask" style="margin: 0 0 10px; font-family: 'Readex Pro', sans-serif; font-size: 17px">اطلب من الطالب</h2>
<ul style="margin: 0; padding-inline-start: 18px; font-size: 14px; line-height: 2; color: #273248">
<li>Student ID (مثال: DECI4S-S-XXXXXX)</li>
<li>صورة شاشة لرسالة الخطأ</li>
<li>اسم المستوى (L1–L4) واسم الملف</li>
</ul>
</section>
<section style="background: #FFF6D6; border: 1px solid #F2D675; border-radius: 16px; padding: 18px 20px; font-size: 14px; color: #5C3D00; line-height: 1.8">

</section>
</aside>

renderVals() {
const N = this.nodes();
const path = this.state.path;
const id = path[path.length - 1];
const node = N[id];
const isQ = !!node.options;
return {
node,
isQuestion: isQ, isResult: !isQ,
stepNo: path.length,
stepLabel: isQ ? 'سؤال ' + path.length : 'الحل',

};
}

    var m = /^(\s*)([\s\S]*?)(\s*)$/.exec(str), core = m[2];
    if (DICT[core] != null) return m[1] + DICT[core] + m[3];
    for (var i = 0; i < RULES.length; i++) if (RULES[i][0].test(core)) return m[1] + core.replace(RULES[i][0], RULES[i][1]) + m[3];
    var seps = [' — ', ' · ', ' / '];
    for (var j = 0; j < seps.length; j++) {
      if (core.indexOf(seps[j]) > 0) return m[1] + core.split(seps[j]).map(T).join(seps[j]) + m[3];
    }
    return str;
  }
  var UI = {
    ar: { lbl: 'الشاشة', prev: '→ السابقة', next: 'التالية ←', lang: 'English', agent: 'CS Agent', admin: 'Admin', prevA: 'الشاشة السابقة', nextA: 'الشاشة التالية', langA: 'Switch to English' },
    en: { lbl: 'Screen', prev: '← Previous', next: 'Next →', lang: 'عربي', agent: 'CS Agent', admin: 'Admin', prevA: 'Previous screen', nextA: 'Next screen', langA: 'التبديل للعربي' }
  };
  var LABELS_EN = {"Main": "Home & search", "Article": "Article page", "Flow": "Step-by-step Flow", "AdminHome": "Control center", "AdminContent": "Content library", "AdminEditor": "Article editor", "AdminFlow": "Flow builder", "AdminStructure": "Programs, sections & home", "AdminEscalation": "Escalation matrix", "AdminUpdates": "Updates & Memos", "AdminUsers": "Users & permissions", "AdminInsights": "Content gaps"};
  window.__PEDIA_LANG = LANG;
  var META = {"Main": {"title": "iSchool Pedia — الرئيسية", "defaults": {}}, "Article": {"title": "Pedia — معايير الحضور والاستمرار", "defaults": {}}, "Flow": {"title": "Pedia — Flow رفع المشروع النهائي", "defaults": {}}, "AdminHome": {"title": "Pedia Admin — مركز التحكم", "defaults": {}}, "AdminContent": {"title": "Pedia Admin — مكتبة المحتوى", "defaults": {}}, "AdminEditor": {"title": "Pedia Admin — محرر المقالات", "defaults": {}}, "AdminFlow": {"title": "Pedia Admin — بناء الـ Flow", "defaults": {}}, "AdminStructure": {"title": "Pedia Admin — البرامج والأقسام والرئيسية", "defaults": {}}, "AdminEscalation": {"title": "Pedia Admin — مصفوفة التصعيد", "defaults": {}}, "AdminUpdates": {"title": "Pedia Admin — التحديثات والـ Memos", "defaults": {}}, "AdminUsers": {"title": "Pedia Admin — المستخدمين والصلاحيات", "defaults": {}}, "AdminInsights": {"title": "Pedia Admin — فجوات المحتوى", "defaults": {}}, "AdminNav": {"title": "Pedia Admin — القائمة الجانبية", "defaults": {"active": "home"}}};
  var HOLE = /\{\{\s*([^}]+?)\s*\}\}/g;
  var WHOLE = /^\s*\{\{\s*([^}]+?)\s*\}\}\s*$/;
  var current = null, instances = {}, classes = {}, templates = {};

  function DCLogic(props) { this.props = props || {}; this.state = {}; }
  DCLogic.prototype.setState = function (p) {
    var next = typeof p === 'function' ? p(this.state, this.props) : p;
    this.state = Object.assign({}, this.state, next);
    render();
  };
  DCLogic.prototype.forceUpdate = function () { render(); };
  DCLogic.prototype.renderVals = function () { return {}; };
  // allow ES6 "class extends DCLogic"
  var DCBase = class { constructor(props) { this.props = props || {}; this.state = {}; } };
  DCBase.prototype.setState = DCLogic.prototype.setState;
  DCBase.prototype.forceUpdate = DCLogic.prototype.forceUpdate;
  DCBase.prototype.renderVals = DCLogic.prototype.renderVals;

  function getClass(name) {
    if (!classes[name]) {
      var code = document.getElementById('code-' + name).textContent;
      classes[name] = new Function('DCLogic', code + '\n;return Component;')(DCBase);
    }
    return classes[name];
  }
  function getTemplate(name) {
    if (!templates[name]) {
      var t = document.createElement('template');
      t.innerHTML = document.getElementById('tpl-' + name).textContent;
      templates[name] = t.content;
    }
    return templates[name];
  }
  function lookup(expr, scope) {
    expr = expr.trim();
    if (expr === 'true') return true;
    if (expr === 'false') return false;
    if (expr === 'null') return null;
    if (/^-?\d+(\.\d+)?$/.test(expr)) return Number(expr);
    if (/^(['"]).*\1$/.test(expr)) return expr.slice(1, -1);
    var parts = expr.split('.'), v = scope;
    for (var i = 0; i < parts.length; i++) {

  function interp(str, scope) {

  }
  function child(scope, extra) { var s = Object.create(scope); Object.assign(s, extra); return s; }

  function renderChildren(src, scope, out) {
    for (var n = src.firstChild; n; n = n.nextSibling) renderNode(n, scope, out);
  }
  function renderNode(n, scope, out) {
    if (n.nodeType === 3) { out.appendChild(document.createTextNode(interp(T(n.nodeValue), scope))); return; }
    if (n.nodeType !== 1) return;
    var tag = n.localName;
    if (tag === 'template' && n.dataset.sc) {
      if (n.dataset.sc === 'for') {
        var m = WHOLE.exec(n.getAttribute('list') || '');
        var list = m ? lookup(m[1], scope) : [];
        var as = n.getAttribute('as') || 'item';
        (list || []).forEach(function (item, i) {
          var x = {}; x[as] = item; x.$index = i;
          renderChildren(n.content, child(scope, x), out);
        });
      } else {
        var mv = WHOLE.exec(n.getAttribute('value') || '');
        if (mv && lookup(mv[1], scope)) renderChildren(n.content, scope, out);
      }
      return;
    }
    if (tag === 'dc-import') {
      var props = {};
      Array.prototype.forEach.call(n.attributes, function (a) {
        if (a.name === 'name' || a.name.indexOf('hint-') === 0) return;
        var key = a.name.replace(/-([a-z])/g, function (_, c) { return c.toUpperCase(); });
        var w = WHOLE.exec(a.value);
        props[key] = w ? lookup(w[1], scope) : interp(a.value, scope);
      });
      out.appendChild(mount(n.getAttribute('name'), props, current + ':' + n.getAttribute('name')));
      return;
    }
    var el = n.namespaceURI && n.namespaceURI !== 'http://www.w3.org/1999/xhtml'
      ? document.createElementNS(n.namespaceURI, n.tagName)
      : document.createElement(tag);
    Array.prototype.forEach.call(n.attributes, function (a) {
      var name = a.name, w = WHOLE.exec(a.value);
      if (/^on[a-z]+$/.test(name)) {
        var fn = w ? lookup(w[1], scope) : null;
        if (typeof fn === 'function') el.addEventListener(name.slice(2), function (ev) { fn(ev); });
        return;
      }
      if (w && (name === 'checked' || name === 'selected' || name === 'disabled')) {
        if (lookup(w[1], scope)) el.setAttribute(name, '');
        return;
      }
      if (name === 'classname') name = 'class';
      var val = a.value;
      if (/^(placeholder|aria-label|value|title|alt|label)$/.test(name)) val = T(val);
      if (LANG === 'en' && name === 'dir' && val === 'rtl') val = 'ltr';
      if (LANG === 'en' && name === 'style') val = val.replace(/text-align:\s*right/g, 'text-align: left');
      el.setAttribute(name, interp(val, scope));
    });
    if (tag === 'template') { renderChildren(n.content, scope, el.content); }
    else renderChildren(n, scope, el);
    out.appendChild(el);
  }
  function mount(name, props, key) {
    var Cls = getClass(name);
    var p = Object.assign({}, (META[name] || {}).defaults, props || {});
    var inst = instances[key];
    if (!inst) { inst = new Cls(p); instances[key] = inst; }
    inst.props = p;
    var vals = inst.renderVals() || {};
    var frag = document.createDocumentFragment();
    renderChildren(getTemplate(name), vals, frag);
    return frag;
  }

  var root = document.getElementById('screen');
  function render() {
    if (!current) return;
    var y = window.scrollY;
    var frag = mount(current, {}, current);
    root.replaceChildren(frag);
    window.scrollTo(0, y);
  }
  function go(id, hash) {
    if (!META[id]) id = 'Main';
    var changed = id !== current;
    current = id;
    document.getElementById('screen-css').textContent =
      document.getElementById('css-' + id).textContent + '\n' + document.getElementById('css-AdminNav').textContent.replace(/body\{margin:0\}/, '');
    document.title = LANG === 'en' ? 'iSchool Pedia — ' + LABELS_EN[id] : META[id].title;
    render();
    pick.value = id;
    var idx = SCREENS.findIndex(function (s) { return s.id === id; });
    pos.textContent = (idx + 1) + ' / ' + SCREENS.length;
    if (hash) {
      var t = document.getElementById(hash.slice(1));
      if (t) { t.scrollIntoView({ block: 'start' }); return; }
    }
    if (changed) window.scrollTo(0, 0);
  }
  function route() {
    var m = /^#\/([A-Za-z]+)(?:\/(.*))?$/.exec(location.hash);
    go(m ? m[1] : 'Main', m && m[2] ? '#' + m[2] : null);
  }
  function navigate(id, hash) {
    var target = '#/' + id + (hash ? '/' + hash.slice(1) : '');
    if (location.hash === target) route(); else location.hash = target;
  }

  var pick = document.getElementById('proto-pick');
  var pos = document.getElementById('proto-pos');
  function buildBar() {
    var u = UI[LANG];
    document.documentElement.lang = LANG;
    document.documentElement.dir = LANG === 'en' ? 'ltr' : 'rtl';
    document.getElementById('proto-lbl').textContent = u.lbl;
    var pv = document.getElementById('proto-prev'), nx = document.getElementById('proto-next'), lg = document.getElementById('proto-lang');
    pv.textContent = u.prev; pv.setAttribute('aria-label', u.prevA);
    nx.textContent = u.next; nx.setAttribute('aria-label', u.nextA);
    lg.textContent = u.lang; lg.setAttribute('aria-label', u.langA);
    pick.replaceChildren();
    ['Agent', 'Admin'].forEach(function (g) {
      var og = document.createElement('optgroup');
      og.label = g === 'Agent' ? u.agent : u.admin;
      SCREENS.filter(function (s) { return s.group === g; }).forEach(function (s) {
        var o = document.createElement('option'); o.value = s.id;
        o.textContent = LANG === 'en' ? LABELS_EN[s.id] : s.label; og.appendChild(o);
      });
      pick.appendChild(og);
    });
    if (current) pick.value = current;
  }
  buildBar();
  document.getElementById('proto-lang').addEventListener('click', function () {
    LANG = LANG === 'en' ? 'ar' : 'en';
    window.__PEDIA_LANG = LANG; Object.keys(instances).forEach(function (k) { if (k.indexOf('Article') === 0) delete instances[k]; });
    try { localStorage.setItem('pedia-lang', LANG); } catch (e) {}
    buildBar(); render();
    document.title = LANG === 'en' ? 'iSchool Pedia — ' + LABELS_EN[current] : META[current].title;
  });
  pick.addEventListener('change', function () { navigate(pick.value); });
  function step(d) {
    var i = SCREENS.findIndex(function (s) { return s.id === current; });
    navigate(SCREENS[(i + d + SCREENS.length) % SCREENS.length].id);
  }
  document.getElementById('proto-prev').addEventListener('click', function () { step(-1); });
  document.getElementById('proto-next').addEventListener('click', function () { step(1); });

  document.addEventListener('click', function (ev) {
    var a = ev.target.closest && ev.target.closest('a[href]');
    if (!a || !root.contains(a)) return;
    var href = a.getAttribute('href');
    var m = /^([A-Za-z]+)\.dc\.html(#.+)?$/.exec(href);
    if (m) { ev.preventDefault(); navigate(m[1], m[2]); return; }
    if (href.charAt(0) === '#') {
      ev.preventDefault();
      if (href.length > 1) { var t = document.getElementById(href.slice(1)); if (t) t.scrollIntoView({ behavior: 'smooth', block: 'start' }); }
    }
  });
  document.addEventListener('submit', function (ev) { ev.preventDefault(); });
  window.addEventListener('hashchange', route);
  route();
})();
