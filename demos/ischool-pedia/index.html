<!doctype html>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Baloo+Bhaijaan+2:wght@500;600;700&display=swap" rel="stylesheet">
<style>

#proto-bar b{font-family:'Readex Pro',sans-serif;font-size:15px}

<style id="screen-css"></style>

<body>

<b>iSchool Pedia</b><span class="tag">Prototype</span>
<a href="../../index.html" id="ischool-pedia-hub-link" style="color:#FFD400; text-decoration:none; font-weight:700; font-size:13px; display:inline-flex; align-items:center; gap:6px; margin-right:12px; background:rgba(255,255,255,0.12); padding:4px 12px; border-radius:8px;" title="العودة إلى البوابة الرئيسية">← العودة إلى B2G Demo Hub</a>
<span class="sp"></span>
<button type="button" id="proto-lang" class="lang"></button>
<label for="proto-pick" class="count" id="proto-lbl"></label>
<select id="proto-pick"></select>
<button type="button" id="proto-prev"></button>
<button type="button" id="proto-next"></button>
<span class="count" id="proto-pos"></span>
</div>
<div id="screen"></div>
<script type="text/x-tpl" id="tpl-Dashboard">

<div dir="rtl" style="font-family: 'Somar Rounded', 'IBM Plex Sans Arabic', sans-serif; color: #14213D; background: #F2F8FD; min-height: 100vh; display: flex; flex-wrap: wrap">

<div style="flex: 1 1 248px; background: #043FAD">
<dc-import name="AppNav" active="dashboard" role="{{role}}" org="{{org}}" on-role="{{setRole}}" on-org="{{setOrg}}" hint-size="260px,1100px"></dc-import>
</div>

<main style="flex: 999 1 640px; min-width: 0; padding: 24px 28px 64px; box-sizing: border-box; display: flex; flex-direction: column; gap: 20px">

<div style="position: relative; overflow: hidden; display: flex; flex-wrap: wrap; align-items: center; gap: 16px; padding: 26px 28px; border-radius: 24px; background: #056FEC; color: #fff">
<span aria-hidden="true" style="position: absolute; width: 220px; height: 220px; border-radius: 50%; border: 28px solid #FFD700; left: -70px; top: -110px; opacity: 0.9"></span>
<span aria-hidden="true" style="position: absolute; width: 36px; height: 36px; border-radius: 50%; background: #FF7F1C; left: 150px; bottom: 22px"></span>
<div style="position: relative; flex: 1; min-width: 260px">
<span style="display: inline-block; font-size: 13px; font-weight: 600; padding: 4px 14px; border-radius: 999px; background: #043FAD; color: #fff">الخميس 15 أكتوبر 2026 · {{orgName}}</span>
<h1 style="margin: 8px 0 0; font-family: 'Somar Rounded', 'Baloo Bhaijaan 2', sans-serif; font-size: 30px">صباح الخير يا {{who}}</h1>
</div>
<a href="Assistant.dc.html" style="position: relative; display: inline-flex; align-items: center; gap: 8px; font-size: 15px; font-weight: 700; padding: 10px 18px; min-height: 44px; box-sizing: border-box; border-radius: 999px; background: #FFD700; color: #14213D">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l1.8 4.7L18.5 9.5l-4.7 1.8L12 16l-1.8-4.7L5.5 9.5l4.7-1.8z"></path></svg>
الصق تذكرة للمساعد</a>
</div>

<div style="position: relative">
<form role="search" class="card" onSubmit="{{noop}}" style="display: flex; align-items: center; gap: 10px; padding: 6px 8px 6px 16px; border: 2px solid #056FEC">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#043FAD" stroke-width="2.2" stroke-linecap="round" style="margin-inline-start: 8px; flex: none"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg>
<label for="gq" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">بحث شامل</label>
<input id="gq" type="search" value="{{q}}" onInput="{{onQ}}" placeholder="ابحث في الدليل والمشكلات والقوالب والسجل — مثال: المحتوى، الغياب، المشروع" style="flex: 1; min-width: 0; border: 0; outline: none; font-family: inherit; font-size: 16px; padding: 12px 4px; color: #14213D; background: transparent">
</form>
<template data-sc="if" value="{{hasQ}}" hint-placeholder-val="{{ false }}">
<div class="card" style="margin-top: 8px; padding: 6px 0; box-shadow: 0 8px 24px rgba(10,47,91,0.12)" aria-live="polite">
<div style="padding: 8px 18px; font-size: 13px; color: #5A6478">{{resultCount}} نتيجة لـ «{{q}}»</div>
<template data-sc="for" list="{{results}}" as="r" hint-placeholder-count="4">
<a href="{{r.href}}" class="row">
<span class="chip" style="background: {{r.bg}}; color: {{r.fg}}; min-width: 64px; justify-content: center">{{r.kind}}</span>
<span style="display: flex; flex-direction: column; gap: 2px; flex: 1; min-width: 0"><span style="font-weight: 600">{{r.title}}</span><span style="font-size: 13px; color: #5A6478">{{r.meta}}</span></span>

</template>
<template data-sc="if" value="{{noResults}}" hint-placeholder-val="{{ false }}"><p style="margin: 0; padding: 12px 18px; color: #5A6478">لا توجد نتائج — جرّب كلمة أخرى أو الصق التذكرة للمساعد.</p></template>
</div>
</template>
</div>

<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 14px">
<a href="Issues.dc.html" class="card" style="padding: 16px 18px; color: #14213D; border-color: #FFC9A0"><div style="font-size: 13px; color: #A14A06">مشكلات نشطة</div><div style="font-family: 'Somar Rounded', 'Baloo Bhaijaan 2', sans-serif; font-size: 32px; font-weight: 700; color: #A14A06">{{kActive}}</div><div style="font-size: 13px; color: #5A6478">{{kMon}} قيد المتابعة</div></a>
<a href="Guide.dc.html" class="card" style="padding: 16px 18px; color: #14213D"><div style="font-size: 13px; color: #5A6478">مواضيع في الدليل</div><div style="font-family: 'Somar Rounded', 'Baloo Bhaijaan 2', sans-serif; font-size: 32px; font-weight: 700">10</div><div style="font-size: 13px; color: #5A6478">3 حُدّثت هذا الأسبوع</div></a>
<a href="Activities.dc.html" class="card" style="padding: 16px 18px; color: #14213D"><div style="font-size: 13px; color: #5A6478">مراسلات أكتوبر</div><div style="font-family: 'Somar Rounded', 'Baloo Bhaijaan 2', sans-serif; font-size: 32px; font-weight: 700">3</div><div style="font-size: 13px; color: #5A6478">آخرها اليوم</div></a>
<a href="Templates.dc.html" class="card" style="padding: 16px 18px; color: #14213D"><div style="font-size: 13px; color: #5A6478">قوالب SMS</div><div style="font-family: 'Somar Rounded', 'Baloo Bhaijaan 2', sans-serif; font-size: 32px; font-weight: 700">7</div><div style="font-size: 13px; color: #5A6478">جاهزة للنسخ</div></a>
</div>

<div style="display: flex; flex-wrap: wrap; gap: 20px; align-items: flex-start">

<section class="card" style="flex: 999 1 460px; min-width: 0; padding: 6px 0 4px" aria-labelledby="h-iss">
<div style="display: flex; align-items: center; justify-content: space-between; padding: 12px 18px">
<h2 id="h-iss" style="margin: 0; font-family: 'Somar Rounded', 'Baloo Bhaijaan 2', sans-serif; font-size: 18px">مشكلات معروفة الآن</h2>
<a href="Issues.dc.html" style="font-size: 14px; font-weight: 600">كل المشكلات ←</a>

<template data-sc="for" list="{{issues}}" as="i" hint-placeholder-count="4">

<span style="display: flex; flex-direction: column; gap: 2px; flex: 1; min-width: 0"><span style="font-weight: 600">{{i.title}}</span><span style="font-size: 13px; color: #5A6478">{{i.meta}}</span></span>
</a>
</template>
<template data-sc="if" value="{{noIssues}}" hint-placeholder-val="{{ false }}"><p style="margin: 0; padding: 14px 18px; color: #0F6B3A; font-weight: 600">لا توجد مشكلات نشطة لهذه المؤسسة.</p></template>
</section>

<section class="card" style="flex: 1 1 340px; min-width: 0; padding: 6px 0 4px" aria-labelledby="h-act">
<div style="display: flex; align-items: center; justify-content: space-between; padding: 12px 18px">
<h2 id="h-act" style="margin: 0; font-family: 'Somar Rounded', 'Baloo Bhaijaan 2', sans-serif; font-size: 18px">آخر ما أُرسل للطلاب</h2>
<a href="Activities.dc.html" style="font-size: 14px; font-weight: 600">السجل ←</a>
</div>
<template data-sc="for" list="{{acts}}" as="a" hint-placeholder-count="4">
<a href="Activities.dc.html" class="row">
<span class="chip" style="background: {{a.bg}}; color: {{a.fg}}">{{a.type}}</span>
<span style="display: flex; flex-direction: column; gap: 2px; flex: 1; min-width: 0"><span style="font-weight: 600; font-size: 14px">{{a.desc}}</span><span style="font-size: 13px; color: #5A6478">{{a.meta}}</span></span>
</a>

<section aria-labelledby="h-sec">
<h2 id="h-sec" style="margin: 0 0 12px; font-family: 'Somar Rounded', 'Baloo Bhaijaan 2', sans-serif; font-size: 18px">الأقسام</h2>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px">
<a href="Guide.dc.html" class="card" style="padding: 16px; display: flex; flex-direction: column; gap: 6px; color: #14213D"><span style="width: 32px; height: 32px; border-radius: 50%; background: #ECF8FF; color: #043FAD; display: flex; align-items: center; justify-content: center; font-family: 'Somar Rounded', 'Baloo Bhaijaan 2', sans-serif; font-weight: 700">1</span><b>دليل المعلومات</b><span style="font-size: 13px; color: #5A6478">الإجراء والتحقق والملاحظات لكل موضوع</span></a>
<a href="Issues.dc.html" class="card" style="padding: 16px; display: flex; flex-direction: column; gap: 6px; color: #14213D"><span style="width: 32px; height: 32px; border-radius: 50%; background: #FFEEDF; color: #A14A06; display: flex; align-items: center; justify-content: center; font-family: 'Somar Rounded', 'Baloo Bhaijaan 2', sans-serif; font-weight: 700">2</span><b>المشكلات الحالية</b><span style="font-size: 13px; color: #5A6478">مشكلات الطلاب والحسابات المعروفة</span></a>
<a href="Activities.dc.html" class="card" style="padding: 16px; display: flex; flex-direction: column; gap: 6px; color: #14213D"><span style="width: 32px; height: 32px; border-radius: 50%; background: #FFF7D1; color: #7A5200; display: flex; align-items: center; justify-content: center; font-family: 'Somar Rounded', 'Baloo Bhaijaan 2', sans-serif; font-weight: 700">3</span><b>الإشعارات والإيميلات</b><span style="font-size: 13px; color: #5A6478">ما أُرسل ومتى ولأي مؤسسة</span></a>
<a href="Templates.dc.html" class="card" style="padding: 16px; display: flex; flex-direction: column; gap: 6px; color: #14213D"><span style="width: 32px; height: 32px; border-radius: 50%; background: #E9F7EF; color: #0F6B3A; display: flex; align-items: center; justify-content: center; font-family: 'Somar Rounded', 'Baloo Bhaijaan 2', sans-serif; font-weight: 700">4</span><b>قوالب SMS</b><span style="font-size: 13px; color: #5A6478">رسائل جاهزة بضغطة نسخ</span></a>
<a href="Transfer.dc.html" class="card" style="padding: 16px; display: flex; flex-direction: column; gap: 6px; color: #14213D"><span style="width: 32px; height: 32px; border-radius: 50%; background: #E1F5FF; color: #03679A; display: flex; align-items: center; justify-content: center; font-family: 'Somar Rounded', 'Baloo Bhaijaan 2', sans-serif; font-weight: 700">5</span><b>تحويل التذاكر</b><span style="font-size: 13px; color: #5A6478">إلى أين ومتى وكيف</span></a>
</div>
</section>
</main>
</div>
</script>
<script type="text/x-css" id="css-Dashboard">
a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid #056FEC;outline-offset:2px}
body{margin:0;background:#F2F8FD}
a{color:#043FAD;text-decoration:none}a:hover{color:#032F82}
.card{background:#fff;border:1px solid #DCE9F5;border-radius:16px}
a.card{transition:border-color .15s,box-shadow .15s}a.card:hover{border-color:#056FEC;box-shadow:0 4px 16px rgba(10,47,91,0.08)}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap}
.row{display:flex;gap:12px;align-items:flex-start;padding:12px 18px;border-top:1px solid #E6F0F9;color:#14213D}
a.row:hover{background:#ECF8FF}

/* iSchool steps + motion (shared) */
.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;counter-reset:pdst}
.steps>li{counter-increment:pdst;position:relative;display:flex;gap:14px;align-items:flex-start;padding-bottom:14px}
.steps>li:last-child{padding-bottom:0}
.steps>li::before{content:counter(pdst);flex:none;width:30px;height:30px;border-radius:50%;background:#056FEC;color:#fff;font-family:'Somar Rounded','Baloo Bhaijaan 2',sans-serif;font-weight:700;font-size:14px;line-height:30px;text-align:center;position:relative;z-index:1;box-shadow:0 0 0 4px #fff}
.steps>li::after{content:"";position:absolute;inset-inline-start:14px;top:34px;bottom:4px;width:2px;border-radius:2px;background:#CAE2F0}
.steps>li:last-child::after{display:none}
.steps>li>span{padding-top:1px;min-width:0}
.steps.sm>li::before{width:26px;height:26px;font-size:13px;line-height:26px}
.steps.sm>li::after{inset-inline-start:12px;top:30px}
.steps.on-tint>li::before{box-shadow:0 0 0 4px #F2F8FD}
.steps>li.done::before{content:"\2713";background:#0F6B3A}
.steps>li.todo::before{background:#fff;color:#5A6478;box-shadow:inset 0 0 0 2px #9DBCDB,0 0 0 4px #fff}
.vchk{appearance:none;-webkit-appearance:none;margin:1px 0 0;flex:none;width:26px;height:26px;border-radius:50%;border:2px solid #9DBCDB;background:#fff;display:grid;place-content:center;cursor:pointer;transition:background-color .18s,border-color .18s}
.vchk::after{content:"";width:6px;height:11px;border:solid #fff;border-width:0 2.5px 2.5px 0;transform:translate(0,-1px) rotate(45deg) scale(0);transition:transform .2s cubic-bezier(.3,1.6,.5,1)}
.vchk:checked{background:#0F6B3A;border-color:#0F6B3A}
.vchk:checked::after{transform:translate(0,-1px) rotate(45deg) scale(1)}
.pbar{height:6px;border-radius:999px;background:#E6F0F9;overflow:hidden}
.pbar>span{display:block;height:100%;border-radius:999px;background:#0F6B3A;transition:width .3s ease}
@keyframes pdRise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes pdFade{from{opacity:0}to{opacity:1}}
@keyframes pdPop{0%{opacity:0;transform:scale(.6)}70%{transform:scale(1.08)}100%{opacity:1;transform:none}}
@keyframes pdDraw{from{stroke-dashoffset:var(--len,800)}to{stroke-dashoffset:0}}
@media (prefers-reduced-motion:no-preference){
main>*{animation:pdRise .3s cubic-bezier(.2,.7,.2,1) both}
main>*:nth-child(2){animation-delay:0.04s}main>*:nth-child(3){animation-delay:0.08s}main>*:nth-child(4){animation-delay:0.12s}main>*:nth-child(5){animation-delay:0.16s}main>*:nth-child(6){animation-delay:0.20s}main>*:nth-child(7){animation-delay:0.24s}main>*:nth-child(8){animation-delay:0.28s}
.pd-in{animation:pdRise .28s cubic-bezier(.2,.7,.2,1) both}
.steps>li{animation:pdRise .28s cubic-bezier(.2,.7,.2,1) both}
.steps>li:nth-child(2){animation-delay:0.05s}.steps>li:nth-child(3){animation-delay:0.10s}.steps>li:nth-child(4){animation-delay:0.15s}.steps>li:nth-child(5){animation-delay:0.20s}.steps>li:nth-child(6){animation-delay:0.25s}.steps>li:nth-child(7){animation-delay:0.30s}.steps>li:nth-child(8){animation-delay:0.35s}
.pd-pop{animation:pdPop .3s cubic-bezier(.2,.7,.2,1) both}
a.card,.lift{transition:transform .18s ease,box-shadow .18s ease,border-color .18s ease}
a.card:hover,.lift:hover{transform:translateY(-2px);box-shadow:0 10px 24px -14px rgba(4,63,173,.45);border-color:#B1D1E6}
.btn,.copy,.tab,.opt,.topic,.perm,.sample,button.chip,a.chip{transition:background-color .18s,color .18s,border-color .18s,box-shadow .18s,transform .12s,filter .15s}
.btn:active,.copy:active,.tab:active,.opt:active,.perm:active,.sample:active{transform:scale(.97)}
}
</script>

.sample{font-family:inherit;text-align:start;background:#fff;border:1px solid #C9DCEE;border-radius:12px;padding:10px 14px;min-height:44px;cursor:pointer;color:#273248;font-size:14px;line-height:1.6;display:flex;flex-direction:column;gap:2px}
.sample:hover{border-color:#056FEC;background:#ECF8FF}
.dot{width:8px;height:8px;border-radius:50%;background:#056FEC;display:inline-block;animation:pd 1s infinite ease-in-out}
@keyframes pd{0%,80%,100%{opacity:.25}40%{opacity:1}}

/* iSchool steps + motion (shared) */
.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;counter-reset:pdst}
.steps>li{counter-increment:pdst;position:relative;display:flex;gap:14px;align-items:flex-start;padding-bottom:14px}
.steps>li:last-child{padding-bottom:0}
.steps>li::before{content:counter(pdst);flex:none;width:30px;height:30px;border-radius:50%;background:#056FEC;color:#fff;font-family:'Somar Rounded','Baloo Bhaijaan 2',sans-serif;font-weight:700;font-size:14px;line-height:30px;text-align:center;position:relative;z-index:1;box-shadow:0 0 0 4px #fff}
.steps>li::after{content:"";position:absolute;inset-inline-start:14px;top:34px;bottom:4px;width:2px;border-radius:2px;background:#CAE2F0}
.steps>li:last-child::after{display:none}
.steps>li>span{padding-top:1px;min-width:0}
.steps.sm>li::before{width:26px;height:26px;font-size:13px;line-height:26px}
.steps.sm>li::after{inset-inline-start:12px;top:30px}
.steps.on-tint>li::before{box-shadow:0 0 0 4px #F2F8FD}
.steps>li.done::before{content:"\2713";background:#0F6B3A}
.steps>li.todo::before{background:#fff;color:#5A6478;box-shadow:inset 0 0 0 2px #9DBCDB,0 0 0 4px #fff}
.vchk{appearance:none;-webkit-appearance:none;margin:1px 0 0;flex:none;width:26px;height:26px;border-radius:50%;border:2px solid #9DBCDB;background:#fff;display:grid;place-content:center;cursor:pointer;transition:background-color .18s,border-color .18s}
.vchk::after{content:"";width:6px;height:11px;border:solid #fff;border-width:0 2.5px 2.5px 0;transform:translate(0,-1px) rotate(45deg) scale(0);transition:transform .2s cubic-bezier(.3,1.6,.5,1)}
.vchk:checked{background:#0F6B3A;border-color:#0F6B3A}
.vchk:checked::after{transform:translate(0,-1px) rotate(45deg) scale(1)}
.pbar{height:6px;border-radius:999px;background:#E6F0F9;overflow:hidden}
.pbar>span{display:block;height:100%;border-radius:999px;background:#0F6B3A;transition:width .3s ease}
@keyframes pdRise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes pdFade{from{opacity:0}to{opacity:1}}
@keyframes pdPop{0%{opacity:0;transform:scale(.6)}70%{transform:scale(1.08)}100%{opacity:1;transform:none}}
@keyframes pdDraw{from{stroke-dashoffset:var(--len,800)}to{stroke-dashoffset:0}}
@media (prefers-reduced-motion:no-preference){
main>*{animation:pdRise .3s cubic-bezier(.2,.7,.2,1) both}
main>*:nth-child(2){animation-delay:0.04s}main>*:nth-child(3){animation-delay:0.08s}main>*:nth-child(4){animation-delay:0.12s}main>*:nth-child(5){animation-delay:0.16s}main>*:nth-child(6){animation-delay:0.20s}main>*:nth-child(7){animation-delay:0.24s}main>*:nth-child(8){animation-delay:0.28s}
.pd-in{animation:pdRise .28s cubic-bezier(.2,.7,.2,1) both}
.steps>li{animation:pdRise .28s cubic-bezier(.2,.7,.2,1) both}
.steps>li:nth-child(2){animation-delay:0.05s}.steps>li:nth-child(3){animation-delay:0.10s}.steps>li:nth-child(4){animation-delay:0.15s}.steps>li:nth-child(5){animation-delay:0.20s}.steps>li:nth-child(6){animation-delay:0.25s}.steps>li:nth-child(7){animation-delay:0.30s}.steps>li:nth-child(8){animation-delay:0.35s}
.pd-pop{animation:pdPop .3s cubic-bezier(.2,.7,.2,1) both}
a.card,.lift{transition:transform .18s ease,box-shadow .18s ease,border-color .18s ease}
a.card:hover,.lift:hover{transform:translateY(-2px);box-shadow:0 10px 24px -14px rgba(4,63,173,.45);border-color:#B1D1E6}
.btn,.copy,.tab,.opt,.topic,.perm,.sample,button.chip,a.chip{transition:background-color .18s,color .18s,border-color .18s,box-shadow .18s,transform .12s,filter .15s}
.btn:active,.copy:active,.tab:active,.opt:active,.perm:active,.sample:active{transform:scale(.97)}
}

].map(s => ({ ...s, pick: () => this.analyze(s.text, 'تذكرة من سبتمبر') }));
const side = last ? { topic: 'Report a Problem / inquiry', dept: last.dept, tag: 'final-project', ask: last.ask.map(t => ({ t })) }
: { topic: '—', dept: '—', tag: '—', ask: [{ t: 'Student ID' }] };
return {
thread, samples, side,
role: this.pdRole(), org: st.org || 'ALL',
setRole: (r) => this.pdSetRole(r), setOrg: (o) => this.setState({ org: o }),
emptyWarn: st.emptyWarn,
onDraft: (e) => { this.draft = e.target.value; },
onKey: (e) => { if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') { e.preventDefault(); this.analyze(this.draft); this.draft = ''; } },
submit: (e) => { if (e && e.preventDefault) e.preventDefault(); this.analyze(this.draft); this.draft = ''; },
reset: () => { this.draft = ''; this.setState({ thread: [], outcome: {}, copied: {}, noteCopied: {}, fb: {}, emptyWarn: false }); }
};
}
resolve(i, res, matches) {
const th = this.state.thread.slice();
th[i] = { role: 'bot', res, matches };
this.setState({ thread: th });
}
}
</script>

<script type="text/x-css" id="css-Guide">
a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid #056FEC;outline-offset:2px}

.copy:hover{border-color:#056FEC}

/* iSchool steps + motion (shared) */
.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;counter-reset:pdst}
.steps>li{counter-increment:pdst;position:relative;display:flex;gap:14px;align-items:flex-start;padding-bottom:14px}
.steps>li:last-child{padding-bottom:0}
.steps>li::before{content:counter(pdst);flex:none;width:30px;height:30px;border-radius:50%;background:#056FEC;color:#fff;font-family:'Somar Rounded','Baloo Bhaijaan 2',sans-serif;font-weight:700;font-size:14px;line-height:30px;text-align:center;position:relative;z-index:1;box-shadow:0 0 0 4px #fff}
.steps>li::after{content:"";position:absolute;inset-inline-start:14px;top:34px;bottom:4px;width:2px;border-radius:2px;background:#CAE2F0}
.steps>li:last-child::after{display:none}
.steps>li>span{padding-top:1px;min-width:0}
.steps.sm>li::before{width:26px;height:26px;font-size:13px;line-height:26px}
.steps.sm>li::after{inset-inline-start:12px;top:30px}
.steps.on-tint>li::before{box-shadow:0 0 0 4px #F2F8FD}
.steps>li.done::before{content:"\2713";background:#0F6B3A}
.steps>li.todo::before{background:#fff;color:#5A6478;box-shadow:inset 0 0 0 2px #9DBCDB,0 0 0 4px #fff}
.vchk{appearance:none;-webkit-appearance:none;margin:1px 0 0;flex:none;width:26px;height:26px;border-radius:50%;border:2px solid #9DBCDB;background:#fff;display:grid;place-content:center;cursor:pointer;transition:background-color .18s,border-color .18s}
.vchk::after{content:"";width:6px;height:11px;border:solid #fff;border-width:0 2.5px 2.5px 0;transform:translate(0,-1px) rotate(45deg) scale(0);transition:transform .2s cubic-bezier(.3,1.6,.5,1)}
.vchk:checked{background:#0F6B3A;border-color:#0F6B3A}
.vchk:checked::after{transform:translate(0,-1px) rotate(45deg) scale(1)}
.pbar{height:6px;border-radius:999px;background:#E6F0F9;overflow:hidden}
.pbar>span{display:block;height:100%;border-radius:999px;background:#0F6B3A;transition:width .3s ease}
@keyframes pdRise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes pdFade{from{opacity:0}to{opacity:1}}
@keyframes pdPop{0%{opacity:0;transform:scale(.6)}70%{transform:scale(1.08)}100%{opacity:1;transform:none}}

@media (prefers-reduced-motion:no-preference){

.pd-in{animation:pdRise .28s cubic-bezier(.2,.7,.2,1) both}
.steps>li{animation:pdRise .28s cubic-bezier(.2,.7,.2,1) both}
.steps>li:nth-child(2){animation-delay:0.05s}.steps>li:nth-child(3){animation-delay:0.10s}.steps>li:nth-child(4){animation-delay:0.15s}.steps>li:nth-child(5){animation-delay:0.20s}.steps>li:nth-child(6){animation-delay:0.25s}.steps>li:nth-child(7){animation-delay:0.30s}.steps>li:nth-child(8){animation-delay:0.35s}

<div><label class="lbl" for="f-st">الحالة</label><select id="f-st" class="inp" onChange="{{fStatus}}"><option value="active">نشطة</option><option value="monitoring">قيد المتابعة</option><option value="resolved">محلولة</option></select></div>
</div>
<fieldset style="border: 0; margin: 0; padding: 0">
<legend class="lbl">الفئة <span style="color: #A14A06">*</span></legend>
<div style="display: flex; flex-wrap: wrap; gap: 8px">
<label style="display: flex; align-items: center; gap: 8px; padding: 10px 14px; border: 1px solid #C9DCEE; border-radius: 10px; font-size: 14px"><input type="radio" name="cat" checked="" onChange="{{fStudent}}" style="accent-color: #056FEC"> مشكلة طلاب</label>
<label style="display: flex; align-items: center; gap: 8px; padding: 10px 14px; border: 1px solid #C9DCEE; border-radius: 10px; font-size: 14px"><input type="radio" name="cat" onChange="{{fAccount}}" style="accent-color: #056FEC"> مشكلة حسابات</label>
</div>
</fieldset>
<div><label class="lbl" for="f-t">عنوان مختصر <span style="color: #A14A06">*</span></label><input id="f-t" class="inp" onInput="{{fTitle}}" placeholder="مثال: محتوى الأسبوع 3 لا يعمل"></div>
<div><label class="lbl" for="f-d">الوصف</label><textarea id="f-d" class="inp" rows="3" onInput="{{fDesc}}" placeholder="ما الذي يحدث، ومن يتأثر، وما الحل المؤقت إن وُجد"></textarea></div>
<div style="display: flex; flex-wrap: wrap; align-items: center; gap: 10px">
<span style="font-size: 13px; color: #5A6478">تاريخ ووقت التسجيل: يُضاف تلقائياً</span>
<template data-sc="if" value="{{formErr}}" hint-placeholder-val="{{ false }}"><span style="font-size: 13px; color: #A14A06; font-weight: 600">اكتب عنواناً للمشكلة.</span></template>
<span style="flex: 1"></span>
<button type="button" class="btn" onClick="{{closeForm}}" style="border: 0; background: transparent; color: #043FAD">إلغاء</button>
<button type="submit" class="btn" style="background: #056FEC; border-color: #056FEC; color: #fff">حفظ ونشر للفريق</button>
</div>
</form>
</template>

<div role="tablist" aria-label="فئة المشكلة" style="display: flex; flex-wrap: wrap; gap: 4px; border-bottom: 1px solid #DCE9F5">
<template data-sc="for" list="{{tabs}}" as="t" hint-placeholder-count="2">
<button type="button" role="tab" class="tab" aria-selected="{{t.on}}" onClick="{{t.pick}}" style="color: {{t.fg}}; border-bottom: 3px solid {{t.line}}; font-weight: {{t.fw}}">{{t.label}} <span style="font-size: 12px; font-weight: 700; background: {{t.cbg}}; color: {{t.cfg}}; border-radius: 999px; padding: 1px 8px">{{t.count}}</span></button>
</template>
</div>

<div style="display: flex; flex-wrap: wrap; align-items: center; gap: 8px" role="group" aria-label="الحالة">
<template data-sc="for" list="{{filters}}" as="f" hint-placeholder-count="4">
<button type="button" class="fchip" onClick="{{f.pick}}" aria-pressed="{{f.on}}" style="border: 1px solid {{f.border}}; background: {{f.bg}}; color: {{f.fg}}">{{f.label}} · {{f.count}}</button>
</template>
<span style="margin-inline-start: auto; font-size: 13px; color: #5A6478">المؤسسة: <b style="color: #14213D">{{orgName}}</b></span>
</div>

<div style="display: flex; flex-direction: column; gap: 12px" aria-live="polite">
<template data-sc="for" list="{{rows}}" as="r" hint-placeholder-count="3">
<article class="card" style="padding: 18px 20px; display: flex; flex-direction: column; gap: 10px">
<div style="display: flex; flex-wrap: wrap; align-items: center; gap: 8px">
<span class="chip" style="background: {{r.sbg}}; color: {{r.sfg}}"><span style="width: 8px; height: 8px; border-radius: 50%; background: {{r.bar}}"></span>{{r.statusLabel}}</span>
<span class="chip" style="background: #ECF8FF; color: #043FAD">{{r.orgLabel}}</span>
<span class="chip" style="background: #F2F8FD; color: #3B465C">{{r.catLabel}}</span>
<span style="font-size: 12px; color: #5A6478; margin-inline-start: auto" dir="ltr">{{r.id}}</span>
</div>
<h2 style="margin: 0; font-family: 'Somar Rounded', 'Baloo Bhaijaan 2', sans-serif; font-size: 19px">{{r.title}}</h2>
<p style="margin: 0; font-size: 15px; line-height: 1.8; color: #273248">{{r.desc}}</p>
<div style="display: flex; flex-wrap: wrap; align-items: center; gap: 8px 18px; font-size: 13px; color: #5A6478">
<span>سُجّلت: <b style="color: #273248">{{r.reported}}</b></span>
<span>آخر تحديث: <b style="color: #273248">{{r.updated}}</b></span>
<span>بواسطة: {{r.by}}</span>
</div>
<div style="display: flex; flex-wrap: wrap; gap: 8px; padding-top: 4px">
<template data-sc="if" value="{{r.hasTpl}}" hint-placeholder-val="{{ true }}">
<button type="button" class="btn" onClick="{{r.copy}}" style="background: #FFD700; border-color: #FFD700; color: #14213D">{{r.copyLabel}}</button>
</template>
<a href="Guide.dc.html" class="btn">الموضوع في الدليل</a>
<template data-sc="if" value="{{r.canEdit}}" hint-placeholder-val="{{ true }}">
<button type="button" class="btn" onClick="{{r.cycle}}">{{r.nextLabel}}</button>
</template>
</div>
</article>
</template>
<template data-sc="if" value="{{empty}}" hint-placeholder-val="{{ false }}">
<div class="card" style="padding: 28px; text-align: center; color: #5A6478">لا توجد مشكلات بهذه الحالة لـ {{orgName}}. إذا كانت المشكلة جديدة، أبلغ مستخدماً مخوّلاً لتسجيلها.</div>
</template>
</div>
</main>
</div>
</script>

.steps>li>span{padding-top:1px;min-width:0}
.steps.sm>li::before{width:26px;height:26px;font-size:13px;line-height:26px}
.steps.sm>li::after{inset-inline-start:12px;top:30px}
.steps.on-tint>li::before{box-shadow:0 0 0 4px #F2F8FD}

.vchk:checked{background:#0F6B3A;border-color:#0F6B3A}

.steps>li:nth-child(2){animation-delay:0.05s}.steps>li:nth-child(3){animation-delay:0.10s}.steps>li:nth-child(4){animation-delay:0.15s}.steps>li:nth-child(5){animation-delay:0.20s}.steps>li:nth-child(6){animation-delay:0.25s}.steps>li:nth-child(7){animation-delay:0.30s}.steps>li:nth-child(8){animation-delay:0.35s}
.pd-pop{animation:pdPop .3s cubic-bezier(.2,.7,.2,1) both}
a.card,.lift{transition:transform .18s ease,box-shadow .18s ease,border-color .18s ease}
a.card:hover,.lift:hover{transform:translateY(-2px);box-shadow:0 10px 24px -14px rgba(4,63,173,.45);border-color:#B1D1E6}
.btn,.copy,.tab,.opt,.topic,.perm,.sample,button.chip,a.chip{transition:background-color .18s,color .18s,border-color .18s,box-shadow .18s,transform .12s,filter .15s}
.btn:active,.copy:active,.tab:active,.opt:active,.perm:active,.sample:active{transform:scale(.97)}
}

<label for="sq" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">ابحث في القوالب</label>
<input id="sq" class="inp" type="search" value="{{q}}" onInput="{{onQ}}" placeholder="ابحث في القوالب" style="margin-bottom: 6px">
<template data-sc="for" list="{{list}}" as="t" hint-placeholder-count="6">
<button type="button" class="tpl" onClick="{{t.pick}}" aria-current="{{t.cur}}" style="background: {{t.bg}}; border-color: {{t.border}}">
<span style="display: flex; align-items: center; gap: 8px; width: 100%"><span style="font-weight: 700; font-size: 15px; flex: 1">{{t.name}}</span><span class="chip" style="background: {{t.sbg}}; color: {{t.sfg}}">{{t.scopeLabel}}</span></span>
<span style="font-size: 13px; color: #5A6478; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; width: 100%">{{t.body}}</span>
</button>
</template>
<template data-sc="if" value="{{empty}}" hint-placeholder-val="{{ false }}"><p style="margin: 8px; font-size: 14px; color: #5A6478">لا توجد قوالب مطابقة.</p></template>
</aside>

<section style="flex: 999 1 520px; min-width: 0; display: flex; flex-direction: column; gap: 16px" aria-live="polite">

<template data-sc="if" value="{{viewing}}" hint-placeholder-val="{{ true }}">
<div class="card pd-in" style="padding: 22px 24px; display: flex; flex-direction: column; gap: 16px">
<div style="display: flex; flex-wrap: wrap; align-items: center; gap: 10px">
<h2 style="margin: 0; font-family: 'Somar Rounded', 'Baloo Bhaijaan 2', sans-serif; font-size: 22px; flex: 1; min-width: 200px">{{cur.name}}</h2>
<span class="chip" style="background: {{cur.sbg}}; color: {{cur.sfg}}">{{cur.scopeLabel}}</span>
<template data-sc="if" value="{{auth}}" hint-placeholder-val="{{ true }}"><button type="button" class="btn" onClick="{{edit}}">تعديل</button></template>
</div>
<div role="group" aria-label="لغة القالب" style="display: flex; gap: 6px">
<button type="button" class="btn" onClick="{{setAr}}" aria-pressed="{{arOn}}" style="min-height: 38px; padding: 6px 14px; background: {{arBg}}; color: {{arFg}}; border-color: {{arBd}}">عربي</button>
<button type="button" class="btn" onClick="{{setEn}}" aria-pressed="{{enOn}}" style="min-height: 38px; padding: 6px 14px; background: {{enBg}}; color: {{enFg}}; border-color: {{enBd}}">English</button>
</div>
<div style="display: flex; justify-content: center; padding: 20px; border-radius: 16px; background: #E6F0F9">
<div style="width: 100%; max-width: 380px; display: flex; flex-direction: column; gap: 6px">
<span style="font-size: 12px; color: #5A6478; text-align: center">iSchool</span>
<p dir="{{dir}}" style="margin: 0; padding: 14px 16px; border-radius: 18px; background: #fff; font-size: 15px; line-height: 1.8; color: #14213D; box-shadow: 0 1px 2px rgba(20,33,61,0.08); white-space: pre-line">{{text}}</p>
</div>
</div>
<div style="display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px; font-size: 13px; color: #5A6478">
<span>{{len}} حرفاً</span><span>·</span><span>{{segs}}</span>
<template data-sc="if" value="{{hasVars}}" hint-placeholder-val="{{ false }}"><span>·</span><span>استبدل قبل الإرسال: <b style="color: #A14A06">{{vars}}</b></span></template>
<span style="margin-inline-start: auto">آخر تحديث {{cur.updated}}</span>
</div>
<button type="button" class="btn" onClick="{{copy}}" style="align-self: flex-start; background: #FFD700; border-color: #FFD700; color: #14213D; font-size: 15px; padding: 10px 22px">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="11" height="11" rx="2"></rect><path d="M5 15V5a2 2 0 0 1 2-2h8"></path></svg>
{{copyLabel}}</button>
</div>
</template>

<template data-sc="if" value="{{editing}}" hint-placeholder-val="{{ false }}">
<form class="card" onSubmit="{{save}}" style="padding: 22px 24px; display: flex; flex-direction: column; gap: 14px; border: 2px solid #056FEC">
<h2 style="margin: 0; font-family: 'Somar Rounded', 'Baloo Bhaijaan 2', sans-serif; font-size: 18px">{{formTitle}}</h2>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px">
<div><label class="lbl" for="tn">اسم القالب <span style="color: #A14A06">*</span></label><input id="tn" class="inp" value="{{draftName}}" onInput="{{onName}}"></div>
<div><label class="lbl" for="ts">النطاق</label><select id="ts" class="inp" onChange="{{onScope}}"><option value="{{draftScope}}">{{draftScopeLabel}}</option><option value="ALL">عام لكل المؤسسات</option><option value="DEMI">DEMI</option><option value="DECI">DECI</option><option value="DEMI_S">DEMI Summer</option><option value="DECI_S">DECI Summer</option></select></div>
</div>
<div><label class="lbl" for="tb">النص بالعربية <span style="color: #A14A06">*</span></label><textarea id="tb" class="inp" rows="4" onInput="{{onBody}}">{{draftBody}}</textarea>
<span style="font-size: 12px; color: #5A6478">رسالة SMS العربية: 70 حرفاً للرسالة الواحدة، و67 لكل جزء بعدها. استخدم {اسم_الطالب} للمتغيرات.</span></div>
<div><label class="lbl" for="te">English text</label><textarea id="te" class="inp" rows="3" dir="ltr" onInput="{{onEn}}">{{draftEn}}</textarea></div>
<div style="display: flex; flex-wrap: wrap; align-items: center; gap: 10px">
<template data-sc="if" value="{{formErr}}" hint-placeholder-val="{{ false }}"><span style="font-size: 13px; color: #A14A06; font-weight: 600">اسم القالب والنص العربي مطلوبان.</span></template>
<span style="flex: 1"></span>
<button type="button" class="btn" onClick="{{cancel}}" style="border: 0; background: transparent; color: #043FAD">إلغاء</button>
<button type="submit" class="btn" style="background: #056FEC; border-color: #056FEC; color: #fff">حفظ القالب</button>
</div>
</form>
</template>
</section>
</div>
</main>
</div>
</script>
<script type="text/x-css" id="css-Templates">
a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid #056FEC;outline-offset:2px}
body{margin:0;background:#F2F8FD}
a{color:#043FAD;text-decoration:none}a:hover{color:#032F82}
.card{background:#fff;border:1px solid #DCE9F5;border-radius:16px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap}
.btn{font-family:inherit;font-size:14px;font-weight:600;padding:9px 16px;min-height:44px;box-sizing:border-box;border-radius:999px;cursor:pointer;display:inline-flex;align-items:center;gap:8px;border:1px solid #C9DCEE;background:#fff;color:#273248;transition:filter .15s}
.btn:hover{filter:brightness(.96)}
.inp{width:100%;box-sizing:border-box;font-family:inherit;font-size:14px;line-height:1.7;padding:9px 12px;border:1px solid #C9DCEE;border-radius:10px;background:#fff;color:#14213D;min-height:44px}

.tpl:hover{background:#ECF8FF}

/* iSchool steps + motion (shared) */
.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;counter-reset:pdst}
.steps>li{counter-increment:pdst;position:relative;display:flex;gap:14px;align-items:flex-start;padding-bottom:14px}
.steps>li:last-child{padding-bottom:0}
.steps>li::before{content:counter(pdst);flex:none;width:30px;height:30px;border-radius:50%;background:#056FEC;color:#fff;font-family:'Somar Rounded','Baloo Bhaijaan 2',sans-serif;font-weight:700;font-size:14px;line-height:30px;text-align:center;position:relative;z-index:1;box-shadow:0 0 0 4px #fff}
.steps>li::after{content:"";position:absolute;inset-inline-start:14px;top:34px;bottom:4px;width:2px;border-radius:2px;background:#CAE2F0}
.steps>li:last-child::after{display:none}
.steps>li>span{padding-top:1px;min-width:0}
.steps.sm>li::before{width:26px;height:26px;font-size:13px;line-height:26px}
.steps.sm>li::after{inset-inline-start:12px;top:30px}
.steps.on-tint>li::before{box-shadow:0 0 0 4px #F2F8FD}
.steps>li.done::before{content:"\2713";background:#0F6B3A}
.steps>li.todo::before{background:#fff;color:#5A6478;box-shadow:inset 0 0 0 2px #9DBCDB,0 0 0 4px #fff}
.vchk{appearance:none;-webkit-appearance:none;margin:1px 0 0;flex:none;width:26px;height:26px;border-radius:50%;border:2px solid #9DBCDB;background:#fff;display:grid;place-content:center;cursor:pointer;transition:background-color .18s,border-color .18s}
.vchk::after{content:"";width:6px;height:11px;border:solid #fff;border-width:0 2.5px 2.5px 0;transform:translate(0,-1px) rotate(45deg) scale(0);transition:transform .2s cubic-bezier(.3,1.6,.5,1)}
.vchk:checked{background:#0F6B3A;border-color:#0F6B3A}
.vchk:checked::after{transform:translate(0,-1px) rotate(45deg) scale(1)}
.pbar{height:6px;border-radius:999px;background:#E6F0F9;overflow:hidden}
.pbar>span{display:block;height:100%;border-radius:999px;background:#0F6B3A;transition:width .3s ease}
@keyframes pdRise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes pdFade{from{opacity:0}to{opacity:1}}
@keyframes pdPop{0%{opacity:0;transform:scale(.6)}70%{transform:scale(1.08)}100%{opacity:1;transform:none}}
@keyframes pdDraw{from{stroke-dashoffset:var(--len,800)}to{stroke-dashoffset:0}}
@media (prefers-reduced-motion:no-preference){
main>*{animation:pdRise .3s cubic-bezier(.2,.7,.2,1) both}
main>*:nth-child(2){animation-delay:0.04s}main>*:nth-child(3){animation-delay:0.08s}main>*:nth-child(4){animation-delay:0.12s}main>*:nth-child(5){animation-delay:0.16s}main>*:nth-child(6){animation-delay:0.20s}main>*:nth-child(7){animation-delay:0.24s}main>*:nth-child(8){animation-delay:0.28s}
.pd-in{animation:pdRise .28s cubic-bezier(.2,.7,.2,1) both}
.steps>li{animation:pdRise .28s cubic-bezier(.2,.7,.2,1) both}
.steps>li:nth-child(2){animation-delay:0.05s}.steps>li:nth-child(3){animation-delay:0.10s}.steps>li:nth-child(4){animation-delay:0.15s}.steps>li:nth-child(5){animation-delay:0.20s}.steps>li:nth-child(6){animation-delay:0.25s}.steps>li:nth-child(7){animation-delay:0.30s}.steps>li:nth-child(8){animation-delay:0.35s}
.pd-pop{animation:pdPop .3s cubic-bezier(.2,.7,.2,1) both}
a.card,.lift{transition:transform .18s ease,box-shadow .18s ease,border-color .18s ease}
a.card:hover,.lift:hover{transform:translateY(-2px);box-shadow:0 10px 24px -14px rgba(4,63,173,.45);border-color:#B1D1E6}
.btn,.copy,.tab,.opt,.topic,.perm,.sample,button.chip,a.chip{transition:background-color .18s,color .18s,border-color .18s,box-shadow .18s,transform .12s,filter .15s}
.btn:active,.copy:active,.tab:active,.opt:active,.perm:active,.sample:active{transform:scale(.97)}
}
</script>

.steps.sm>li::before{width:26px;height:26px;font-size:13px;line-height:26px}
.steps.sm>li::after{inset-inline-start:12px;top:30px}
.steps.on-tint>li::before{box-shadow:0 0 0 4px #F2F8FD}

.vchk:checked{background:#0F6B3A;border-color:#0F6B3A}
.vchk:checked::after{transform:translate(0,-1px) rotate(45deg) scale(1)}
.pbar{height:6px;border-radius:999px;background:#E6F0F9;overflow:hidden}
.pbar>span{display:block;height:100%;border-radius:999px;background:#0F6B3A;transition:width .3s ease}
