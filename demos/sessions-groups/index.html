  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    // appifacts: only on tags now pointing at OUR blob: URLs. A reference the
    // bundler left live-fetched (an absolute x-import, a runtime dependency it
    // could not embed, an authored external script) keeps the pin it was
    // written with: that fetch is exactly what SRI protects. (A crossorigin
    // on a parent whose child carries the blob — <video crossorigin><source>
    // — is left alone too; the attribute is then the author's to drop.)
    template = template.replace(/<[a-z][^>]*>/gi, (tag) => /\s(?:src|href|srcset|poster|data|xlink:href)="blob:/i.test(tag) ? tag.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '') : tag);

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
    try {
      if (window.self === window.top) {
        const backBtn = document.createElement('a');
        backBtn.href = '../../index.html';
        backBtn.id = 'b2g-hub-back-pill';
        backBtn.innerHTML = '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="margin-left:6px;"><path d="m15 18-6-6 6-6"/></svg><span>العودة إلى B2G Demo Hub</span>';
        backBtn.style.cssText = 'position:fixed;top:16px;right:16px;z-index:999999;display:flex;align-items:center;background:rgba(11,19,43,0.92);color:#ffffff;padding:8px 18px;border-radius:999px;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;font-size:13px;font-weight:700;text-decoration:none;box-shadow:0 4px 18px rgba(0,0,0,0.3);border:1px solid rgba(255,255,255,0.25);backdrop-filter:blur(10px);cursor:pointer;transition:all 0.2s ease;';
        backBtn.onmouseover = () => { backBtn.style.transform = 'translateY(-2px)'; backBtn.style.background = '#056FEC'; };
        backBtn.onmouseout = () => { backBtn.style.transform = 'none'; backBtn.style.background = 'rgba(11,19,43,0.92)'; };
        document.body.appendChild(backBtn);
      }
    } catch(e) {}
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

dding: 10px 12px; color: #33415C\">Reports<\u002Fdiv>\n<div style=\"padding: 10px 12px; color: #33415C\">Settings<\u002Fdiv>\n<\u002Fnav>\n\n<main style=\"flex-grow: 1; min-width: 0; padding: 20px 24px 140px; box-sizing: border-box; display: flex; flex-direction: column; gap: 16px\">\n\n<div style=\"display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap\">\n<div style=\"display: flex; gap: 4px; font-size: 13px\">\n<div style=\"padding: 8px 14px; border-radius: 8px; background: #E8EEFC; color: #1D4ED8; font-weight: 500\">Classes<\u002Fdiv>\n<div style=\"padding: 8px 14px; color: #5B6478\">Manage<\u002Fdiv>\n<div style=\"padding: 8px 14px; color: #5B6478\">Late<\u002Fdiv>\n<div style=\"padding: 8px 14px; color: #5B6478\">Tutor Live Presence<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"font-size: 12.5px; color: #5B6478\">1 – 10 of 20 · Page 1 / 2<\u002Fdiv>\n<\u002Fdiv>\n\n<div style=\"display: flex; gap: 12px; flex-wrap: wrap; align-items: center\">\n<div style=\"height: 42px; min-width: 180px; border: 1px solid #D5DCE8; border-radius: 10px; background: #fff; display: flex; align-items: center; padding: 0 12px; font-size: 13px; gap: 8px; box-sizing: border-box\">\n<svg width=\"15\" height=\"15\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#5B6478\" stroke-width=\"2\" stroke-linecap=\"round\"><circle cx=\"11\" cy=\"11\" r=\"7\"><\u002Fcircle><path d=\"m20 20-3.5-3.5\"><\u002Fpath><\u002Fsvg><span style=\"color: #5B6478\">Search group ID<\u002Fspan><\u002Fdiv>\n<div style=\"height: 42px; min-width: 150px; border: 1px solid #D5DCE8; border-radius: 10px; background: #fff; display: flex; align-items: center; padding: 0 12px; font-size: 13px; box-sizing: border-box\">History<\u002Fdiv>\n<div style=\"height: 42px; min-width: 150px; border: 1px solid #D5DCE8; border-radius: 10px; background: #fff; display: flex; align-items: center; padding: 0 12px; font-size: 13px; box-sizing: border-box\">Online<\u002Fdiv>\n<div style=\"height: 42 l-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#1D6FE8\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M12 15V3M7 8l5-5 5 5M4 15v4a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-4\"><\u002Fpath><\u002Fsvg>\n<span style=\"font-size: 15px; font-weight: 500\">Drop your CSV here or click to choose<\u002Fspan>\n<span style=\"font-size: 12.5px; color: #5B6478\">Excel exports (.xlsx) work too<\u002Fspan>\n<\u002Fbutton>\n<div style=\"display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; background: #F8FAFC; border: 1px solid #E5E9F2; border-radius: 12px; padding: 12px 14px\">\n<div style=\"display: flex; gap: 6px; align-items: center; flex-wrap: wrap; font-size: 12.5px; color: #5B6478\">Columns:\n<span style=\"font-size: 11.5px; padding: 3px 8px; border-radius: 6px; background: #fff; border: 1px solid #DCE3EE; font-family: ui-monospace, monospace; color: #1D2B4F\">group_id<\u002Fspan>\n<span style=\"font-size: 12px; color: #5B6478\">only — one group per row<\u002Fspan>\n<\u002Fdiv>\n<button type=\"button\" class=\"chip\" style=\"background: #fff; color: #1D2B4F; border: 1px solid #C7D2E3\">Download template<\u002Fbutton>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{csvPaste}}\" hint-placeholder-val=\"{{ false }}\">\n<label for=\"csvtext\" style=\"font-size: 12.5px; color: #5B6478\">One group ID per line (G-41371 or just 41371). You can paste a column straight from Excel.<\u002Flabel>\n<textarea id=\"csvtext\" class=\"fld\" value=\"{{csvText}}\" sc-camel-on-change=\"{{setCsvText}}\" placeholder=\"G-41371\" style=\"height: 180px; padding: 12px; font-family: ui-monospace, monospace; font-size: 13px; resize: vertical\"><\u002Ftextarea>\n<\u002Fsc-if>\n<\u002Fsc-if>\n\n<sc-if value=\"{{csvReview}}\" hint-placeholder-val=\"{{ false }}\">\n<div style=\"display: flex; gap: 10px; flex-wrap: wrap; align-items: center\">\n<div style=\"background: #E3F6E8; color: #166534; border-radius: 10px; padding: 10px 14px; font-size: 13px\"><span style=\"font-weight: 600\">{{csvMatched}}<\u002Fspan> groups matched · {{csvSessCount}} sessions<\u002Fdiv>\n<div style=\"background: #FEF3C7; color: #92400E; border-radius: 10px; padding: 10px 14px; font-size: 13px\"><span style=\"font-weight: 600\">{{csvIssues}}<\u002Fspan> rows skipped<\u002Fdiv>\n<div style=\"font-size: 12.5px; color: #5B6478\">{{csvSource}}<\u002Fdiv>\n<div style=\"flex-grow: 1\"><\u002Fdiv>\n<button type=\"button\" class=\"chip\" sc-camel-on-click=\"{{csvRestart}}\" style=\"background: #fff; color: #1D2B4F; border: 1px solid #C7D2E3\">Use another list<\u002Fbutton>\n<\u002Fdiv>\n<div style=\"border: 1px solid #E5E9F2; border-radius: 12px; overflow-x: auto\">\n<sc-raw-table style=\"width: 100%; min-width: 560px; border-collapse: collapse; font-size: 12.5px\">\n<sc-raw-thead><sc-raw-tr style=\"text-align: left; color: #5B6478; font-size: 11px; text-transform: uppercase; letter-spacing: .04em; background: #F8FAFC\">\n<sc-raw-th style=\"padding: 10px 12px; font-weight: 500\">Line<\u002Fsc-raw-th><sc-raw-th style=\"padding: 10px 12px; font-weight: 500\">Group ID<\u002Fsc-raw-th><sc-raw-th style=\"padding: 10px 12px; font-weight: 500\">Level<\u002Fsc-raw-th><sc-raw-th style=\"padding: 10px 12px; font-weight: 500\">Sessions<\u002Fsc-raw-th><sc-raw-th style=\"padding: 10px 12px; font-weight: 500\">Result<\u002Fsc-raw-th>\n<\u002Fsc-raw-tr><\u002Fsc-raw-thead>\n<sc-raw-tbody>\n<sc-for list=\"{{csvRows}}\" as=\"cr\" hint-placeholder-count=\"5\">\n<sc-raw-tr style=\"border-top: 1px solid #EEF1F6; background: {{cr.bg}}\">\n<sc-raw-td style=\"padding: 9px 12px; color: #5B6478\">{{cr.n}}<\u002Fsc-raw-td>\n<sc-raw-td style=\"padding: 9px 12px\">{{cr.group}}<\u002Fsc-raw-td>\n<sc-raw-td style=\"padding: 9px 12px; color: #33415C\">{{cr.level}}<\u002Fsc-raw-td>\n<sc-raw-td style=\"padding: 9px 12px; white-space: nowrap\">{{cr.sessions}}<\u002Fsc-raw-td>\n<sc-raw-td style=\"padding: 9px 12px; white-space: nowrap\"><span style=\"{{cr.badge}}\">{{cr.result}}<\u002Fspan><\u002Fsc-raw-td>\n<\u002Fsc-raw-tr>\n<\u002Fsc-for>\n<\u002Fsc-raw-tbody>\n<\u002Fsc-raw-table>\n<\u002Fdiv>\n<\u002Fsc-if>\n<\u002Fdiv>\n\n<div style=\"padding: 16px 24px; border-top: 1px solid #E5E9F2; display: flex; gap: 10px; justify-content: flex-end\">\n<button type=\"button\" sc-camel-on-click=\"{{closeCsv}}\" style=\"font: inherit; font-size: 14px; height: 48px; padding: 0 20px; border-radius: 12px; border: 1px solid #C7D2E3; background: #fff; color: #1D2B4F; cursor: pointer\">Cancel<\u002Fbutton>\n<button type=\"button\" sc-camel-on-click=\"{{csvNext}}\" disabled=\"{{csvNextDisabled}}\" style=\"{{csvNextStyle}}\">{{csvNextLabel}}<\u002Fbutton>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:1440,&quot;height&quot;:1280}}\">\nvar DOW = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];\nvar MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];\nfunction pd(s){ var p = s.split('-').map(Number); return new Date(Date.UTC(p[0], p[1]-1, p[2])); }\nfunction iso(d){ return d.toISOString().slice(0,10); }\nfunction fmt(s){ var d = pd(s); return DOW[d.getUTCDay()] + ' ' + d.getUTCDate() + ' ' + MON[d.getUTCMonth()] + ' ' + d.getUTCFullYear(); }\nfunction addDays(s, n){ var d = pd(s); d.setUTCDate(d.getUTCDate() + n); return iso(d); }\nfunction ft(t){ var p = t.split(':').map(Number); var h = p[0] % 12 || 12; return (h < 10 ? '0' : '') + h + ':' + (p[1] < 10 ? '0' : '') + p[1] + ' ' + (p[0] >= 12 ? 'PM' : 'AM'); }\nfunction plural(n){ return n + ' session' + (n === 1 ? '' : 's'); }\n\nvar SEED = [\n  { id: 1,  group: 'G-41371', level: 'Data Science Level 3', date: '2026-08-12', time: '19:00', lesson: 'Semester 2 Capstone Project', rec: false, teacher: 'Fake 1', tid: 'T-15594' },\n  { id: 2,  group: 'G-41371', level: 'Data Science Level 3', date: '2026-08-05', time: '19:00', lesson: 'Data Ethics', rec: true, teacher: 'Fake 1', tid: 'T-15594' },\n  { id: 3,  group: 'G-41371', level: 'Data Science Level 3', date: '2026-07-29', time: '19:00', lesson: 'Introduction to Relational Databases and SQL', rec: false, teacher: 'Fake 1', tid: 'T-15594' },\n  { id: 4,  group: 'G-41371', level: 'Data Science Level 3', date: '2026-07-22', time: '19:00', lesson: 'Cloud Tools for Data Science', rec: false, teacher: 'Fake 1', tid: 'T-15594' },\n  { id: 5,  group: 'G-41388', level: 'Data Science Level 2', date: '2026-07-15', time: '19:00', lesson: 'Introduction to Version Control (Git and GitHub)', rec: false, teacher: 'Fake 1', tid: 'T-15594' },\n  { id: 6,  group: 'G-41388', level: 'Data Science Level 2', date: '2026-07-08', time: '19:00', lesson: 'Data Gathering Applications', rec: false, teacher: 'Fake 1', tid: 'T-15594' },\n  { id: 7,  group: 'G-41402', level: 'Data Science Level 3', date: '2026-07-01', time: '19:00', lesson: 'Data Gathering', rec: false, teacher: 'Fake 1', tid: 'T-15594' },\n  { id: 8,  group: 'G-41402', level: 'Data Science Level 3', date: '2026-06-24', time: '19:00', lesson: '[Lesson name]', rec: false, teacher: null, tid: '' },\n  { id: 9,  group: 'G-41415', level: '[Level name]', date: '2026-06-17', time: '19:00', lesson: '[Lesson name]', rec: true, teacher: null, tid: '' },\n  { id: 10, group: 'G-41415', level: '[Level name]', date: '2026-06-10', time: '19:00', lesson: '[Lesson name]', rec: false, teacher: null, tid: '' }\n];\nvar SUBS = [\n  { name: 'Fake 2', id: 'T-15601', kind: 'Cover tutor' },\n  { name: 'Fake 3', id: 'T-15622', kind: 'Cover tutor' },\n  { name: 'Fake 4', id: 'T-15710', kind: 'Tutor' }\n];\nvar CSV_SAMPLE = 'group_id\\nG-41371\\nG-41402\\n41415\\nG-41371\\nG-50012\\nG41-x';\nfunction parseList(text, rows) {\n  var out = [], seen = {}, n = 0;\n  text.split(/\\r?\\n/).forEach(function (line) {\n    n++;\n    var t = line.trim().replace(/^\"|\"$/g, '');\n    if (!t || /group/i.test(t)) return;\n    var m = /^(?:G-)?(\\d{3,})$/i.exec(t.split(/[,;\\t]/)[0].trim());\n    var g = m ? 'G-' + m[1] : t;\n    var item = { n: n, group: g, ids: [], level: '—', sessions: '—' };\n    if (!m) item.result = 'Not a valid group ID';\n    else if (seen[g]) item.result = 'Duplicate row';\n    else {\n      seen[g] = true;\n      var hits = rows.filter(function (r) { return r.group === g; });\n      if (!hits.length) item.result = 'No sessions in current filter';\n      else { item.ids = hits.map(function (r) { return r.id; }); item.level = hits[0].level; item.sessions = String(hits.length); item.result = 'Matched'; }\n    }\n    out.push(item);\n  });\n  return out;\n}\nvar TITLES = { reschedule: 'Reschedule', custom: 'Custom schedule', reassign: 'Reassign', unassign: 'Unassign tutor', freeze: 'Freeze sessions', recap: 'Create recap' };\nvar VERBS = { reschedule: 'Reschedule', custom: 'Save schedule for', reassign: 'Reassign', unassign: 'Unassign', freeze: 'Freeze', recap: 'Create recap for' };\n\nclass Component extends DCLogic {\n  constructor(props) {\n    super(props);\n    this.state = {\n      rows: SEED.map(function (r) { return Object.assign({ status: 'Active', recap: false }, r); }),\n      sel: {}, last: null, allPages: false,\n      action: null, excl: {}, rsMode: 'shift', days: 7, time: '19:00', custom: {},\n      sub: 'T-15601', email: true, mod: false, reason: '', notes: '', desc: '', payroll: true, skip: false,\n      toast: null, prev: null,\n      csvOpen: false, csvTab: 'upload', csvText: '', csvParsed: null, csvSource: ''\n    };\n  }\n  componentWillUnmount() { clearTimeout(this._t); }\n\n  setSel(ids, extra) {\n    var sel = {}; ids.forEach(function (id) { sel[id] = true; });\n    this.setState(Object.assign({ sel: sel, allPages: false }, extra || {}));\n  }\n  toggle(id, e) {\n    var st = this.state;\n    var ne = e && e.nativeEvent ? e.nativeEvent : e;\n    var shift = !!(ne && ne.shiftKey);\n    var sel = Object.assign({}, st.sel);\n    if (shift && st.last != null) {\n      var ids = st.rows.map(function (r) { return r.id; });\n      var a = ids.indexOf(st.last), b = ids.indexOf(id);\n      var lo = Math.min(a, b), hi = Math.max(a, b);\n      for (var i = lo; i <= hi; i++) sel[ids[i]] = true;\n    } else if (sel[id]) { delete sel[id]; } else { sel[id] = true; }\n    this.setState({ sel: sel, last: id, allPages: false });\n  }\n  open(key) {\n    var st = this.state, custom = {};\n    st.rows.forEach(function (r) { if (st.sel[r.id]) custom[r.id] = r.date; });\n    this.setState({ action: key, excl: {}, custom: custom, reason: '', notes: '', desc: '' });\n  }\n  single(id, key) {\n    var sel = {}; sel[id] = true;\n    this.setState({ sel: sel, last: id, allPages: false }, () => this.open(key));\n  }\n  skipReason(r, action) {\n    if (action === 'unassign' && !r.teacher) return 'No teacher assigned — will be skipped';\n    if (action === 'freeze' && r.status === 'Frozen') return 'Already frozen — will be skipped';\n    if (action === 'recap' && r.recap) return 'Recap already exists — will be skipped';\n    return null;\n  }\n  apply() {\n    var st = this.state, self = this, action = st.action;\n    var eff = st.rows.filter(function (r) { return st.sel[r.id] && !st.excl[r.id] && !self.skipReason(r, action); });\n    var ids = {}; eff.forEach(function (r) { ids[r.id] = true; });\n    var sub = SUBS.filter(function (s) { return s.id === st.sub; })[0];\n    var rows = st.rows.map(function (r) {\n      if (!ids[r.id]) return r;\n      var n = Object.assign({}, r);\n      if (action === 'reschedule') { if (st.rsMode === 'shift') n.date = addDays(r.date, st.days); n.time = st.time; }\n      if (action === 'custom') { n.date = st.custom[r.id] || r.date; n.time = st.time; }\n      if (action === 'reassign') { n.teacher = sub.name; n.tid = sub.id; }\n      if (action === 'unassign') { n.teacher = null; n.tid = ''; }\n      if (action === 'freeze') { n.status = 'Frozen'; }\n      if (action === 'recap') { n.recap = true; }\n      return n;\n    });\n
